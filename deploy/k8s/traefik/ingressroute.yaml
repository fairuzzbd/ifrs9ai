---
# Traefik IngressRoute — BLIPS services (TLS 1.3)
# Blue-green deploy: ubah weight di blips-api-weighted untuk shift traffic.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: tls13only
  namespace: blips
spec:
  minVersion: VersionTLS13
  sniStrict: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blips-api
  namespace: blips
  labels:
    app.kubernetes.io/name: blips-api
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`api.blips.tugu-re.com`) && PathPrefix(`/api/v1`)"
      kind: Rule
      services:
        - name: blips-api
          port: 80
  tls:
    options:
      name: tls13only
      namespace: blips
    secretName: blips-tls-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blips-web
  namespace: blips
  labels:
    app.kubernetes.io/name: blips-frontend
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`blips.tugu-re.com`)"
      kind: Rule
      services:
        - name: blips-frontend
          port: 80
  tls:
    options:
      name: tls13only
      namespace: blips
    secretName: blips-tls-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blips-keycloak
  namespace: blips
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`auth.blips.tugu-re.com`)"
      kind: Rule
      services:
        - name: keycloak
          port: 8443
          scheme: https
  tls:
    options:
      name: tls13only
      namespace: blips
    secretName: blips-tls-cert
---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blips-http-redirect
  namespace: blips
spec:
  entryPoints:
    - web
  routes:
    - match: "HostRegexp(`blips.tugu-re.com`, `api.blips.tugu-re.com`, `auth.blips.tugu-re.com`)"
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: blips-api
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: blips
spec:
  redirectScheme:
    scheme: https
    permanent: true
