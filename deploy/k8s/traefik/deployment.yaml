---
# Traefik 3 — Ingress Controller + API Gateway (DEC-008/DEC-029)
# TLS 1.3 minimum, mTLS internal services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: blips
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: blips-ifrs9
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/component: ingress
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: traefik
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              topologyKey: kubernetes.io/hostname
      containers:
        - name: traefik
          image: traefik:v3.2
          imagePullPolicy: IfNotPresent
          args:
            - "--api.dashboard=false"
            - "--providers.kubernetesingress=true"
            - "--providers.kubernetesingress.namespaces=blips"
            - "--providers.kubernetescrd=true"
            - "--providers.kubernetescrd.namespaces=blips"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.websecure.http.tls.options=tls13only"
            - "--log.level=WARN"
            - "--accesslog=true"
            - "--accesslog.format=json"
            - "--metrics.prometheus=true"
            - "--metrics.prometheus.addentrypointslabels=true"
            - "--metrics.prometheus.addserviceslabels=true"
            - "--metrics.prometheus.entrypoint=metrics"
            - "--entrypoints.metrics.address=:8082"
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: metrics
              containerPort: 8082
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: tls-certs
          secret:
            secretName: blips-tls-cert
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: blips
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-blips
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, ingressroutetcps, ingressrouteudps, middlewares, middlewaretcps, tlsoptions, tlsstores, serverstransports, traefikservices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-blips
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-blips
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: blips
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: blips
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: ingress
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: websecure
      port: 443
      targetPort: 443
      nodePort: 30443
  type: NodePort
