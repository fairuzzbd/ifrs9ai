---
# Prometheus ConfigMap — referensi ke prometheus.yml utama di deploy/observability/
# Dalam K8s, mount file dari ConfigMap. Isi actual rules ada di deploy/observability/prometheus/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: blips
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    # Lihat deploy/observability/prometheus/prometheus.yml untuk full config.
    # File ini di-sync dari sana saat deploy (lihat runbook p5-deploy-prod.md §Observability).
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        env: production
        cluster: blips-prod-jkt

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: blips-api
        static_configs:
          - targets: ['blips-api:8080']
        metrics_path: /metrics

      - job_name: blips-worker
        static_configs:
          - targets: ['blips-worker:9090']
        metrics_path: /metrics

      - job_name: postgres
        static_configs:
          - targets: ['postgres:9187']

      - job_name: redis
        static_configs:
          - targets: ['redis:9121']

      - job_name: traefik
        static_configs:
          - targets: ['traefik:8082']
        metrics_path: /metrics

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [blips]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
