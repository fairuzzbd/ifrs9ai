---
# ---------------------------------------------------------------------------
# BLIPS IFRS9 — Secret template (JANGAN isi nilai asli, JANGAN commit secret)
#
# Cara create secret di prod:
#   kubectl create secret generic blips-secret \
#     --namespace=blips \
#     --from-literal=POSTGRES_PASSWORD='<password>' \
#     --from-literal=REDIS_PASSWORD='<password>' \
#     --from-literal=MINIO_ROOT_USER='<user>' \
#     --from-literal=MINIO_ROOT_PASSWORD='<password>' \
#     --from-literal=JWT_PUBLIC_KEY_PEM='<pem>' \
#     --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD='<password>'
#
# Atau dengan HashiCorp Vault Agent Injector (Phase 2):
#   annotations:
#     vault.hashicorp.com/agent-inject: "true"
#     vault.hashicorp.com/role: "blips-app"
#     vault.hashicorp.com/agent-inject-secret-config: "secret/blips/prod"
#
# File ini hanya dokumentasi struktur — nilai base64 di bawah adalah PLACEHOLDER.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: blips-secret
  namespace: blips
  labels:
    app.kubernetes.io/name: blips-ifrs9
type: Opaque
data:
  # Nilai harus base64-encoded: echo -n 'value' | base64
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  REDIS_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  MINIO_ROOT_USER: REPLACE_WITH_BASE64_ENCODED_VALUE
  MINIO_ROOT_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  JWT_PUBLIC_KEY_PEM: REPLACE_WITH_BASE64_ENCODED_VALUE
  KC_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
