---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blips-worker
  namespace: blips
  labels:
    app.kubernetes.io/name: blips-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: blips-ifrs9
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: blips-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blips-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: blips-worker
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres 5432; do echo 'waiting for postgres'; sleep 2; done"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z redis 6379; do echo 'waiting for redis'; sleep 2; done"
      containers:
        - name: worker
          image: registry.tugu-re.local/blips/worker:REPLACE_WITH_SHA_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: blips-config
          env:
            - name: ASYNQ_WORKER_ENABLED
              value: "true"
            - name: ASYNQ_CONCURRENCY
              value: "20"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blips-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blips-secret
                  key: REDIS_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: blips-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: blips-secret
                  key: MINIO_ROOT_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
      restartPolicy: Always
