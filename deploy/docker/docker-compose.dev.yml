# ---------------------------------------------------------------------------
# BLIPS IFRS9 — Dev environment (Phase 0 Bootstrap)
#
# Stack LOCKED (DEC-001..004): PostgreSQL 18, Redis 7, MinIO, Go backend, Next.js frontend.
# On-premise / single-tenant (DEC-002/DEC-008/DEC-023).
#
# CATATAN: Kredensial di file ini adalah DEFAULT DEV NON-PRODUKSI.
# JANGAN dipakai di UAT/produksi — produksi pakai secrets manager (lihat security-baseline.md).
#
# Jalankan dari root repo:
#   docker compose -f deploy/docker/docker-compose.dev.yml up -d
#
# Path build context & mount bersifat relatif terhadap folder file ini (deploy/docker/),
# sehingga root repo direferensikan sebagai ../../
# ---------------------------------------------------------------------------

name: blips-ifrs9-dev

services:
  postgres:
    image: postgres:18
    container_name: blips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blips_db
      POSTGRES_USER: blips_admin
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap schema dieksekusi sekali saat volume data masih kosong.
      - ../../BLIPS_init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blips_admin -d blips_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - blips

  redis:
    image: redis:7-alpine
    container_name: blips-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blips

  minio:
    image: minio/minio:latest
    container_name: blips-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - blips

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: blips-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://blips_admin:change_me_in_production@postgres:5432/blips_db?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_USE_SSL: "false"
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - blips

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: blips-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - blips

volumes:
  pgdata:
    name: blips-pgdata
  redisdata:
    name: blips-redisdata
  miniodata:
    name: blips-miniodata

networks:
  blips:
    name: blips-dev
    driver: bridge
