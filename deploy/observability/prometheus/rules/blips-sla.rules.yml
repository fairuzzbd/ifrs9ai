---
# BLIPS SLA + Latency alert rules
# Golden signals: latency P95/P99, error rate, saturation
groups:
  - name: blips-sla-latency
    interval: 30s
    rules:
      # P95 API latency > 200ms for 5 minutes → warning
      - alert: BlipsAPILatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="blips-api"}[5m])) by (le, route)
          ) > 0.200
        for: 5m
        labels:
          severity: warning
          service: blips-api
        annotations:
          summary: "API P95 latency > 200ms on route {{ $labels.route }}"
          description: "P95 latency is {{ $value | humanizeDuration }}. SLA target ≤ 200ms."
          runbook: "docs/runbooks/p5-observability.md#api-latency"

      # P99 API latency > 500ms for 5 minutes → page
      - alert: BlipsAPILatencyP99Critical
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job="blips-api"}[5m])) by (le, route)
          ) > 0.500
        for: 5m
        labels:
          severity: critical
          service: blips-api
        annotations:
          summary: "API P99 latency > 500ms on route {{ $labels.route }}"
          description: "P99 latency is {{ $value | humanizeDuration }}. SLA breach."
          runbook: "docs/runbooks/p5-observability.md#api-latency"

      # Reporting endpoint P95 > 30s → warning (ECL reports are heavy)
      - alert: BlipsReportingLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="blips-api",route=~"/api/v1/reports.*"}[5m])) by (le, route)
          ) > 30
        for: 10m
        labels:
          severity: warning
          service: blips-api
        annotations:
          summary: "Reporting endpoint P95 > 30s"
          description: "Route {{ $labels.route }} P95 = {{ $value | humanizeDuration }}. Consider async export."
          runbook: "docs/runbooks/p5-observability.md#reporting-latency"

  - name: blips-sla-error-rate
    interval: 30s
    rules:
      # API error rate > 1% for 5 minutes → page (BLIPS alert standard)
      - alert: BlipsAPIErrorRateHigh
        expr: |
          sum(rate(http_requests_total{job="blips-api",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="blips-api"}[5m]))
          > 0.01
        for: 5m
        labels:
          severity: critical
          service: blips-api
        annotations:
          summary: "API error rate > 1% for 5 minutes"
          description: "Current error rate: {{ $value | humanizePercentage }}. Immediate investigation required."
          runbook: "docs/runbooks/p5-incident-response.md"

      # API error rate > 0.1% for 15 minutes → warning
      - alert: BlipsAPIErrorRateWarning
        expr: |
          sum(rate(http_requests_total{job="blips-api",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="blips-api"}[5m]))
          > 0.001
        for: 15m
        labels:
          severity: warning
          service: blips-api
        annotations:
          summary: "API error rate > 0.1% sustained"
          description: "Error rate: {{ $value | humanizePercentage }}. Monitor for escalation."
          runbook: "docs/runbooks/p5-observability.md#error-rate"

  - name: blips-sla-saturation
    interval: 30s
    rules:
      # DB connection pool > 80% → warn
      - alert: BlipsDBConnectionPoolHigh
        expr: |
          (pg_stat_activity_count{datname="blips_db"} / pg_settings_max_connections{})
          > 0.80
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL connection pool > 80%"
          description: "Pool utilization: {{ $value | humanizePercentage }}. Risk of connection exhaustion."
          runbook: "docs/runbooks/p5-observability.md#db-pool"

      # DB connection pool > 90% → page
      - alert: BlipsDBConnectionPoolCritical
        expr: |
          (pg_stat_activity_count{datname="blips_db"} / pg_settings_max_connections{})
          > 0.90
        for: 2m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL connection pool > 90% — near exhaustion"
          description: "Pool: {{ $value | humanizePercentage }}. Deploy risk: connection refused."
          runbook: "docs/runbooks/p5-incident-response.md#db-pool-exhaustion"

      # Disk on PostgreSQL host > 80% → warn
      - alert: BlipsPostgresDiskHigh
        expr: |
          (
            node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} -
            node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"}
          ) / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} > 0.80
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL disk usage > 80%"
          description: "Disk usage: {{ $value | humanizePercentage }}. WAL + base backup may fail soon."
          runbook: "docs/runbooks/p5-backup-restore.md#disk-full"

      # Disk on PostgreSQL > 95% → page
      - alert: BlipsPostgresDiskCritical
        expr: |
          (
            node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} -
            node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"}
          ) / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} > 0.95
        for: 5m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL disk > 95% — CRITICAL"
          description: "PostgreSQL may stop accepting writes. Immediate action required."
          runbook: "docs/runbooks/p5-backup-restore.md#disk-full"

      # Asynq queue backlog > 10k → page (BLIPS alert standard)
      - alert: BlipsAsynqQueueBacklog
        expr: |
          asynq_queue_size{queue="default"} > 10000
        for: 5m
        labels:
          severity: critical
          service: blips-worker
        annotations:
          summary: "Asynq queue backlog > 10,000 jobs"
          description: "Queue size: {{ $value }}. Worker may be stalled or underpowered."
          runbook: "docs/runbooks/p5-observability.md#asynq-backlog"
