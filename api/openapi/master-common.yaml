  open-questions-resolution:
    description: "Resolusi open questions dari APP-A-MSTR-001 (BA story)"

    q1_workflow_config_granularity:
      status: RESOLVED
      decision: |
        Setiap modul mst.* punya WORKFLOW_CONFIG_{ENTITY} sendiri di sys.config.
        Ini sudah di-implement di migration 000007_workflow_engine.up.sql.
        Format: satu row per entity type, value = JSON WorkflowConfig.
        Backend WorkflowEngine load config on startup, cache 5 menit.
        Ini memungkinkan override per modul tanpa code change (config-driven).

    q2_reviewer_role_matrix:
      status: RESOLVED
      decision: |
        Lihat workflow-config-matrix di atas — tabel lengkap modul → maker/reviewer/approver.
        Catatan untuk mata_uang (pilot):
          Maker    = ROLE-AKUN
          Reviewer = ROLE-AKUN-CTL (satu AKUN-CTL berbeda dari maker)
          Approver = ROLE-AKUN-CTL (AKUN-CTL ketiga, berbeda dari reviewer)
          *** PERTANYAAN KE STAKEHOLDER: Apakah tersedia 3 user AKUN-CTL yang berbeda
              (SoD penuh 4-eyes), atau model yang lebih pragmatis adalah:
              AKUN (maker) → AKUN-CTL sebagai reviewer+approver sekaligus (1 AKUN-CTL)
              dengan SoD hanya maker≠approver?
              Story APP-A-MSTR-002 scenario 2 mengasumsikan 1 AKUN-CTL = approve langsung.
              System-analyst memilih model: 4-eyes TETAP (3 user distinct), AKUN-CTL
              mengisi dua role berbeda tapi HARUS 2 user berbeda.
              Ini perlu KONFIRMASI dari stakeholder sebelum backend implement.

    q3_notification_channel:
      status: OPEN
      decision: |
        In-app notification sudah ada di Phase 2 foundation (sys.notification_*).
        Email: butuh SMTP config di sys.config (KEY: SMTP_HOST, SMTP_PORT, dll).
        Rekomendasi: in-app notification DULU (Phase 3), email Phase 4.
        PERLU KONFIRMASI stakeholder apakah email notification critical untuk go-live.

    q4_return_reason_mandatory:
      status: RESOLVED
      decision: |
        Comment WAJIB (minLength: 10) untuk REJECT/RETURN di semua modul mst.*.
        Tidak ada pengecualian. Ini konsisten dengan workflow.yaml WorkflowRejectRequest.

    q5_bulk_approve:
      status: DEFERRED
      decision: |
        Bulk approve DEFER ke Phase 4 MVP. Alasan: SoD enforcement per-record di bulk
        memerlukan atomic transaction yang kompleks.
        Phase 3 MVP: approve satu per satu.

    q6_amendment_after_approved:
      status: RESOLVED
      decision: |
        Master umum (mata_uang, portofolio, CoA, mapping_jurnal, kurs, instrumen):
          Update in-place + workflow baru. Record tetap satu, tapi harus melalui
          siklus DRAFT→APPROVE lagi. rowVersion increment.
          Error MASTER_APPROVED_NO_EDIT jika user coba PATCH langsung tanpa workflow.
        ECL-param masters (pd_pefindo, lgd_basel, bobot_skenario, lps_coverage, impact_*):
          VERSIONING (audit-grade immutability). Tidak pernah UPDATE row lama.
          Insert row baru dengan effective_from = tanggal mulai berlaku.
          Row lama: effective_to = tanggal − 1.
          Detail di story terpisah Varian A.
