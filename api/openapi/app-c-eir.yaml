      scheme: bearer
      bearerFormat: JWT
      description: JWT RSA-2048 signed oleh Keycloak. Access token TTL 15 menit (DEC-025).

  parameters:
    instrumenIdPath:
      name: instrumenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID instrumen dari mst.instrumen

    amendmentIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID proposal dari ecl.eir_reestimation_log

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID v4 unik per request. TTL replay 24 jam (DEC-021).

    XStepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema:
        type: string
      description: |
        Token dari POST /auth/step-up. Wajib untuk approve endpoint ROLE-ALCO.
        TTL 5 menit. Expired → STEP_UP_EXPIRED 403.

    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque base64 cursor dari pagination.nextCursor (DEC-022)

    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Jumlah item per halaman. Default 50, max 200.

    sortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        pattern: "^[a-z_]+(:(asc|desc))?(,[a-z_]+(:(asc|desc))?)*$"
      description: "Multi-column sort. Format: col1:asc,col2:desc. Max 3 kolom."

    searchParam:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Text search global

    includeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: "Tampilkan soft-deleted records. Hanya ROLE-AUDIT."

  schemas:

    # ---- Common reuse -------------------------------------------------------
    ResponseMeta:
      type: object
      properties:
        traceId:
          type: string
          example: "01HXY..."

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, traceId]
          properties:
            code:
              $ref: "#/components/schemas/EIRErrorCode"
            message:
              type: string
              description: Human-readable message Bahasa Indonesia. Jangan expose stack trace.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  rule:
                    type: string
                  message:
                    type: string
            traceId:
              type: string

    # ---- Error codes (EIR-specific + inherited) ----------------------------
    EIRErrorCode:
      type: string
      description: |
        Stable error code — termasuk semua code dari _common.yaml plus EIR-specific.
        Ditambahkan ke _common.yaml ErrorCode enum.
      enum:
        # dari _common.yaml (subset yang relevan untuk konteks ini)
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SOD_VIOLATION
        - MFA_REQUIRED
        - NOT_FOUND
        - CONFLICT
        - IDEMPOTENCY_REPLAY
        - IDEMPOTENCY_MISMATCH
        - WORKFLOW_INVALID_TRANSITION
        - PERIODE_CLOSED
        - RATE_LIMITED
        - INTERNAL
        - STEP_UP_REQUIRED
        - STEP_UP_EXPIRED
        - JOB_NOT_FOUND
        # EIR-specific (P4-M5) — tambahkan ke _common.yaml ErrorCode enum
        - EIR_NON_CONVERGENT                  # 422 — Newton-Raphson exceeded max iterations (100)
        - EIR_DIVERGENT                       # 422 — residual growing antara iterasi
        - EIR_CASHFLOW_INVALID                # 422 — null/empty/negative amount atau missing jatuh tempo
        - EIR_CASHFLOW_SIGN_MISMATCH          # 422 — CF_0 harus negatif (initial outflow)
        - EIR_INSTRUMEN_FVTPL_NO_EIR          # 422 — FVTPL/FVOCI_ELECTION tidak pakai amortized cost
        - EIR_SCHEDULE_NOT_FOUND              # 404 — schedule belum ada untuk instrumen
        - EIR_SCHEDULE_PERIODE_OUT_OF_RANGE   # 422 — periode melebihi tanggal jatuh tempo instrumen
        - EIR_DUPLICATE_SCHEDULE_VERSION      # 409 — schedule aktif sudah ada (gunakan amendment flow)
        - EIR_POCI_REQUIRES_PD_ADJUSTED_CF    # 422 — instrumen POCI tapi CF tidak PD-adjusted
        - EIR_BULK_RECOMPUTE_INVALID_SCOPE    # 400 — scope parameter tidak valid
        - EIR_INSTRUMEN_NOT_FOUND             # 404 — instrumen tidak ada di mst.instrumen
        - EIR_ALREADY_COMPUTED                # 409 — eir_awal sudah terisi, gunakan amendment
        - EIR_NOT_YET_COMPUTED                # 422 — generate schedule sebelum EIR dihitung

    # ---- Job accepted response (202) ----------------------------------------
    JobAcceptedResponse:
      type: object
      required: [jobId, type, statusUrl, streamUrl]
      properties:
        jobId:
          type: string
          description: "Job identifier (ULID). Persistent di sys.job."
          example: "01JXYZ-BULK-001"
        type:
          type: string
          description: "Job type identifier"
          example: "EIR_BULK_RECOMPUTE"
        statusUrl:
          type: string
          description: "GET /api/v1/jobs/{jobId}"
          example: "/api/v1/jobs/01JXYZ-BULK-001"
        streamUrl:
          type: string
          description: "SSE stream — gunakan Authorization: Bearer header (bukan ?token=)"
          example: "/api/v1/jobs/01JXYZ-BULK-001/stream"
        estimatedDurationSeconds:
          type: integer
          nullable: true
          description: Estimasi durasi berdasarkan jumlah instrumen aktif

    # ---- Cashflow item -------------------------------------------------------
    CashflowItem:
      type: object
      required: [date, amountIdr]
      properties:
        date:
          type: string
          format: date
          description: "Tanggal cashflow. CF_0 = tanggal penempatan/origination."
          example: "2026-01-01"
        amountIdr:
          type: number
          description: |
            Amount IDR. CF_0 HARUS negatif (initial outflow: -(nominal + biaya_transaksi)).
            CF_t positif (inflows: kupon + pelunasan pokok).
            Presisi NUMERIC(20,4) — no float64 di DB.
          example: -1005000000.0000

    # ---- EIR Compute Request ------------------------------------------------
    EIRComputeRequest:
      type: object
      required: [instrumenId, cashflowProjection, initialPrincipalIdr]
      properties:
        instrumenId:
          type: string
          format: uuid
          description: UUID instrumen dari mst.instrumen. Harus AC atau FVOCI.
        cashflowProjection:
          type: array
          items:
            $ref: "#/components/schemas/CashflowItem"
          minItems: 2
          description: |
            Array cashflow. Index 0 = CF_0 (negatif, outflow).
            Sisanya = inflows (kupon + pelunasan pokok pada jatuh tempo).
            Untuk deposito reguler, dapat di-auto-generate dari instrumen fields.
        initialPrincipalIdr:
          type: number
          description: "Nominal + biaya_transaksi_capitalized. Harus > 0."
          example: 1005000000.0000
        couponRate:
          type: number
          nullable: true
          description: |
            Rate kupon per periode (bukan annualized). Dipakai sebagai seed r_initial.
            Jika null, solver menggunakan r_initial = 0.10 (DEC-013).
          example: 0.04000000
        persistResult:
          type: boolean
          default: false
          description: |
            false (default): hanya compute, return result, tidak simpan ke DB (preview).
            true: simpan eir_awal ke mst.instrumen. Audit event EIR.COMPUTE ditulis.
        forceRecompute:
          type: boolean
          default: false
          description: |
            Hanya relevan saat persistResult=true.
            false (default): jika eir_awal sudah terisi → 409 EIR_ALREADY_COMPUTED.
            true: izinkan re-compute meski eir_awal sudah ada (untuk koreksi origination).
            Amendment kontrak menggunakan amendment workflow, bukan flag ini.
        pociMode:
          type: boolean
          default: false
          description: |
            true: instrumen POCI, cashflowProjection harus sudah PD-adjusted.
            Solver berjalan dengan cashflow tersebut, response berisi eirType="CREDIT_ADJUSTED".
            POCI full logic deferred ke M7; M5 hanya menerima CF dan menandai flag.

    # ---- EIR Compute Response -----------------------------------------------
    EIRComputeResponse:
      type: object
      required:
        - instrumenId
        - eirPerPeriod
        - eirAnnualEquivalent
        - iterationsUsed
        - convergenceResidual
        - eirType
        - persisted
        - computedAt
      properties:
        instrumenId:
          type: string
          format: uuid
        eirPerPeriod:
          type: string
          description: |
            EIR per periode sebagai string NUMERIC(10,8).
            Contoh: "0.04200000" (4.2% per semester).
            String untuk preserve 8 desimal tanpa float precision loss.
          example: "0.04200000"
        eirAnnualEquivalent:
          type: string
          description: |
            EIR tahunan equivalen: (1 + eirPerPeriod)^freq - 1.
            Untuk display UI; perhitungan internal tetap pakai eirPerPeriod.
          example: "0.08570240"
        iterationsUsed:
          type: integer
          description: Jumlah iterasi Newton-Raphson yang digunakan. Max 100 (DEC-013).
          example: 7
        convergenceResidual:
          type: string
          description: |
            Nilai |f(r)| pada iterasi terakhir sebagai string.
            Harus < 1e-10 jika konvergen (DEC-013).
          example: "0.0000000001"
        eirType:
          type: string
          enum: [STANDARD, CREDIT_ADJUSTED]
          description: |
            STANDARD: EIR biasa untuk instrumen non-POCI.
            CREDIT_ADJUSTED: EIR credit-adjusted untuk instrumen POCI (pociMode=true).
        persisted:
          type: boolean
          description: true jika eir_awal sudah disimpan ke mst.instrumen (persistResult=true)
        computedAt:
          type: string
          format: date-time
          description: Timestamp saat compute dilakukan

    # ---- EIR Generate Schedule Request --------------------------------------
    EIRGenerateScheduleRequest:
      type: object
      required: [instrumenId, cashflowProjection, initialPrincipalIdr]
      properties:
        instrumenId:
          type: string
          format: uuid
        cashflowProjection:
          type: array
          items:
            $ref: "#/components/schemas/CashflowItem"
          minItems: 2
        initialPrincipalIdr:
          type: number
          description: "Nominal + biaya_transaksi_capitalized untuk opening_carrying row-1."
          example: 1005000000.0000
        couponRate:
          type: number
          nullable: true
          description: "Rate kupon per periode. Opsional — jika null, baca dari mst.instrumen.kupon."
          example: 0.04000000
        forceRegenerate:
          type: boolean
          default: false
          description: |
            true: izinkan regenerate jika schedule belum ada tapi rows aktif = 0.
            TIDAK untuk amendment — gunakan amendment workflow.

    # ---- EIR Generate Schedule Response -------------------------------------
    EIRScheduleGenerateResponse:
      type: object
      required:
        - instrumenId
        - scheduleSeq
        - totalRows
        - eirPerPeriod
        - openingCarryingFirst
        - closingCarryingLast
        - closingRoundingDelta
        - generatedAt
        - schedule
      properties:
        instrumenId:
          type: string
          format: uuid
        scheduleSeq:
          type: string
          description: "Business key pertama dari schedule yang baru dibuat (schedule_id_kode row-1)."
        totalRows:
          type: integer
          description: Jumlah rows yang diinsert ke ecl.eir_amortization_schedule
        eirPerPeriod:
          type: string
          description: EIR per periode yang digunakan, NUMERIC(10,8)
          example: "0.04200000"
        openingCarryingFirst:
          type: string
          description: "opening_carrying baris pertama (= nominal + biaya_transaksi)"
          example: "1005000000.0000"
        closingCarryingLast:
          type: string
          description: "closing_carrying baris terakhir. Harus ≈ 0."
          example: "0.0000"
        closingRoundingDelta:
          type: string
          description: |
            Selisih rounding pada baris terakhir setelah HALF_EVEN rounding.
            Harus ≤ IDR 1.
          example: "0.0001"
        generatedAt:
          type: string
          format: date-time
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/EIRScheduleRow"
          description: Semua rows yang baru diinsert (preview). Untuk instrumen besar, pagination tidak berlaku di sini — full schedule di-return.

    # ---- EIR Schedule Row ---------------------------------------------------
    EIRScheduleRow:
      type: object
      required:
        - id
        - scheduleIdKode
        - instrumenId
        - periodeSeq
        - tanggalPosting
        - openingCarryingIdr
        - cashInflowIdr
        - pendapatanBungaEirIdr
        - amortisasiPdIdr
        - pelunasanPokokIdr
        - closingCarryingIdr
        - eirPeriode
        - statusPosting
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID row dari ecl.eir_amortization_schedule
        scheduleIdKode:
          type: string
          description: Business key VARCHAR(30), mis. "SCHED-OBL-001-S01"
          example: "SCHED-OBL-001-S01"
        instrumenId:
          type: string
          format: uuid
        periodeSeq:
          type: integer
          description: Urutan periode (1, 2, ..., N)
          example: 1
        tanggalPosting:
          type: string
          format: date
          description: Tanggal jatuh tempo per periode
          example: "2026-07-01"
        openingCarryingIdr:
          type: string
          description: "Gross Carrying opening. NUMERIC(20,4) sebagai string."
          example: "1005000000.0000"
        cashInflowIdr:
          type: string
          description: "Kupon kontraktual yang diterima pada periode ini. NUMERIC(20,4)."
          example: "40000000.0000"
        pendapatanBungaEirIdr:
          type: string
          description: "= opening_carrying × eir_per_periode. NUMERIC(20,4)."
          example: "42210000.0000"
        amortisasiPdIdr:
          type: string
          description: |
            = pendapatan_bunga_eir − cash_inflow.
            Positif = amortisasi diskonto (carrying naik).
            Negatif = amortisasi premium (carrying turun).
            NUMERIC(20,4).
          example: "2210000.0000"
        pelunasanPokokIdr:
          type: string
          description: "Pelunasan pokok pada periode ini. 0 kecuali periode jatuh tempo. NUMERIC(20,4)."
          example: "0.0000"
        closingCarryingIdr:
          type: string
          description: |
            = opening_carrying + amortisasi_p_d − pelunasan_pokok.
            ≈ 0 pada periode terakhir (HALF_EVEN rounding).
            NUMERIC(20,4).
          example: "1007210000.0000"
        eirPeriode:
          type: string
          description: "EIR per periode. NUMERIC(10,8)."
          example: "0.04200000"
        stageSaatPosting:
          type: string
          enum: [STAGE_1, STAGE_2, STAGE_3]
          nullable: true
          description: Stage instrumen saat row ini dibuat/diposting
          example: "STAGE_1"
        statusPosting:
          type: string
          enum: [PROYEKSI, POSTED, REVERSED, RECOMPUTED]
          description: Status posting row ini
          example: "PROYEKSI"
        jurnalReferenceId:
          type: string
          format: uuid
          nullable: true
          description: FK ke jrnl.header jika sudah di-posting ke jurnal
        recomputedFromSeq:
          type: integer
          nullable: true
          description: |
            NULL = row aktif (active schedule).
            NOT NULL = superseded; nilai = periode_seq pertama dari schedule pengganti.
        createdAt:
          type: string
          format: date-time
          description: Immutable — row append-only setelah INSERT

    # ---- EIR Schedule List Response -----------------------------------------
    EIRScheduleListResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EIRScheduleRow"
        pagination:
          type: object
          required: [hasMore]
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean
            totalEstimate:
              type: integer
              nullable: true
            limit:
              type: integer
        appliedSort:
          type: array
          items:
            type: object
            properties:
              col:
                type: string
              dir:
                type: string
                enum: [asc, desc]
        appliedFilter:
          type: object
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    # ---- EIR Amendment Propose Request --------------------------------------
    EIRAmendmentProposeRequest:
      type: object
      required: [instrumenId, amendmentDate, revisedCashflows, alasan, dokumenPendukungId]
      properties:
        instrumenId:
          type: string
          format: uuid
          description: UUID instrumen yang akan di-amandemen
        amendmentDate:
          type: string
          format: date
          description: |
            Tanggal berlakunya amandemen. Rows lama dengan tanggal_posting >= amendmentDate
            akan di-supersede. Harus > tanggal last POSTED row.
          example: "2028-01-01"
        revisedCashflows:
          type: array
          items:
            $ref: "#/components/schemas/CashflowItem"
          minItems: 2
          description: |
            Cashflow revisi mulai dari amendmentDate.
            CF_0 = negative (outstanding balance saat amandemen).
            Sisanya = inflows baru sesuai kontrak revisi.
        alasan:
          type: string
          minLength: 30
          maxLength: 2000
          description: Justifikasi amendment. Minimum 30 karakter.
          example: "Amandemen kupon dari 8% ke 9% sesuai addendum kontrak tanggal 2027-12-15"
        dokumenPendukungId:
          type: string
          format: uuid
          description: UUID dokumen addendum dari doc.upload. WAJIB untuk setiap amendment.

    # ---- EIR Amendment Proposal (response entity) ---------------------------
    EIRAmendmentProposal:
      type: object
      required:
        - id
        - logIdKode
        - instrumenId
        - tanggalReEstimation
        - triggerType
        - eirSebelum
        - workflowStatus
        - makerId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID row dari ecl.eir_reestimation_log
        logIdKode:
          type: string
          description: Business key VARCHAR(30), mis. "REEST-OBL-001-001"
          example: "REEST-OBL-001-001"
        instrumenId:
          type: string
          format: uuid
        kodeInstrumen:
          type: string
          nullable: true
          example: "OBL-2026-00001"
        tanggalReEstimation:
          type: string
          format: date
          description: Tanggal amandemen berlaku
          example: "2028-01-01"
        triggerType:
          type: string
          description: |
            Tipe trigger re-estimasi.
            Untuk M5: "KONTRAK_AMANDEMEN" (perubahan kupon, tenor, dll).
          example: "KONTRAK_AMANDEMEN"
        eirSebelum:
          type: string
          description: "EIR sebelum re-estimasi. NUMERIC(10,8). Immutable setelah proposal dibuat."
          example: "0.04200000"
        eirSesudah:
          type: string
          nullable: true
          description: "EIR baru setelah re-estimasi. Populated hanya setelah APPROVED dan solver sukses."
          example: "0.04680000"
        catchUpAdjustment:
          type: string
          nullable: true
          description: "NPV difference pada tanggal amandemen. NUMERIC(20,4). Populated setelah APPROVED."
          example: "12500000.0000"
        modifikasiTermsJson:
          type: object
          nullable: true
          description: Detail perubahan kontrak dalam JSONB. Contoh: {kupon_lama: 0.08, kupon_baru: 0.09}
          additionalProperties: true
        dokumenPendukungId:
          type: string
          format: uuid
          nullable: true
        workflowStatus:
          type: string
          enum: [DRAFT, PENDING_REVIEW, PENDING_APPROVAL, APPROVED, REJECTED]
          description: |
            State machine amendment:
            DRAFT → PENDING_REVIEW (setelah submit awal, menunggu ROLE-RISK)
            → PENDING_APPROVAL (setelah ROLE-RISK review)
            → APPROVED (setelah ROLE-ALCO approve + solver sukses) / REJECTED
        makerId:
          type: string
          format: uuid
          description: ROLE-AKUN yang propose
        makerNama:
          type: string
          nullable: true
        reviewerId:
          type: string
          format: uuid
          nullable: true
          description: ROLE-RISK yang review
        reviewerNama:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewerComment:
          type: string
          nullable: true
          maxLength: 1000
        reviewerSignatureHash:
          type: string
          nullable: true
          description: "SHA-256(reviewerId || REVIEW || proposalId || reviewedAt || comment)"
        approverId:
          type: string
          format: uuid
          nullable: true
          description: ROLE-ALCO yang approve
        approverNama:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        approverComment:
          type: string
          nullable: true
          maxLength: 1000
        approverSignatureHash:
          type: string
          nullable: true
          description: "SHA-256(approverId || APPROVE || proposalId || approvedAt || comment)"
        rejectionComment:
          type: string
          nullable: true
          maxLength: 2000
          description: Alasan penolakan jika workflowStatus=REJECTED
        revisedCashflows:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CashflowItem"
          description: Cashflow revisi yang diajukan oleh maker. Tersimpan di modifikasiTermsJson.
        newScheduleFirstSeq:
          type: integer
          nullable: true
          description: periode_seq pertama dari schedule baru setelah APPROVED. Null jika belum APPROVED.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    # ---- EIR Amendment List Response ----------------------------------------
    EIRAmendmentListResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EIRAmendmentProposal"
        pagination:
          type: object
          required: [hasMore]
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean
            totalEstimate:
              type: integer
              nullable: true
            limit:
              type: integer
        appliedSort:
          type: array
          items:
            type: object
            properties:
              col:
                type: string
              dir:
                type: string
                enum: [asc, desc]
        appliedFilter:
          type: object
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    # ---- Workflow Action Request (reuse dari staging pattern) ----------------
    WorkflowActionRequest:
      type: object
      required: [action, signatureMethod]
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
          description: Aksi workflow yang dilakukan
        comment:
          type: string
          maxLength: 1000
          nullable: true
          description: Komentar reviewer/approver
        signatureMethod:
          type: string
          enum: [JWT_STANDARD, JWT_STEP_UP]
          description: |
            JWT_STANDARD: untuk review endpoint (ROLE-RISK).
            JWT_STEP_UP: untuk approve endpoint (ROLE-ALCO, step-up MFA wajib).

    # ---- Workflow Reject Request --------------------------------------------
    WorkflowRejectRequest:
      type: object
      required: [comment, signatureMethod]
      properties:
        comment:
          type: string
          minLength: 10
          maxLength: 2000
          description: Alasan penolakan. Wajib dan minimal 10 karakter.
        signatureMethod:
          type: string
          enum: [JWT_STANDARD, JWT_STEP_UP]

    # ---- EIR Bulk Recompute Request -----------------------------------------
    EIRBulkRecomputeRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [ALL_ACTIVE, SUBSET]
          default: ALL_ACTIVE
          description: |
            ALL_ACTIVE: semua instrumen AKTIF dengan eir_method_flag=TRUE dan klasifikasi AC/FVOCI.
            SUBSET: subset instrumen dari instrumenIds (wajib diisi jika SUBSET).
        instrumenIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
          nullable: true
          description: Wajib jika scope=SUBSET. Max 1000 instrumen per request.
        periodeId:
          type: string
          format: uuid
          nullable: true
          description: UUID periode buku untuk konteks audit. Null = periode aktif.
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: Alasan manual trigger untuk audit log

    # ---- EIR Bulk Job Result ------------------------------------------------
    EIRBulkJobResult:
      type: object
      required: [jobId, type, status, progress]
      properties:
        jobId:
          type: string
          example: "01JXYZ-BULK-001"
        type:
          type: string
          example: "EIR_BULK_RECOMPUTE"
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, completed_with_errors]
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Persen progress (0-100)
        currentStep:
          type: string
          nullable: true
          description: "Deskripsi step saat ini, mis. 'Memproses instrumen 500 dari 1000'"
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        canCancel:
          type: boolean
          default: false
          description: true jika job masih bisa di-cancel (status=running)
        result:
          $ref: "#/components/schemas/EIRBulkRecomputeResult"
          nullable: true
          description: Populated hanya jika status=completed atau completed_with_errors
        error:
          type: object
          nullable: true
          description: "Error detail jika status=failed. Struktur: {code, message}."
          properties:
            code:
              type: string
            message:
              type: string

    # ---- EIR Bulk Recompute Result (stored di sys.job.result_jsonb) ----------
    EIRBulkRecomputeResult:
      type: object
      required: [total, valid, driftCount, scheduleMissing, totalErrors]
      properties:
        total:
          type: integer
          description: Total instrumen yang diproses
        valid:
          type: integer
          description: Instrumen yang EIR-nya valid (tidak ada drift, schedule OK)
        driftCount:
          type: integer
          description: Instrumen dengan EIR drift > 1e-6 antara eir_awal tersimpan dan re-computed
        scheduleMissing:
          type: integer
          description: Instrumen dengan eir_awal terisi tapi tidak ada rows di eir_amortization_schedule
        totalErrors:
          type: integer
          description: Instrumen yang mengalami error saat processing (cashflow corrupt, dll)
        completedWithErrors:
          type: boolean
          description: true jika ada instrumen yang error tapi batch tetap selesai
        driftInstruments:
          type: array
          nullable: true
          items:
            type: object
            required: [instrumenId, eirStored, eirComputed, delta]
            properties:
              instrumenId:
                type: string
                format: uuid
              kodeInstrumen:
                type: string
                nullable: true
              eirStored:
                type: string
                description: "EIR tersimpan di mst.instrumen.eir_awal. NUMERIC(10,8)."
              eirComputed:
                type: string
                description: "EIR hasil re-compute. NUMERIC(10,8)."
              delta:
                type: string
                description: "Selisih absolut |eirComputed - eirStored|. NUMERIC(10,8)."
        scheduleMissingInstruments:
          type: array
          nullable: true
          items:
            type: object
            required: [instrumenId, actionRequired]
            properties:
              instrumenId:
                type: string
                format: uuid
              kodeInstrumen:
                type: string
                nullable: true
              actionRequired:
                type: string
                example: "ACTION_REQUIRED: generate schedule"
        errors:
          type: array
          nullable: true
          items:
            type: object
            required: [instrumenId, error]
            properties:
              instrumenId:
                type: string
                format: uuid
              kodeInstrumen:
                type: string
                nullable: true
              error:
                type: string
                description: "Error code, mis. EIR_CASHFLOW_INVALID"
              detail:
                type: string
                nullable: true

  # -------------------------------------------------------------------------
  # Reusable Responses
  # -------------------------------------------------------------------------
  responses:
    ValidationFailed:
      description: Validasi field atau cross-field gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: VALIDATION_FAILED
              message: "1 field tidak valid"
              details:
                - field: "body.dokumenPendukungId"
                  rule: "required"
                  message: "Dokumen pendukung wajib diisi"
              traceId: "01HXY..."

    Unauthorized:
      description: JWT tidak valid, missing, atau expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: UNAUTHORIZED
              message: "Token JWT tidak valid atau sudah expired"
              details: []
              traceId: "01HXY..."

    Forbidden:
      description: Permission tidak terpenuhi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: FORBIDDEN
              message: "Anda tidak memiliki permission 'eir.compute'"
              details: []
              traceId: "01HXY..."

    NotFound:
      description: Entity tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: "Entity tidak ditemukan"
              details: []
              traceId: "01HXY..."

    Conflict:
      description: Optimistic lock conflict atau duplikasi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: CONFLICT
              message: "Konflik — row sudah diubah atau duplikasi terdeteksi."
              details: []
              traceId: "01HXY..."

    WorkflowInvalidTransition:
      description: State machine menolak transisi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: WORKFLOW_INVALID_TRANSITION
              message: "Transisi tidak valid dari state saat ini."
              details:
                - field: "state"
                  rule: "invalid_transition"
                  message: "Proposal harus dalam state PENDING_REVIEW untuk di-review"
              traceId: "01HXY..."

    PeriodeClosed:
      description: Periode buku sudah hard-closed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: PERIODE_CLOSED
              message: "Periode buku sudah hard-closed. Tidak bisa mutasi."
              details: []
              traceId: "01HXY..."

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: RATE_LIMITED
              message: "Terlalu banyak request. Coba lagi dalam 60 detik."
              details: []
              traceId: "01HXY..."

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INTERNAL
              message: "Terjadi kesalahan internal. Hubungi admin dengan traceId."
              details: []
              traceId: "01HXY..."
