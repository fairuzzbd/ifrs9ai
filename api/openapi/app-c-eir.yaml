                      code: FORBIDDEN
                      message: "Permission eir.amend.review diperlukan"
                      details: []
                      traceId: "01HXY..."
                sod:
                  value:
                    error:
                      code: SOD_VIOLATION
                      message: "Maker tidak bisa menjadi reviewer untuk proposal yang dia ajukan sendiri."
                      details: []
                      traceId: "01HXY..."
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WorkflowInvalidTransition"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
