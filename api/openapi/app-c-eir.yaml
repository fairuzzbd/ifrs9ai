  # ---------------------------------------------------------------------------
  /ecl/eir/amendments/{id}/review:
    post:
      operationId: reviewEIRAmendment
      summary: ROLE-RISK reviewer sign-off proposal amendment
      description: |
        Reviewer (ROLE-RISK, ≠ maker) menyetujui atau menolak proposal.
        Transisi: DRAFT → PENDING_APPROVAL (jika approve) atau REJECTED.

        Permission: eir.amend.review
        Role: ROLE-RISK (reviewer, ≠ maker)

        SoD: reviewer_id ≠ maker_id → SOD_VIOLATION 403 jika sama.
        Audit event: EIR.AMEND_REVIEWED
        Idempotency-Key wajib.
      tags: [eir-amendment]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/amendmentIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionRequest"
            example:
              action: "APPROVE"
              comment: "Cashflow revisi sudah diverifikasi sesuai addendum kontrak"
              signatureMethod: "JWT_STANDARD"
      responses:
        "200":
          description: Review berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/EIRAmendmentProposal"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
