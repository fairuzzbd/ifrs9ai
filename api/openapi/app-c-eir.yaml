  # ---------------------------------------------------------------------------
  # POST /ecl/eir/amendments/{id}/approve — ROLE-ALCO approve + execute (Story 4)
  # ---------------------------------------------------------------------------
  /ecl/eir/amendments/{id}/approve:
    post:
      operationId: approveEIRAmendment
      summary: ROLE-ALCO final approve — re-estimasi dieksekusi (step-up MFA wajib)
      description: |
        ROLE-ALCO menyetujui proposal. Step-up MFA wajib (DEC-026, DEC-027).

        Setelah approve, service mengeksekusi:
        1. Re-run Newton-Raphson dengan revisedCashflows (seed = eir_sebelum)
        2. Hitung catch_up_adjustment = NPV difference pada amendmentDate
        3. UPDATE rows lama ecl.eir_amortization_schedule
           SET recomputed_from_seq = first_new_periode_seq
           WHERE instrumen_id = X AND periode_seq >= amendmentPeriodeSeq
           AND recomputed_from_seq IS NULL
           (HANYA kolom tracking; amounts finansial TIDAK BOLEH DIUBAH)
        4. INSERT rows baru mulai amendmentDate, recomputed_from_seq = NULL
        5. UPDATE mst.instrumen SET eir_awal = new_eir
        6. UPDATE eir_reestimation_log: workflow_status = 'APPROVED', approved_at,
           approver_id, eir_sesudah, signature_hash_approve
        7. Tulis EIR.AMEND_APPROVED ke aud.audit_log

        Jika re-estimasi solver gagal konvergen → rollback seluruh transaksi,
        workflow_status kembali ke PENDING_APPROVAL,
        tulis EIR.REESTIMATION_FAILED ke aud.audit_log.

        Permission: eir.amend.approve
        Role: ROLE-ALCO
        MFA: Step-up MFA wajib (X-Step-Up-Token header)

        SoD: approver_id ≠ maker_id ≠ reviewer_id → SOD_VIOLATION 403.
        Audit event: EIR.AMEND_APPROVED (atau EIR.REESTIMATION_FAILED jika solver gagal)
        Idempotency-Key wajib.
      tags: [eir-amendment]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/amendmentIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XStepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionRequest"
            example:
              action: "APPROVE"
              comment: "Disetujui. EIR baru akan berlaku mulai periode 5."
              signatureMethod: "JWT_STEP_UP"
      responses:
        "200":
          description: Proposal approved, re-estimasi dieksekusi, schedule diperbarui
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/EIRAmendmentProposal"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permission, SoD, atau step-up MFA tidak terpenuhi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                stepUpRequired:
                  value:
                    error:
                      code: STEP_UP_REQUIRED
                      message: "Action ini membutuhkan step-up MFA. Lakukan POST /auth/step-up terlebih dahulu."
                      details: []
                      traceId: "01HXY..."
                sod:
                  value:
                    error:
                      code: SOD_VIOLATION
                      message: "Approver tidak boleh sama dengan maker atau reviewer."
                      details: []
                      traceId: "01HXY..."
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Workflow transition tidak valid atau solver gagal konvergen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidTransition:
                  $ref: "#/components/responses/WorkflowInvalidTransition"
                nonConvergent:
                  value:
                    error:
                      code: EIR_NON_CONVERGENT
                      message: "Re-estimasi EIR gagal konvergen. Proposal dikembalikan ke PENDING_APPROVAL. Periksa cashflow revisi."
                      details: []
                      traceId: "01HXY..."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
