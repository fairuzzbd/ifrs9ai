          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # S4 — OVERRIDE APPROVE (ROLE-AKUN-CTL, SoD enforced)
  # ===========================================================================

  /trx/mtm/{id}/override-approve:
    post:
      operationId: mtmOverrideApprove
      summary: Override approve MTM row — ROLE-AKUN-CTL; PENDING_REVIEW → APPROVED; call P5-M2 jurnal
      description: |
        AC: S4-AC1, S4-AC3 (SoD), S4-AC2 (jurnal diposting)

        ROLE-AKUN-CTL (user berbeda dari uploader) menyetujui satu MTM row.
        Saat approve: call P5-M2 POST /api/v1/jurnal/post-entry dengan event_code dari routing matrix.

        Pre-conditions:
          - trx.mtm.status IN ('PENDING_REVIEW', 'STALE_PRICE')
          - override_approver_id ≠ uploader_id (SoD, DEC-017) — S4-AC3
          - locked_flag = FALSE (periode tidak CLOSED)
          - comment WAJIB ada (min 30 karakter untuk DEVIATION row; best practice untuk semua)

        Sukses (in-transaction):
          1. UPDATE trx.mtm SET status='APPROVED', override_approver_id, override_comment, override_at
          2. Call P5-M2 jurnal engine (event_code dari resolveJurnalEventCode)
          3. UPDATE trx.mtm SET jurnal_entry_id, jurnal_event_code
          4. INSERT aud.audit_log action=MTM.OVERRIDE_APPROVED
          5. Notifikasi ke uploader (jika manual upload)

        SoD violation → 403 MTM_OVERRIDE_SOD_VIOLATION + advisory audit MTM.OVERRIDE_REJECTED_SOD.
        Jurnal engine call gagal → rollback seluruh transaksi + 500 INTERNAL.

        Permission: mtm.override
        Roles: ROLE-AKUN-CTL
        MFA: wajib (DEC-026 ROLE-AKUN-CTL)
        Idempotency-Key: WAJIB
        Rate limit: 20 req/min per user
      tags: [mtm-override]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID dari trx.mtm row dalam status PENDING_REVIEW atau STALE_PRICE."
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID v4 unik per request. DEC-021."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MtmOverrideApproveBody"
            example:
              comment: "Harga terverifikasi via Bloomberg terminal. Delta 7.3% wajar karena rilis FOMC. Disetujui."
              signatureMethod: "JWT_STEP_UP"
      responses:
        "200":
          description: Override approve berhasil — status APPROVED, jurnal diposting via P5-M2
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/MtmOverrideApproveResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  mtmId: "d4e5f6a7-b8c9-0123-def0-234567890123"
                  instrumenKode: "OBL-0042"
                  status: "APPROVED"
                  jurnalEntryId: "5c3d4e5f-a6b7-8901-5678-012345678901"
                  jurnalEventCodes: ["MTM_FVOCI"]
                  approvedBy: "a9b0c1d2-e3f4-5678-9012-345678901234"
                  approvedAt: "2026-06-18T14:30:00+07:00"
                  message: "Override MTM OBL-0042 2026-06-18 disetujui. Jurnal MTM_FVOCI berhasil diposting."
                meta:
                  traceId: "01HXY..."
        "400":
          description: Validasi body gagal (comment terlalu pendek)
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: "1 field tidak valid"
                  details:
                    - field: "body.comment"
                      rule: "min_length:30"
                      message: "comment wajib minimal 30 karakter untuk override-approve MTM dengan deviasi."
                  traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          description: SoD violation atau permission tidak terpenuhi
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              examples:
                sod_violation:
                  summary: S4-AC3 — Uploader mencoba approve MTM yang dia upload sendiri
                  value:
                    error:
                      code: MTM_OVERRIDE_SOD_VIOLATION
                      message: "Anda tidak dapat meng-approve MTM yang Anda upload sendiri. SoD: override_approver_id ≠ uploader_id (DEC-017)."
                      details:
                        - field: "actor.userId"
                          rule: "sod_approver_ne_uploader"
                          message: "User UUID matches uploader_id."
                      traceId: "01HXY..."
                forbidden:
                  summary: Permission mtm.override tidak terpenuhi
                  value:
                    error:
                      code: FORBIDDEN
                      message: "Anda tidak memiliki permission 'mtm.override'."
                      details: []
                      traceId: "01HXY..."
        "404":
          $ref: "./_common.yaml#/components/responses/NotFound"
        "422":
          description: Transisi tidak valid — status bukan PENDING_REVIEW atau STALE_PRICE
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: WORKFLOW_INVALID_TRANSITION
                  message: "Override-approve hanya valid dari status PENDING_REVIEW atau STALE_PRICE. Status saat ini: AUTO_POSTED."
                  details:
                    - field: "status"
                      rule: "invalid_transition"
                      message: "AUTO_POSTED → APPROVED tidak valid via override-approve."
                  traceId: "01HXY..."
        "423":
          description: Periode CLOSED — MTM sudah locked
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: MTM_PERIODE_LOCKED
                  message: "MTM untuk periode ini sudah dikunci (hard-closed). Override tidak dapat dilakukan."
                  details: []
                  traceId: "01HXY..."
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # S4 — OVERRIDE REJECT (ROLE-AKUN-CTL, SoD enforced)
  # ===========================================================================

  /trx/mtm/{id}/override-reject:
    post:
      operationId: mtmOverrideReject
      summary: Override reject MTM row — ROLE-AKUN-CTL; PENDING_REVIEW → REJECTED; comment ≥ 30 char
      description: |
        AC: S4-AC2, S4-AC3 (SoD), S4-AC4 (comment < 30 char)

        ROLE-AKUN-CTL menolak satu MTM row. comment WAJIB ≥ 30 karakter (DEC-017).
        Jurnal TIDAK diposting. Notifikasi ke uploader (manual upload) atau ROLE-AKUN (cron row).

        Pre-conditions:
          - trx.mtm.status IN ('PENDING_REVIEW', 'STALE_PRICE')
          - override_approver_id ≠ uploader_id (SoD, DEC-017)
          - locked_flag = FALSE
          - body.comment minLength 30 karakter — S4-AC4

        Sukses (in-transaction):
          1. UPDATE trx.mtm SET status='REJECTED', override_approver_id, override_comment, override_at
          2. INSERT aud.audit_log action=MTM.OVERRIDE_REJECTED
          3. Notifikasi ke uploader: "MTM {instrumen} {tanggal} DITOLAK. Alasan: '{comment}'."

        SoD violation → 403 MTM_OVERRIDE_SOD_VIOLATION.

        Permission: mtm.override
        Roles: ROLE-AKUN-CTL
        MFA: wajib (DEC-026 ROLE-AKUN-CTL)
        Idempotency-Key: WAJIB
        Rate limit: 20 req/min per user
      tags: [mtm-override]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
