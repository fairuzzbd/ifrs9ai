openapi: "3.0.3"
info:
  title: BLIPS IFRS9 — APP-B MTM Daily Job + Manual Upload (P5-M6)
  version: "1.0.0"
  description: |
    Modul APP-B (transaksi) — Mark-to-Market Harian + Manual Upload (Phase 5, Module 6).

    Cakupan:
      - List MTM dengan sort + filter + export (S1, S2, S3)
      - Detail single MTM row (S1)
      - Manual upload harga MTM XLSX/CSV — ROLE-AKUN Maker (S2)
      - Batch detail dengan row breakdown (S2)
      - Override approve per row — ROLE-AKUN-CTL, SoD (S4)
      - Override reject per row — ROLE-AKUN-CTL, SoD (S4)
      - Manual trigger MTM cron — ROLE-IT-ADMIN, Asynq long-running (S1)
      - STALE_PRICE alerts list (S3)

    AC ID coverage:
      S1-AC1 (auto-post normal), S1-AC2 (deviation→PENDING_REVIEW), S1-AC3 (STALE_PRICE),
      S1-AC4 (DLQ + alert), S2-AC1 (upload berhasil), S2-AC2 (AC instrumen ditolak),
      S2-AC3 (periode CLOSED), S2-AC4 (idempotency replay), S3-AC1 (antrian PENDING_REVIEW+STALE),
      S3-AC2 (STALE > 5 hari eskalasi RISK), S3-AC3 (kurs FCY unavailable),
      S3-AC4 (config threshold update), S4-AC1 (override-approve jurnal posted),
      S4-AC2 (override-reject jurnal tidak posted), S4-AC3 (SoD violation),
      S4-AC4 (reject comment terlalu pendek), S5-AC1 (FVOCI_DEBT FCY routing),
      S5-AC2 (FVOCI_ELECTION routing), S5-AC3 (AC skip), S5-AC4 (POCI routing)

    Dependensi:
      - P5-M1 (mst.instrumen ACTIVE + klasifikasi_psak71 locked) — MTM hanya untuk ACTIVE non-AC
      - P5-M2 (jurnal engine) — AUTO_POSTED dan APPROVED call POST /jurnal/post-entry
      - P5-M3 (feed staging IBPA/BEI/KSEI) — cron membaca sys.ibpa_feed_staging dst
      - P5-M4 (periode close) — hard-close set locked_flag=TRUE pada trx.mtm rows
      - P5-M5 (mst.kurs APPROVED) — FCY instrumen perlu kurs_tengah untuk konversi EAD_IDR
      - Migration 000040 (trx.mtm) + 000041 (sys.upload_batch MTM FK + config)
      - DEC-016 (LOCKED) — NUMERIC(20,8) harga; NUMERIC(20,4) nilai IDR; shopspring/decimal
      - DEC-017 (LOCKED) — 4-eyes SoD: uploader (maker) ≠ override_approver
      - DEC-018 (LOCKED) — audit trail append-only, retensi 10+10 tahun
      - DEC-021 (LOCKED) — Idempotency-Key wajib di mutating endpoint
      - DEC-022 (LOCKED) — cursor-based pagination

    State machine trx.mtm.status:
      PENDING_REVIEW (deviation > threshold OR manual upload OR STALE_PRICE override request)
        → [override-approve, ROLE-AKUN-CTL, SoD] → APPROVED
        → [override-reject, ROLE-AKUN-CTL, SoD] → REJECTED (terminal)
      AUTO_POSTED (cron path normal, delta_pct ≤ threshold, harga fresh) — read-only after post
      APPROVED (override-approve → jurnal posted) — read-only
      REJECTED — terminal, jurnal tidak diposting
      STALE_PRICE (harga_age_days > threshold) — not posted; alert ROLE-AKUN-CTL

    MTM Cron worker (S1 — Asynq):
      Schedule: "0 11 * * 1-5" (18:00 WIB = 11:00 UTC, Senin-Jumat)
      Idempotent: UNIQUE(instrumen_id, tanggal_mtm, harga_sumber) — skip jika status != REJECTED
      Partial run: satu instrumen error tidak rollback yang lain
      Retry 3× interval 15 menit → DLQ sys.dead_letter_queue + alert ROLE-IT-ADMIN
      Progress via sys.job + Redis pub/sub (SSE) → <JobProgressPanel> (UX rule §3)
      Performance SLA: ≤ 5 menit untuk 1000 instrumen

    Price deviation threshold (S3):
      sys.config_param MTM_PRICE_DEVIATION_THRESHOLD_PCT (default 5.0%)
      ABS(delta_pct) > threshold → deviation_flag=TRUE, status=PENDING_REVIEW

    Stale price threshold (S3):
      sys.config_param MTM_PRICE_STALE_DAYS (default 5)
      harga_age_days > threshold → stale_price_flag=TRUE, status=STALE_PRICE

    Jurnal routing matrix (S5 — ifrs9-compliance-reviewer BLOCKING):
      FVOCI_DEBT IDR    → MTM_FVOCI
      FVOCI_DEBT FCY    → MTM_FVOCI + MTM_FX_OCI_RESERVE (§B5.7.2A — dua jurnal terpisah)
      FVOCI_ELECTION    → MTM_FVOCI_ELECTION (no P&L recycling, irrevocable §5.7.5)
      FVTPL             → MTM_FVTPL
      POCI              → MTM_FVTPL_POCI (no Stage escalation)
      AC                → SKIP (MTM_INSTRUMEN_AC_SKIP)

    FX treatment: call P5-M5 GET /master/kurs/treatment/{instrumen_id} for FCY instrumen.

    Periode lock: MtmLockMiddleware checks locked_flag before any mutation.
      locked_flag=TRUE → 423 MTM_PERIODE_LOCKED (mirror FxRateLockMiddleware pattern P5-M5)
      DB trigger tg_mtm_locked_check (BEFORE UPDATE OR DELETE ON trx.mtm) as defence-in-depth.

    Override flow + SoD (S4):
      override_approver_id ≠ uploader_id enforced server-side (not only DB constraint)
      DB constraint chk_mtm_sod as safety net second layer
      SoD violation → 403 MTM_OVERRIDE_SOD_VIOLATION + advisory audit MTM.OVERRIDE_REJECTED_SOD

    Audit events (all in-transaction kecuali advisory):
      MTM.AUTO_POSTED, MTM.PENDING_REVIEW, MTM.STALE_PRICE_ALERT
      MTM.UPLOADED, MTM.OVERRIDE_APPROVED, MTM.OVERRIDE_REJECTED
      MTM.OVERRIDE_REJECTED_SOD (advisory), MTM.HOLIDAY_SKIP (advisory)
      MTM.CRON_FAILED (advisory + DLQ), MTM.INSTRUMEN_AC_SKIP (advisory, batch per run)
      MTM.EXPORT (in-transaction per export call)

    Error codes baru (ditambahkan ke _common.yaml):
      MTM_PRICE_STALE            422 — stale_price_flag=TRUE; jurnal tidak dapat diposting otomatis
      MTM_PRICE_DEVIATION_REJECTED 422 — notifikasi ke uploader saat override-reject baris deviation
      MTM_BATCH_NOT_FOUND        404 — upload_batch_id tidak ditemukan
      MTM_OVERRIDE_SOD_VIOLATION 403 — override_approver_id = uploader_id (SoD violation)
      MTM_INSTRUMEN_AC_SKIP      422 — instrumen AC dimasukkan ke upload MTM
      MTM_PERIODE_LOCKED         423 — mutasi trx.mtm saat locked_flag=TRUE (periode CLOSED)

    Performance SLA:
      GET /trx/mtm (list):                ≤ 500 ms (cursor paginated, indexed)
      GET /trx/mtm/{id}:                  ≤ 100 ms (single row)
      POST /trx/mtm/upload/batch:         ≤ 3 s (parse XLSX/CSV + batch INSERT + audit)
      GET /trx/mtm/upload/batch/{id}:     ≤ 200 ms
      POST /trx/mtm/{id}/override-approve: ≤ 300 ms (state update + jurnal call + audit)
      POST /trx/mtm/{id}/override-reject:  ≤ 300 ms
      POST /trx/mtm/cron/trigger:          ≤ 200 ms (enqueue only; worker async)
      GET /trx/mtm/alerts/stale-price:     ≤ 300 ms
      MTM cron worker (1000 instrumen):    ≤ 5 menit wall-clock

    Schema: migration 000040 (trx.mtm) + 000041 (sys.config MTM keys + mst.mapping_jurnal seed).
    BLOCKING compliance gate: S5 (jurnal routing) → ifrs9-compliance-reviewer.
    BLOCKING security gate: S4 (SoD + audit) → security-engineer.
    ecl-eir-engineer: POCI MTM_FVTPL_POCI tidak double-count ECL (advisory cross-check).
    integration-engineer: IBPA/BEI/KSEI real feed adapter (deferred; cron reads from staging tables).

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: mtm-list
    description: "List, filter, sort, export MTM rows — DataTable pattern §1"
  - name: mtm-upload
    description: "Manual upload harga MTM XLSX/CSV (ROLE-AKUN Maker) dan batch detail"
  - name: mtm-override
    description: "Override approve/reject per row — ROLE-AKUN-CTL, SoD enforced (S4)"
  - name: mtm-cron
    description: "Manual trigger MTM cron — ROLE-IT-ADMIN; Asynq long-running job (§3 UX)"
  - name: mtm-alerts
    description: "STALE_PRICE alert list — ROLE-AKUN-CTL monitoring (S3)"

paths:

  # ===========================================================================
  # GET /trx/mtm — List dengan sort + filter + export (S1, S2, S3, UX §1)
  # ===========================================================================

  /trx/mtm:
    get:
      operationId: mtmGetList
      summary: List MTM rows dengan sort, filter, cursor pagination, dan export
      description: |
        AC: S1-AC1 (AUTO_POSTED ter-list), S1-AC2 (PENDING_REVIEW ter-list),
            S1-AC3 (STALE_PRICE ter-list), S3-AC1 (antrian PENDING_REVIEW + STALE_PRICE),
            S2-AC1 (uploaded ter-list)

        Cursor-paginated list trx.mtm. Default sort: tanggal_mtm DESC, created_at DESC.

        Allowed sort columns: tanggal_mtm, instrumen_kode, klasifikasi_psak71, delta_pct,
          harga_age_days, status, harga_sumber, created_at.

        Filter:
          filter[instrumen_id]       — UUID mst.instrumen
          filter[instrumen_kode]     — text partial match (like:%substr%)
          filter[tanggal_mtm]        — date range: between:2026-06-01,2026-06-30
          filter[status]             — enum: AUTO_POSTED, PENDING_REVIEW, APPROVED, REJECTED, STALE_PRICE
                                       Multi-value: filter[status][]=PENDING_REVIEW&filter[status][]=STALE_PRICE
          filter[klasifikasi_psak71] — enum: FVOCI_DEBT, FVTPL, FVOCI_ELECTION, POCI
          filter[deviation_flag]     — boolean: true (hanya baris dengan deviasi > threshold)
          filter[stale_price_flag]   — boolean: true (hanya baris STALE_PRICE)
          filter[harga_sumber]       — enum: IBPA, BEI, KSEI, MANUAL, IBPA_MANUAL, BEI_MANUAL
          filter[upload_batch_id]    — UUID, filter per batch upload
          filter[periode_bulanan_id] — UUID mst.periode_buku

        Export:
          ?export=csv atau ?export=xlsx
          Dataset ≤ 10k row → inline stream (Content-Disposition)
          Dataset > 10k row → 202 + jobId (Asynq async ke MinIO, §3 UX pattern)
          Audit: MTM.EXPORT in-transaction per export

        Permission: mtm.read
        Roles: ROLE-AKUN, ROLE-AKUN-CTL, ROLE-RISK, ROLE-AUDIT, ROLE-IT-ADMIN
        Rate limit: 60 req/min per user (read); 10 req/min per user (export)
      tags: [mtm-list]
      parameters:
        - $ref: "./_common.yaml#/components/parameters/cursor"
        - $ref: "./_common.yaml#/components/parameters/limit"
        - $ref: "./_common.yaml#/components/parameters/sortParam"
        - $ref: "./_common.yaml#/components/parameters/searchParam"
        - name: "filter[instrumen_id]"
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: "Filter berdasarkan instrumen UUID."
        - name: "filter[instrumen_kode]"
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
          description: "Partial match kode instrumen (server-side ILIKE)."
          example: "OBL-00"
        - name: "filter[tanggal_mtm]"
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter tanggal MTM. Operator: eq:2026-06-18, between:2026-06-01,2026-06-30,
            gte:2026-06-01, lte:2026-06-30.
          example: "between:2026-06-01,2026-06-30"
        - name: "filter[status]"
          in: query
          required: false
          schema:
            type: string
            enum: [AUTO_POSTED, PENDING_REVIEW, APPROVED, REJECTED, STALE_PRICE]
          description: "Filter status. Multi-value via filter[status][]= notation."
          example: "PENDING_REVIEW"
        - name: "filter[klasifikasi_psak71]"
          in: query
          required: false
          schema:
            type: string
            enum: [FVOCI_DEBT, FVTPL, FVOCI_ELECTION, POCI]
          description: "Filter berdasarkan klasifikasi PSAK 71 snapshot instrumen."
        - name: "filter[deviation_flag]"
          in: query
          required: false
          schema:
            type: boolean
          description: "true = tampilkan hanya baris dengan deviation_flag=TRUE."
        - name: "filter[stale_price_flag]"
          in: query
          required: false
          schema:
            type: boolean
          description: "true = tampilkan hanya baris dengan stale_price_flag=TRUE."
        - name: "filter[harga_sumber]"
          in: query
          required: false
          schema:
            type: string
            enum: [IBPA, BEI, KSEI, MANUAL, IBPA_MANUAL, BEI_MANUAL]
          description: "Filter berdasarkan sumber harga."
        - name: "filter[upload_batch_id]"
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: "Filter berdasarkan batch upload ID (untuk hasil manual upload)."
        - name: "filter[periode_bulanan_id]"
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: "Filter berdasarkan periode buku ID."
        - name: export
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xlsx]
          description: |
            Format export. Dataset ≤ 10k row → inline file (stream).
            Dataset > 10k row → 202 Accepted dengan jobId (async ke MinIO).
        - $ref: "./_common.yaml#/components/parameters/includeDeleted"
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
          description: Trace ID. Gateway inject otomatis.
      responses:
        "200":
          description: List MTM dengan pagination
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MtmListItem"
                  pagination:
                    $ref: "./_common.yaml#/components/schemas/PaginationResponse"
                  appliedSort:
                    type: array
                    items:
                      type: object
                      properties:
                        col:
                          type: string
                        dir:
                          type: string
                          enum: [asc, desc]
                  appliedFilter:
                    type: object
                    additionalProperties: true
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    instrumenId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    instrumenKode: "OBL-0042"
                    instrumenNama: "Obligasi FR0089 2028"
                    tanggalMtm: "2026-06-18"
                    hargaSumber: "IBPA"
                    hargaPasarIdr: 16006250.0000
                    hargaBukuIdr: 15840000.0000
                    deltaIdr: 166250.0000
                    deltaPct: 1.0496
                    hargaAgeDays: 0
                    stalePriceFlag: false
                    deviationFlag: false
                    status: "AUTO_POSTED"
                    klasifikasiSnapshot: "FVOCI_DEBT"
                    jurnalEventCode: "MTM_FVOCI"
                    jurnalEntryId: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                    uploaderId: null
                    overrideApproverId: null
                    overrideAt: null
                    lockedFlag: false
                    createdAt: "2026-06-18T18:00:10+07:00"
                  - id: "d4e5f6a7-b8c9-0123-def0-234567890123"
                    instrumenId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                    instrumenKode: "OBL-0088"
                    instrumenNama: "Obligasi BUMN 2030"
                    tanggalMtm: "2026-06-18"
                    hargaSumber: "IBPA"
                    hargaPasarIdr: 9000000.0000
                    hargaBukuIdr: 9900000.0000
                    deltaIdr: -900000.0000
                    deltaPct: -9.0909
                    hargaAgeDays: 0
                    stalePriceFlag: false
                    deviationFlag: true
                    status: "PENDING_REVIEW"
                    klasifikasiSnapshot: "FVTPL"
                    jurnalEventCode: null
                    jurnalEntryId: null
                    uploaderId: null
                    overrideApproverId: null
                    overrideAt: null
                    lockedFlag: false
                    createdAt: "2026-06-18T18:00:12+07:00"
                pagination:
                  nextCursor: "eyJpZCI6ImQ0ZTVmNi4uLiJ9"
                  hasMore: true
                  totalEstimate: 847
                  limit: 50
                appliedSort:
                  - col: "tanggal_mtm"
                    dir: "desc"
                appliedFilter:
                  status: "PENDING_REVIEW"
                meta:
                  traceId: "01HXY..."
        "202":
          description: Export async — dataset > 10k row; Asynq job enqueued ke MinIO
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/MtmAsyncExportJobResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  jobId: "job_MTM_EXPORT_01HXYZ"
                  type: "MTM_EXPORT"
                  statusUrl: "/api/v1/jobs/job_MTM_EXPORT_01HXYZ"
                  streamUrl: "/api/v1/jobs/job_MTM_EXPORT_01HXYZ/stream"
                  message: "Export dataset besar dijadwalkan. File tersedia via download link setelah selesai."
                meta:
                  traceId: "01HXY..."
        "400":
          $ref: "./_common.yaml#/components/responses/ValidationFailed"
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # GET /trx/mtm/{id} — Detail single MTM row
  # ===========================================================================

  /trx/mtm/{id}:
    get:
      operationId: mtmGetDetail
      summary: Detail single MTM row
      description: |
        AC: S4-AC1 (verify status=APPROVED setelah override-approve)

        Mengembalikan detail lengkap satu trx.mtm row termasuk:
          - harga_pasar_fcy, kurs_tengah (FCY instrumen)
          - override_comment, override_approver_id (jika override)
          - jurnal_event_code(s) (bisa lebih dari satu untuk FVOCI_DEBT FCY)
          - upload_batch_id + batch summary (jika manual upload)
          - locked_flag (dari periode hard-close P5-M4)

        Permission: mtm.read
        Roles: ROLE-AKUN, ROLE-AKUN-CTL, ROLE-RISK, ROLE-AUDIT, ROLE-IT-ADMIN
        Rate limit: 60 req/min per user
      tags: [mtm-list]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID dari trx.mtm row."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Detail MTM row
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/MtmDetail"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              examples:
                auto_posted_fvoci_fcv:
                  summary: S1-AC1 — AUTO_POSTED OBL-0042 FVOCI_DEBT USD (dual jurnal §B5.7.2A)
                  value:
                    data:
                      id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      instrumenId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                      instrumenKode: "OBL-0042"
                      instrumenNama: "Obligasi FR0089 2028"
                      periodeBulananId: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                      tanggalMtm: "2026-06-18"
                      hargaSumber: "IBPA"
                      hargaTanggal: "2026-06-18"
                      hargaAgeDays: 0
                      hargaPasarFcy: 98.50000000
                      hargaPasarIdr: 16006250.0000
                      hargaBukuIdr: 15840000.0000
                      deltaIdr: 166250.0000
                      deltaPct: 1.0496
                      kursId: "f6a7b8c9-d0e1-2345-f012-456789012345"
                      kursTengah: 16250.00000000
                      stalePriceFlag: false
                      deviationFlag: false
                      status: "AUTO_POSTED"
                      klasifikasiSnapshot: "FVOCI_DEBT"
                      treatmentSnapshot: "OCI_FOREIGN_EXCHANGE_RESERVE"
                      jurnalEventCodes: ["MTM_FVOCI", "MTM_FX_OCI_RESERVE"]
                      jurnalEntryId: "07b8c9d0-e1f2-3456-0123-567890123456"
                      uploadBatchId: null
                      uploaderId: null
