              signatureMethod: "JWT_STEP_UP"
      responses:
        "200":
          description: Override reject berhasil — status REJECTED, jurnal tidak diposting
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/MtmOverrideRejectResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  mtmId: "d4e5f6a7-b8c9-0123-def0-234567890123"
                  instrumenKode: "OBL-0042"
                  status: "REJECTED"
                  rejectedBy: "a9b0c1d2-e3f4-5678-9012-345678901234"
                  rejectedAt: "2026-06-18T14:45:00+07:00"
                  comment: "Harga 90.00 tidak sesuai IBPA hari ini (seharusnya 98.50). Harap re-upload dengan referensi sumber yang benar."
                  message: "MTM OBL-0042 2026-06-18 ditolak. ROLE-AKUN telah dinotifikasi untuk re-upload."
                meta:
                  traceId: "01HXY..."
        "400":
          description: comment terlalu pendek (< 30 char) — S4-AC4
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: "1 field tidak valid"
                  details:
                    - field: "body.comment"
                      rule: "min_length:30"
                      message: "comment wajib minimal 30 karakter untuk override-reject MTM."
                  traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          description: SoD violation atau permission tidak terpenuhi
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: MTM_OVERRIDE_SOD_VIOLATION
                  message: "Anda tidak dapat menolak MTM yang Anda upload sendiri. SoD: override_approver_id ≠ uploader_id (DEC-017)."
                  details: []
                  traceId: "01HXY..."
        "404":
          $ref: "./_common.yaml#/components/responses/NotFound"
        "422":
          description: Transisi tidak valid
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: WORKFLOW_INVALID_TRANSITION
                  message: "Override-reject hanya valid dari status PENDING_REVIEW atau STALE_PRICE. Status saat ini: APPROVED."
                  details: []
                  traceId: "01HXY..."
        "423":
          $ref: "./_common.yaml#/components/responses/PeriodeClosed"
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # S1 — MTM CRON MANUAL TRIGGER (ROLE-IT-ADMIN, async Asynq)
  # ===========================================================================

  /trx/mtm/cron/trigger:
    post:
      operationId: mtmCronTrigger
      summary: Manual trigger MTM cron — ROLE-IT-ADMIN; returns Asynq jobId (long-running §3)
      description: |
        AC: S1-AC1 (trigger manual jika cron terlewat), S1-AC4 (DLQ pada failure)

        ROLE-IT-ADMIN men-trigger MTM daily run secara manual (mis. jika cron terlewat atau
        ada instrumen baru yang perlu immediate MTM). Endpoint enqueue Asynq job
        "trx:mtm_daily_run" dan return jobId untuk <JobProgressPanel> (§3 UX pattern).

        Logic worker yang di-trigger (sama dengan cron otomatis 18:00 WIB):
          1. Cek sys.holiday_calendar untuk tanggal_target. Jika libur → skip + advisory log.
          2. Fetch harga dari sys.ibpa_feed_staging / sys.bei_feed_staging / sys.ksei_feed_staging.
          3. Idempotent: UNIQUE(instrumen_id, tanggal_mtm, harga_sumber) — skip jika status != REJECTED.
          4. Compute delta_idr, delta_pct; evaluate deviation_flag dan stale_price_flag.
          5. FCY: call P5-M5 GET /master/kurs/treatment/{instrumen_id} untuk FX routing.
          6. AC: SKIP per resolveJurnalEventCode.
          7. AUTO_POSTED → call P5-M2 POST /jurnal/post-entry in-transaction.
          8. PENDING_REVIEW + STALE_PRICE → notif ROLE-AKUN-CTL.
          9. Retry 3× (interval 15 menit) on error → DLQ sys.dead_letter_queue + alert ROLE-IT-ADMIN.

        Progress phases (§3 UX):
          Phase 1: "Membaca daftar instrumen aktif non-AC ({N} instrumen)..."
          Phase 2: "Menghitung MTM instrumen {i} dari {N}: {kode}"
          Phase 3: "Posting jurnal AUTO_POSTED ({X} transaksi)..."
          Complete: "{auto_posted} auto-posted, {pending_review} pending review, {stale} stale, {ac_skip} AC skipped."

        Parameter opsional:
          tanggalTarget: tanggal MTM run (default: hari ini). Tidak boleh future date.
          Tanggal dalam periode CLOSED → 423 MTM_PERIODE_LOCKED.

        Permission: mtm.trigger
        Roles: ROLE-IT-ADMIN
        MFA: wajib (DEC-026 ROLE-IT-ADMIN)
        Idempotency-Key: WAJIB
        Rate limit: 10 req/jam per user
      tags: [mtm-cron]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID v4 unik per request. DEC-021."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggalTarget:
                  type: string
                  format: date
                  description: |
                    Tanggal untuk MTM run. Default: hari ini (server TZ = Asia/Jakarta).
                    Tidak boleh future date.
                    Jika tanggal dalam periode CLOSED → 423 MTM_PERIODE_LOCKED.
                  example: "2026-06-18"
                forceRerun:
                  type: boolean
                  default: false
                  description: |
                    Jika true: re-run untuk instrumen yang sudah AUTO_POSTED atau APPROVED.
                    Existing row di-update HANYA jika tidak locked.
                    Default false (idempotent skip jika sudah ada).
            example:
              tanggalTarget: "2026-06-18"
              forceRerun: false
      responses:
        "202":
          description: MTM cron job enqueued — follow via JobProgressPanel (§3 UX)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/MtmCronJobResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  jobId: "job_MTM_CRON_01HXYZ"
                  type: "MTM_DAILY_RUN"
                  tanggalTarget: "2026-06-18"
                  statusUrl: "/api/v1/jobs/job_MTM_CRON_01HXYZ"
                  streamUrl: "/api/v1/jobs/job_MTM_CRON_01HXYZ/stream"
                  estimatedInstrumen: 1000
                  message: "MTM cron dijadwalkan untuk 2026-06-18. Monitor progres via JobProgressPanel."
                meta:
                  traceId: "01HXY..."
        "400":
          description: tanggalTarget format salah atau future date
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: "1 field tidak valid"
                  details:
                    - field: "body.tanggalTarget"
                      rule: "not_future_date"
                      message: "tanggalTarget tidak boleh tanggal yang akan datang."
                  traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "423":
          description: Tanggal target dalam periode CLOSED
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: MTM_PERIODE_LOCKED
                  message: "Tanggal 2026-05-15 berada dalam periode PRD-2026-05 yang sudah hard-closed. MTM run tidak dapat dilakukan untuk tanggal tersebut."
                  details: []
                  traceId: "01HXY..."
        "429":
          description: Rate limited — 10 req/jam untuk endpoint sensitif ini
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: RATE_LIMITED
                  message: "Terlalu banyak request MTM cron trigger. Maksimal 10 kali per jam per user."
                  details: []
                  traceId: "01HXY..."
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # S3 — STALE_PRICE ALERTS LIST (ROLE-AKUN-CTL monitoring)
  # ===========================================================================

  /trx/mtm/alerts/stale-price:
    get:
      operationId: mtmAlertsStalePrice
      summary: List current STALE_PRICE alerts — ROLE-AKUN-CTL monitoring dashboard (S3)
      description: |
        AC: S3-AC1 (antrian STALE_PRICE), S3-AC2 (harga > 5 hari — escalation flag), S3-AC3 (kurs FCY unavailable)

        Mengembalikan daftar MTM rows dengan stale_price_flag=TRUE saat ini
        (status IN ('STALE_PRICE', 'PENDING_REVIEW') AND stale_price_flag=TRUE).

        Default sort: harga_age_days DESC (paling lama pertama), tanggal_mtm ASC.

        Kolom wajib per baris:
          instrumen_kode, klasifikasi_psak71, tanggal_mtm, harga_tanggal, harga_age_days,
          status, stale_price_reason ('HARGA_TIDAK_TERSEDIA' | 'KURS_FCY_TIDAK_TERSEDIA'),
          eskalasi_flag (TRUE jika harga_age_days > MTM_PRICE_STALE_DAYS × 1.5 atau > 7 — eskalasi ke ROLE-RISK)

        Threshold dan config sumber:
          sys.config_param MTM_PRICE_STALE_DAYS (default 5)
          Eskalasi ke ROLE-RISK: harga_age_days > 2 × MTM_PRICE_STALE_DAYS (default > 10) ATAU
          harga_age_days > sys.config_param MTM_STALE_ESCALATION_DAYS (default 7)

        Permission: mtm.read
        Roles: ROLE-AKUN-CTL, ROLE-RISK, ROLE-AUDIT, ROLE-IT-ADMIN
        Rate limit: 60 req/min per user
      tags: [mtm-alerts]
      parameters:
        - $ref: "./_common.yaml#/components/parameters/cursor"
        - $ref: "./_common.yaml#/components/parameters/limit"
        - name: "filter[tanggal_mtm]"
          in: query
          required: false
          schema:
            type: string
          description: "Filter tanggal MTM. Contoh: gte:2026-06-15"
          example: "gte:2026-06-15"
        - name: "filter[klasifikasi_psak71]"
          in: query
          required: false
          schema:
            type: string
            enum: [FVOCI_DEBT, FVTPL, FVOCI_ELECTION, POCI]
          description: "Filter berdasarkan klasifikasi."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List STALE_PRICE alerts saat ini
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MtmStalePriceAlert"
                  pagination:
                    $ref: "./_common.yaml#/components/schemas/PaginationResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  - id: "f7a8b9c0-d1e2-3456-f234-890123456789"
                    instrumenId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                    instrumenKode: "SHM-0099"
                    klasifikasiSnapshot: "FVOCI_ELECTION"
                    tanggalMtm: "2026-06-18"
                    hargaTanggal: "2026-06-12"
                    hargaAgeDays: 6
                    status: "STALE_PRICE"
                    stalePriceReason: "HARGA_TIDAK_TERSEDIA"
                    eskalasiFlag: true
                    eskalasiNote: "Harga belum update 6 hari. Eskalasi ke ROLE-RISK per threshold 5 hari."
                    lockedFlag: false
                pagination:
                  nextCursor: null
                  hasMore: false
                  totalEstimate: 1
                  limit: 50
                meta:
                  traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

# ===========================================================================
# Components
# ===========================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RSA-2048 signed oleh Keycloak. Access token TTL 15 menit (DEC-025).

  schemas:

    # ---- MTM List Item (compact untuk DataTable) --------------------------
    MtmListItem:
      type: object
      required:
        - id
        - instrumenId
        - instrumenKode
        - tanggalMtm
        - hargaSumber
        - hargaPasarIdr
        - hargaBukuIdr
        - deltaIdr
        - deltaPct
        - hargaAgeDays
        - stalePriceFlag
        - deviationFlag
        - status
        - klasifikasiSnapshot
        - lockedFlag
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        instrumenId:
          type: string
          format: uuid
        instrumenKode:
          type: string
          example: "OBL-0042"
        instrumenNama:
          type: string
          nullable: true
          example: "Obligasi FR0089 2028"
        tanggalMtm:
          type: string
          format: date
          example: "2026-06-18"
        hargaSumber:
          type: string
          enum: [IBPA, BEI, KSEI, MANUAL, IBPA_MANUAL, BEI_MANUAL]
        hargaPasarIdr:
          type: number
          description: "Nilai IDR. NUMERIC(20,4) di DB. DEC-016."
          example: 16006250.0000
        hargaBukuIdr:
          type: number
          example: 15840000.0000
        deltaIdr:
          type: number
          description: "harga_pasar_idr − harga_buku_idr. NUMERIC(20,4)."
          example: 166250.0000
        deltaPct:
          type: number
          description: "(delta_idr / harga_buku_idr) × 100. NUMERIC(7,4)."
          example: 1.0496
        hargaAgeDays:
          type: integer
          description: "tanggal_mtm − harga_tanggal (hari)."
          example: 0
        stalePriceFlag:
          type: boolean
          example: false
        deviationFlag:
          type: boolean
          example: false
        status:
          $ref: "#/components/schemas/MtmStatus"
        klasifikasiSnapshot:
          type: string
          description: "Snapshot klasifikasi_psak71 instrumen saat MTM dihitung."
          enum: [FVOCI_DEBT, FVTPL, FVOCI_ELECTION, POCI]
        jurnalEventCode:
          type: string
          nullable: true
          description: "Event code jurnal yang digunakan (single, untuk FVOCI_DEBT FCY ada dua — lihat MtmDetail.jurnalEventCodes)."
          example: "MTM_FVOCI"
        jurnalEntryId:
          type: string
          format: uuid
          nullable: true
        uploadBatchId:
          type: string
          format: uuid
          nullable: true
        uploaderId:
          type: string
          format: uuid
          nullable: true
        overrideApproverId:
          type: string
          format: uuid
          nullable: true
        overrideAt:
          type: string
          format: date-time
          nullable: true
        lockedFlag:
          type: boolean
          description: "TRUE setelah periode hard-close (P5-M4 hook)."
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-06-18T18:00:10+07:00"

    # ---- MTM Detail (full row) --------------------------------------------
    MtmDetail:
      allOf:
        - $ref: "#/components/schemas/MtmListItem"
        - type: object
          properties:
            periodeBulananId:
              type: string
              format: uuid
            hargaTanggal:
              type: string
              format: date
              description: "Tanggal harga yang dipakai (bisa berbeda dari tanggal_mtm jika stale)."
              example: "2026-06-18"
            hargaPasarFcy:
              type: number
              nullable: true
              description: "Harga pasar dalam mata uang asal. NUMERIC(20,8). NULL jika IDR instrumen."
              example: 98.50000000
            kursId:
              type: string
              format: uuid
              nullable: true
            kursTengah:
              type: number
              nullable: true
              description: "Snapshot kurs saat MTM. NUMERIC(20,8). NULL jika IDR instrumen."
              example: 16250.00000000
            treatmentSnapshot:
              type: string
              nullable: true
              description: "FX treatment routing snapshot dari P5-M5 GET /treatment."
              example: "OCI_FOREIGN_EXCHANGE_RESERVE"
            jurnalEventCodes:
              type: array
              nullable: true
              description: "Array event codes (FVOCI_DEBT FCY: dua kode [MTM_FVOCI, MTM_FX_OCI_RESERVE])."
              items:
                type: string
                enum: [MTM_FVOCI, MTM_FVTPL, MTM_FVOCI_ELECTION, MTM_FX_OCI_RESERVE, MTM_FVTPL_POCI]
              example: ["MTM_FVOCI", "MTM_FX_OCI_RESERVE"]
            overrideComment:
              type: string
              nullable: true
              description: "Komentar override-approve atau override-reject. Min 30 char jika REJECTED."
            cronJobId:
              type: string
              nullable: true
              description: "Asynq job ID dari MTM cron run yang generate baris ini."
              example: "job_MTM_CRON_01HXYZ"
            createdBy:
              type: string
              format: uuid
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              type: string
              format: uuid
            rowVersion:
              type: integer
              example: 1

    # ---- MTM Status enum ---------------------------------------------------
    MtmStatus:
      type: string
      enum:
        - AUTO_POSTED
        - PENDING_REVIEW
        - APPROVED
        - REJECTED
        - STALE_PRICE
      description: |
        Status baris trx.mtm.
        AUTO_POSTED: cron auto-post, jurnal sudah diposting.
        PENDING_REVIEW: deviation > threshold OR manual upload OR stale override request.
        APPROVED: override-approve berhasil, jurnal diposting.
        REJECTED: override-reject, jurnal tidak diposting (terminal).
        STALE_PRICE: harga_age_days > MTM_PRICE_STALE_DAYS, belum diposting (not terminal).

    # ---- Upload batch response (POST /trx/mtm/upload/batch) ---------------
    MtmUploadBatchResponse:
      type: object
      required:
        - uploadBatchId
        - rowsParsed
        - rowsValid
        - rowsInvalid
        - status
        - nextStep
      properties:
        uploadBatchId:
          type: string
          format: uuid
        rowsParsed:
          type: integer
        rowsValid:
          type: integer
        rowsInvalid:
          type: integer
        status:
          type: string
          enum: [PENDING_REVIEW]
          description: "Semua baris valid masuk PENDING_REVIEW."
        mtmIds:
          type: array
          items:
            type: string
            format: uuid
          description: "UUID trx.mtm baris yang berhasil diinsert."
        rowsCreated:
          type: array
          items:
            type: object
            properties:
              instrumenKode:
                type: string
              tanggalMtm:
                type: string
                format: date
              hargaPasarFcy:
                type: number
                nullable: true
              hargaPasarIdr:
                type: number
              hargaSumber:
                type: string
              deviationFlag:
                type: boolean
              deltaPct:
                type: number
              stalePriceFlag:
                type: boolean
        stalePriceWarnings:
          type: array
          items:
            type: object
            properties:
              instrumenKode:
                type: string
              hargaAgeDays:
                type: integer
              reason:
                type: string
        deviationWarnings:
          type: array
          items:
            type: object
            properties:
              instrumenKode:
                type: string
              deltaPct:
                type: number
              thresholdPct:
                type: number
              message:
                type: string
        nextStep:
          type: string
          example: "Menunggu approval ROLE-AKUN-CTL. Notifikasi telah dikirim ke Finance Controller."

    # ---- Upload batch detail (GET /trx/mtm/upload/batch/{id}) -------------
    MtmUploadBatchDetail:
      type: object
      required:
        - uploadBatchId
        - uploaderId
        - rowsParsed
        - rowsValid
        - rowsInvalid
        - status
        - createdAt
        - rows
      properties:
        uploadBatchId:
          type: string
          format: uuid
        uploaderId:
          type: string
          format: uuid
        uploaderName:
          type: string
          nullable: true
        catatanUpload:
          type: string
          nullable: true
        rowsParsed:
          type: integer
        rowsValid:
          type: integer
        rowsInvalid:
          type: integer
        status:
          type: string
          enum: [PENDING_REVIEW, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            required: [lineNumber, instrumenKode, tanggalMtm, rowStatus]
            properties:
              lineNumber:
                type: integer
              mtmId:
                type: string
                format: uuid
                nullable: true
              instrumenKode:
                type: string
              instrumenId:
                type: string
                format: uuid
                nullable: true
              tanggalMtm:
                type: string
                format: date
              hargaPasarFcy:
                type: number
                nullable: true
              hargaPasarIdr:
                type: number
                nullable: true
              deltaPct:
                type: number
                nullable: true
              deviationFlag:
                type: boolean
              stalePriceFlag:
                type: boolean
              rowStatus:
                type: string
                description: "Status baris: PENDING_REVIEW, APPROVED, REJECTED, atau VALIDATION_FAILED."
              rowErrorMsg:
                type: string
                nullable: true

    # ---- Override approve body --------------------------------------------
    MtmOverrideApproveBody:
      type: object
      required: [comment, signatureMethod]
      properties:
        comment:
          type: string
          minLength: 10
          maxLength: 2000
          description: "Komentar wajib. Min 30 char jika baris memiliki deviation_flag=TRUE."
          example: "Harga terverifikasi via Bloomberg terminal. Delta 7.3% wajar karena rilis FOMC. Disetujui."
        signatureMethod:
          type: string
          enum: [JWT_STEP_UP, JWT_STANDARD]
          default: JWT_STEP_UP

    # ---- Override approve response ----------------------------------------
    MtmOverrideApproveResponse:
      type: object
      required: [mtmId, instrumenKode, status, approvedBy, approvedAt]
      properties:
        mtmId:
          type: string
          format: uuid
        instrumenKode:
          type: string
        status:
          type: string
          enum: [APPROVED]
        jurnalEntryId:
          type: string
          format: uuid
          nullable: true
        jurnalEventCodes:
          type: array
          items:
            type: string
            enum: [MTM_FVOCI, MTM_FVTPL, MTM_FVOCI_ELECTION, MTM_FX_OCI_RESERVE, MTM_FVTPL_POCI]
          nullable: true
        approvedBy:
          type: string
          format: uuid
        approvedAt:
          type: string
          format: date-time
        message:
          type: string
          example: "Override MTM OBL-0042 2026-06-18 disetujui. Jurnal MTM_FVOCI berhasil diposting."

    # ---- Override reject body --------------------------------------------
    MtmOverrideRejectBody:
      type: object
      required: [comment, signatureMethod]
      properties:
        comment:
          type: string
          minLength: 30
          maxLength: 2000
          description: "Komentar wajib MINIMAL 30 karakter untuk reject (DEC-017)."
          example: "Harga 90.00 tidak sesuai IBPA hari ini (seharusnya 98.50). Harap re-upload dengan referensi sumber yang benar."
        signatureMethod:
          type: string
          enum: [JWT_STEP_UP, JWT_STANDARD]
          default: JWT_STEP_UP

    # ---- Override reject response ----------------------------------------
    MtmOverrideRejectResponse:
      type: object
      required: [mtmId, instrumenKode, status, rejectedBy, rejectedAt, comment]
      properties:
        mtmId:
          type: string
          format: uuid
        instrumenKode:
          type: string
        status:
          type: string
          enum: [REJECTED]
        rejectedBy:
          type: string
          format: uuid
        rejectedAt:
          type: string
          format: date-time
        comment:
          type: string
        message:
          type: string
          example: "MTM OBL-0042 2026-06-18 ditolak. ROLE-AKUN telah dinotifikasi untuk re-upload."

    # ---- MTM Cron trigger job response -----------------------------------
    MtmCronJobResponse:
      type: object
      required: [jobId, type, statusUrl, streamUrl]
      properties:
        jobId:
          type: string
          example: "job_MTM_CRON_01HXYZ"
        type:
          type: string
          enum: [MTM_DAILY_RUN]
        tanggalTarget:
          type: string
          format: date
          example: "2026-06-18"
        statusUrl:
          type: string
          example: "/api/v1/jobs/job_MTM_CRON_01HXYZ"
        streamUrl:
          type: string
          example: "/api/v1/jobs/job_MTM_CRON_01HXYZ/stream"
        estimatedInstrumen:
          type: integer
          nullable: true
          description: "Estimasi jumlah instrumen yang akan diproses."
          example: 1000
        message:
          type: string
          example: "MTM cron dijadwalkan untuk 2026-06-18. Monitor progres via JobProgressPanel."

    # ---- Stale price alert item ------------------------------------------
    MtmStalePriceAlert:
      type: object
      required:
        - id
        - instrumenId
        - instrumenKode
        - tanggalMtm
        - hargaTanggal
        - hargaAgeDays
        - status
        - stalePriceReason
        - eskalasiFlag
      properties:
        id:
          type: string
          format: uuid
        instrumenId:
          type: string
          format: uuid
        instrumenKode:
          type: string
        klasifikasiSnapshot:
          type: string
          enum: [FVOCI_DEBT, FVTPL, FVOCI_ELECTION, POCI]
          nullable: true
        tanggalMtm:
          type: string
          format: date
        hargaTanggal:
          type: string
          format: date
        hargaAgeDays:
          type: integer
        status:
          $ref: "#/components/schemas/MtmStatus"
        stalePriceReason:
          type: string
          enum:
            - HARGA_TIDAK_TERSEDIA
            - KURS_FCY_TIDAK_TERSEDIA
          description: |
            Alasan stale price:
            HARGA_TIDAK_TERSEDIA — feed pricing tidak tersedia untuk instrumen ini.
            KURS_FCY_TIDAK_TERSEDIA — feed pricing ada tapi kurs FCY belum APPROVED.
        eskalasiFlag:
          type: boolean
          description: "TRUE jika harga_age_days melebihi eskalasi threshold (default 7). Notif dikirim ke ROLE-RISK."
        eskalasiNote:
          type: string
          nullable: true
          example: "Harga belum update 6 hari. Eskalasi ke ROLE-RISK per threshold 5 hari."
        lockedFlag:
          type: boolean

    # ---- Async export job response ----------------------------------------
    MtmAsyncExportJobResponse:
      type: object
      required: [jobId, type, statusUrl, streamUrl]
      properties:
        jobId:
          type: string
          example: "job_MTM_EXPORT_01HXYZ"
        type:
          type: string
          enum: [MTM_EXPORT]
        statusUrl:
          type: string
          example: "/api/v1/jobs/job_MTM_EXPORT_01HXYZ"
        streamUrl:
          type: string
          example: "/api/v1/jobs/job_MTM_EXPORT_01HXYZ/stream"
        message:
          type: string
          example: "Export dataset besar dijadwalkan. File tersedia via download link setelah selesai."
