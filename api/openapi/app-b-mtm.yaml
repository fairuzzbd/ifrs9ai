        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./_common.yaml#/components/responses/NotFound"
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # S2 — MANUAL UPLOAD MTM (ROLE-AKUN, Maker)
  # ===========================================================================

  /trx/mtm/upload/batch:
    post:
      operationId: mtmUploadBatch
      summary: Upload harga MTM manual via XLSX/CSV — ROLE-AKUN Maker; returns batch_id + parse summary
      description: |
        AC: S2-AC1, S2-AC2, S2-AC3, S2-AC4

        ROLE-AKUN mengupload file XLSX atau CSV sesuai template baku.
        Sistem memparse, memvalidasi, lalu batch-INSERT ke trx.mtm dengan status='PENDING_REVIEW'.
        ROLE-AKUN-CTL dinotifikasi untuk review.

        Template kolom wajib:
          kode_instrumen (VARCHAR 20 REQUIRED) — harus ACTIVE, klasifikasi non-AC, deleted_at IS NULL
          tanggal_mtm    (DATE REQUIRED)        — YYYY-MM-DD, dalam periode OPEN
          harga_pasar    (NUMERIC REQUIRED)     — > 0, presisi 8 desimal, dalam mata uang instrumen
          harga_sumber   (VARCHAR 30 OPTIONAL)  — default 'MANUAL'; bisa 'IBPA_MANUAL', 'BEI_MANUAL'
          catatan        (TEXT OPTIONAL)        — wajib jika override existing row atau deviation > threshold

        Validasi per row:
          1. kode_instrumen ada di mst.instrumen ACTIVE — NOT_FOUND / VALIDATION_FAILED
          2. klasifikasi_psak71 NOT IN ('AC') — MTM_INSTRUMEN_AC_SKIP (422)
          3. harga_pasar > 0 — VALIDATION_FAILED
          4. tanggal_mtm dalam periode mst.periode_buku OPEN — MTM_PERIODE_LOCKED (423)
          5. instrumen tidak duplicate (instrumen_id, tanggal_mtm, harga_sumber) dengan
             status AUTO_POSTED atau APPROVED (non-REJECTED) — CONFLICT (409)
          6. Jika instrumen FCY: mst.kurs APPROVED tanggal_mtm tersedia — MTM_PRICE_STALE (422) jika tidak ada

        Jika SEMUA row valid: 202 Accepted + batch INSERT (satu transaksi) + audit per row.
        Jika ADA row tidak valid: 422 VALIDATION_FAILED + detail per baris. Tidak ada INSERT.

        File asli disimpan ke MinIO (doc.upload linkage via upload_batch_id).
        Notifikasi ke ROLE-AKUN-CTL: "Ada N MTM manual PENDING_REVIEW dari {maker}."

        Permission: mtm.create
        Roles: ROLE-AKUN
        MFA: tidak wajib
        Idempotency-Key: WAJIB (UUID v4) — DEC-021
        Rate limit: 20 req/min per user
      tags: [mtm-upload]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID v4 unik per request. DEC-021."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    File XLSX atau CSV sesuai template baku.
                    Max size: 10 MB. Max rows: 500 per batch.
                    MIME: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                          atau text/csv.
                catatanUpload:
                  type: string
                  maxLength: 1000
                  description: |
                    Catatan upload untuk keseluruhan batch.
                    Mis. "Upload harga manual OBL-0088 dari Bloomberg 2026-06-18".
                  example: "Upload harga manual OBL-0088 dari Bloomberg 2026-06-18"
                tanggalMtmOverride:
                  type: string
                  format: date
                  description: |
                    Opsional. Override tanggal_mtm untuk semua row di file
                    (berguna jika file tidak mengandung kolom tanggal).
                  example: "2026-06-18"
      responses:
        "202":
          description: Upload berhasil — semua row valid, batch INSERT sukses, status PENDING_REVIEW
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/MtmUploadBatchResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              examples:
                upload_success:
                  summary: S2-AC1 — Upload 1 instrumen OBL-0088 berhasil, PENDING_REVIEW
                  value:
                    data:
                      uploadBatchId: "18c9d0e1-f2a3-4567-1234-678901234567"
                      rowsParsed: 1
                      rowsValid: 1
                      rowsInvalid: 0
                      status: "PENDING_REVIEW"
                      mtmIds:
                        - "29d0e1f2-a3b4-5678-2345-789012345678"
                      rowsCreated:
                        - instrumenKode: "OBL-0088"
                          tanggalMtm: "2026-06-18"
                          hargaPasarFcy: 97.50000000
                          hargaPasarIdr: 1584375.0000
                          hargaSumber: "IBPA_MANUAL"
                          deviationFlag: false
                          deltaPct: -1.5152
                          stalePriceFlag: false
                      stalePriceWarnings: []
                      deviationWarnings: []
                      nextStep: "Menunggu approval ROLE-AKUN-CTL. Notifikasi telah dikirim ke Finance Controller."
                    meta:
                      traceId: "01HXY..."
                upload_with_deviation:
                  summary: S2-AC1 (partial) — Upload dengan deviasi > threshold, still PENDING_REVIEW
                  value:
                    data:
                      uploadBatchId: "3a1b2c3d-e4f5-6789-3456-890123456789"
                      rowsParsed: 1
                      rowsValid: 1
                      rowsInvalid: 0
                      status: "PENDING_REVIEW"
                      mtmIds:
                        - "4b2c3d4e-f5a6-7890-4567-901234567890"
                      rowsCreated:
                        - instrumenKode: "OBL-0088"
                          tanggalMtm: "2026-06-18"
                          hargaPasarFcy: 90.00000000
                          hargaPasarIdr: 1462500.0000
                          hargaSumber: "IBPA_MANUAL"
                          deviationFlag: true
                          deltaPct: -7.3000
                          stalePriceFlag: false
                      stalePriceWarnings: []
                      deviationWarnings:
                        - instrumenKode: "OBL-0088"
                          deltaPct: -7.30
                          thresholdPct: 5.0
                          message: "Deviasi 7.30% melebihi threshold 5%. Finance Controller wajib verifikasi sebelum jurnal diposting."
                      nextStep: "Menunggu approval ROLE-AKUN-CTL. Badge DEVIATION WARNING akan tampil di antrian review."
                    meta:
                      traceId: "01HXY..."
        "400":
          description: Field request tidak valid (file missing, format tidak valid)
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: "File wajib dilampirkan. Format yang didukung: xlsx, csv."
                  details:
                    - field: "file"
                      rule: "required"
                      message: "File upload wajib ada"
                  traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "409":
          description: Duplikat — (instrumen_id, tanggal_mtm, harga_sumber) sudah AUTO_POSTED atau APPROVED
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: CONFLICT
                  message: "MTM OBL-0088 untuk 2026-06-18 sumber IBPA_MANUAL sudah ada dengan status AUTO_POSTED. Tidak bisa di-override via upload baru."
                  details:
                    - field: "body.rows[0].kodeInstrumen"
                      rule: "unique_mtm_per_instrumen_tanggal_sumber"
                      message: "OBL-0088 2026-06-18 IBPA_MANUAL sudah AUTO_POSTED."
                  traceId: "01HXY..."
        "422":
          description: Validasi per-row gagal — tidak ada INSERT
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              examples:
                ac_instrumen:
                  summary: S2-AC2 — Instrumen AC diupload
                  value:
                    error:
                      code: MTM_INSTRUMEN_AC_SKIP
                      message: "1 baris tidak valid: instrumen AC tidak dapat di-MTM per PSAK 71 §4.1.2."
                      details:
                        - row: 1
                          field: "kodeInstrumen"
                          rule: "klasifikasi_not_ac"
                          message: "DEP-0001 berklasifikasi AC — tidak ada MTM untuk AC per PSAK 71. Hapus baris ini dari file upload."
                      traceId: "01HXY..."
                stale_price_kurs:
                  summary: S3-AC3 — Kurs FCY tidak tersedia
                  value:
                    error:
                      code: MTM_PRICE_STALE
                      message: "Kurs USD untuk 2026-06-18 tidak tersedia (APPROVED). MTM OBL-0088 tidak dapat dihitung."
                      details:
                        - row: 1
                          field: "hargaPasar"
                          rule: "kurs_available_for_fcy"
                          message: "Instrumen OBL-0088 berdenominasi USD tapi kurs USD 2026-06-18 belum APPROVED. Upload kurs manual via P5-M5 terlebih dahulu."
                      traceId: "01HXY..."
        "423":
          description: Periode CLOSED — upload MTM untuk tanggal dalam periode hard-closed ditolak
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: MTM_PERIODE_LOCKED
                  message: "Periode PRD-2026-05 sudah hard-closed. Tidak bisa menambah MTM untuk 2026-05-15."
                  details:
                    - field: "body.rows[0].tanggalMtm"
                      rule: "periode_must_be_open"
                      message: "2026-05-15 berada dalam PRD-2026-05 (CLOSED). Upload MTM hanya untuk periode OPEN."
                  traceId: "01HXY..."
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # GET /trx/mtm/upload/batch/{batch_id} — Batch detail dengan row breakdown
  # ===========================================================================

  /trx/mtm/upload/batch/{batch_id}:
    get:
      operationId: mtmGetUploadBatch
      summary: Batch upload MTM detail dengan row breakdown
      description: |
        AC: S2-AC1 (verify batch created)

        Mengembalikan detail batch upload beserta breakdown per row:
          - status setiap row (mtm_id, instrumen_kode, status, deviation_flag, stale_price_flag)
          - error per row jika validasi parsial gagal
          - upload metadata (uploader, catatan_upload, file info)

        Permission: mtm.read
        Roles: ROLE-AKUN (own batches only), ROLE-AKUN-CTL, ROLE-AUDIT, ROLE-IT-ADMIN
        Rate limit: 60 req/min per user
      tags: [mtm-upload]
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID dari sys.upload_batch row (diperoleh dari POST /trx/mtm/upload/batch)."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Batch detail dengan row breakdown
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/MtmUploadBatchDetail"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  uploadBatchId: "18c9d0e1-f2a3-4567-1234-678901234567"
                  uploaderId: "f6a7b8c9-d0e1-2345-f012-456789012345"
                  uploaderName: "Siti Akuntansi"
                  catatanUpload: "Upload harga manual OBL-0088 dari Bloomberg 2026-06-18"
                  rowsParsed: 1
                  rowsValid: 1
                  rowsInvalid: 0
                  status: "PENDING_REVIEW"
                  createdAt: "2026-06-18T09:15:00+07:00"
                  rows:
                    - lineNumber: 1
                      mtmId: "29d0e1f2-a3b4-5678-2345-789012345678"
                      instrumenKode: "OBL-0088"
                      instrumenId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                      tanggalMtm: "2026-06-18"
                      hargaPasarFcy: 97.50000000
                      hargaPasarIdr: 1584375.0000
                      deltaPct: -1.5152
                      deviationFlag: false
                      stalePriceFlag: false
                      rowStatus: "PENDING_REVIEW"
                      rowErrorMsg: null
                meta:
                  traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "404":
