                  details:
                    - field: "instrumenId"
                      rule: "tipe_instrumen_reksadana"
                      message: "tipe_instrumen bukan REKSADANA"
                  traceId: "01HXY..."
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # POST /ecl/lookthrough/compute — single Reksadana look-through compute
  # HTTP facade; production flow Go-to-Go via LookThroughService.Compute()
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/compute:
    post:
      operationId: computeLookthrough
      summary: Hitung look-through ECL untuk satu instrumen Reksadana
      description: |
        HTTP facade untuk LookThroughService.Compute() — single instrument, synchronous.
        Produksi dipanggil Go-to-Go oleh P4-M7 ECL engine; endpoint ini tersedia untuk
        verifikasi manual dan testing oleh ROLE-RISK.

        Untuk Reksadana FVTPL: tidak error — return ECL=0 dengan note "FVTPL_SKIP_ECL".
        Untuk Reksadana POCI: return 202-style warning LOOKTHROUGH_POCI_DEFERRED (ECL = null).
        Tidak menulis ke ecl.* (stateless compute); caller M7/M8 yang persists.

        Permission: lookthrough.compute (internal) atau lookthrough.preview (untuk ROLE-RISK manual call)
        Roles: internal engine, ROLE-RISK (verifikasi)

        Validasi:
        - instrumenId harus REKSADANA, AKTIF, APPROVED (mis. DEPOSITO → 422)
        - evaluationDate: DATE format YYYY-MM-DD
        - scenario: GOOD | NORMAL | BAD (default: semua 3 skenario sekaligus)
        - Fund composition APPROVED harus tersedia per evaluationDate
        - NAB_IDR: dari mst.instrumen.nominal_nab_idr (null → 422 LOOKTHROUGH_NAB_MISSING)
        - PD/LGD parameters di mst.pd_pefindo, mst.lgd_basel harus APPROVED
        - Bobot skenario dan FL multiplier harus APPROVED untuk periodeId

        Idempotency-Key wajib.
        Audit: tidak ada direct (compute stateless); preview call → LOOKTHROUGH.PREVIEW.
        SLA: ≤ 200ms P95.
      tags: [lookthrough-compute]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookthroughComputeRequest"
            example:
              instrumenId: "550e8400-e29b-41d4-a716-000000000001"
              evaluationDate: "2026-06-30"
              periodeId: "550e8400-e29b-41d4-a716-000000001000"
      responses:
        "200":
          description: |
            Compute berhasil — breakdown per asset class + total ECL.
            Jika FVTPL: totalEclIdr = 0, warnings berisi FVTPL_SKIP_ECL note.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/LookthroughComputeResult"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
              example:
                data:
                  instrumenId: "550e8400-e29b-41d4-a716-000000000001"
                  instrumenNama: "Reksa Dana Pendapatan Tetap XYZ"
                  evaluationDate: "2026-06-30"
                  nabIdr: 5000000000.0000
                  fundCompositionId: "550e8400-e29b-41d4-a716-000000000100"
                  fundCompositionVersion: "2026-04-01"
                  klasifikasiPsak71: "FVOCI"
                  totalEclIdr: 17962500.0000
                  breakdown:
                    - assetClass: "GOVT_BOND"
                      weightPct: 60.0000
                      nabPortionIdr: 3000000000.0000
                      pdGood: 0.00000000
                      pdNormal: 0.00000000
                      pdBad: 0.00000000
                      lgd: 0.45000000
                      eclSkenariosGoodIdr: 0.0000
                      eclSkenariosNormalIdr: 0.0000
                      eclSkenariosBadIdr: 0.0000
                      eclFlGoodIdr: 0.0000
                      eclFlNormalIdr: 0.0000
                      eclFlBadIdr: 0.0000
                      eclWeightedIdr: 0.0000
                    - assetClass: "CORP_BOND"
                      weightPct: 30.0000
                      nabPortionIdr: 1500000000.0000
                      pdGood: 0.02000000
                      pdNormal: 0.02500000
                      pdBad: 0.03750000
                      lgd: 0.45000000
                      eclSkenariosGoodIdr: 13500000.0000
                      eclSkenariosNormalIdr: 16875000.0000
                      eclSkenariosBadIdr: 25312500.0000
                      eclFlGoodIdr: 10800000.0000
                      eclFlNormalIdr: 16875000.0000
                      eclFlBadIdr: 37968750.0000
                      eclWeightedIdr: 20629687.5000
                    - assetClass: "CASH"
                      weightPct: 10.0000
                      nabPortionIdr: 500000000.0000
                      pdGood: 0.00800000
                      pdNormal: 0.01000000
                      pdBad: 0.01500000
