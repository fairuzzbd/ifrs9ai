  # ---------------------------------------------------------------------------
  # GET /ecl/lookthrough/fund-composition/instrumen/{instrumenId}
  # Get active composition for an instrument as of a date
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/fund-composition/instrumen/{instrumenId}:
    get:
      operationId: getActiveFundComposition
      summary: Ambil fund composition APPROVED aktif untuk satu instrumen per tanggal tertentu
      description: |
        Mengembalikan composition group APPROVED yang berlaku pada as_of_date:
          effective_from ≤ as_of_date AND (effective_to IS NULL OR effective_to >= as_of_date)

        Digunakan oleh:
        - UI untuk show "komposisi aktif saat ini" pada instrumen detail page
        - Compute preview sebelum menentukan komposisi mana yang akan dipakai
        - Internal caller (Go-to-Go) sebelum compute ECL

        Permission: fund_composition.read
        Roles: ROLE-AKUN, ROLE-RISK, ROLE-ALCO, ROLE-AKUN-CTL, ROLE-CFO, ROLE-AUDIT,
               internal engine (tidak butuh HTTP call untuk internal usage)

        as_of_date default: today (tanggal server saat request).
        Jika tidak ada composition APPROVED yang berlaku → 404 NOT_FOUND.
        Jika instrumen bukan REKSADANA → 422 LOOKTHROUGH_INSTRUMEN_NOT_REKSADANA.
        Audit: tidak ada (pure read).
      tags: [fund-composition]
      security:
        - bearerAuth: []
      parameters:
        - name: instrumenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID instrumen Reksadana dari mst.instrumen
        - name: as_of_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: "Tanggal evaluasi. Format: YYYY-MM-DD. Default: today."
          example: "2026-06-30"
      responses:
