                              instrumen_id, total_weight_pct
        Default sort: created_at DESC

        Allowed filter:
        - filter[instrumen_id]: UUID instrumen Reksadana
        - filter[workflow_status]: DRAFT | PENDING_REVIEW | PENDING_APPROVAL | APPROVED | REJECTED | SUPERSEDED
        - filter[effective_from]: gte:YYYY-MM-DD, lte:YYYY-MM-DD, between:date1,date2
        - filter[effective_to]: gte/lte/between atau is_null (untuk composition aktif)
        - filter[maker_id]: UUID
        - include_superseded: boolean — default false. Jika false, SUPERSEDED di-exclude.
          ROLE-AUDIT mendapat semua status. Lainnya default exclude SUPERSEDED kecuali set true.
        - q: text search di instrumen_nama

        Export: CSV, XLSX (inline < 10k rows, async >= 10k).
        Audit: tidak ada untuk plain list. LOOKTHROUGH.EXPORT jika export.
      tags: [fund-composition]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/searchParam"
        - name: "filter[instrumen_id]"
