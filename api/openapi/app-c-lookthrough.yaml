        "404":
          description: Tidak ada composition APPROVED yang berlaku pada as_of_date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: LOOKTHROUGH_FUND_COMPOSITION_MISSING
                  message: "Tidak ditemukan fund composition APPROVED untuk instrumen RKD-001 per tanggal 2026-06-30. Input komposisi via menu Fund Composition."
                  details:
                    - field: "instrumenId"
