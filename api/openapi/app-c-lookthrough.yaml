openapi: "3.0.3"
info:
  title: BLIPS IFRS9 — APP-C Look-through ECL Reksadana (P4-M4)
  version: "1.0.0"
  description: |
    Look-through ECL untuk Reksadana — dekomposisi underlying per asset class.
    Fund composition dikelola melalui workflow 6-eyes (DEC-017).
    ECL dihitung per asset class menggunakan formula 3-skenario × dual FL (DEC-010, DEC-015).

    Story set: APP-C-LKT-001..005
    FSD: FSD-APP-C-ECL-EIR-v1.0.docx §3 (Look-through ECL), §4 (EAD)
    Decisions: DEC-010, DEC-015, DEC-016, DEC-017, DEC-018, DEC-021, DEC-022

    ## Scope Rules
    - tipe_instrumen = 'REKSADANA' only
    - klasifikasi_psak71 IN ('AC','FVOCI') — FVTPL di-skip (ECL = 0, bukan error)
    - POCI Reksadana di-defer ke M7 (error LOOKTHROUGH_POCI_DEFERRED, tidak memblok run)
    - status = 'AKTIF', deleted_at IS NULL, workflow_status = 'APPROVED'

    ## Asset Class Enum
    - GOVT_BOND — Obligasi Pemerintah (SBN, SPN, ORI, sukuk negara). PD = 0 (sovereign IDR).
    - CORP_BOND — Obligasi Korporasi. PD dari mst.pd_pefindo (rating underlying average/conservative).
    - CASH     — Kas, deposito, pasar uang. PD dari bank counterparty.
    - EQUITY   — Saham. PD dari sektor average.
    - OTHER    — Aset tidak terkategori; PD/LGD conservative default. Wajib di-flag untuk manual review.

    ## Weight Constraint
    Σ weight_pct per composition group HARUS = 100% ± 0.01% (toleransi presisi floating-point input UI).
    Enforced di application layer (tidak bisa di-constraint CHECK multi-row di DB).

    ## Permission model
    - fund_composition.create  — ROLE-AKUN (submit + amend)
    - fund_composition.review  — ROLE-RISK (sign review)
    - fund_composition.approve — ROLE-ALCO (sign approve — MFA wajib DEC-026)
    - fund_composition.read    — ROLE-AKUN, ROLE-RISK, ROLE-ALCO, ROLE-AKUN-CTL, ROLE-CFO, ROLE-AUDIT
    - lookthrough.preview      — ROLE-RISK, ROLE-AKUN-CTL, ROLE-CFO, ROLE-AUDIT (read-only preview)
    - lookthrough.compute      — internal Asynq worker only (tidak di-expose via HTTP ke user)

    ## Workflow — 6-eyes
    ROLE-AKUN (maker) → ROLE-RISK (reviewer) → ROLE-ALCO (approver)
    SoD: maker_id ≠ reviewer_id ≠ approver_id (enforced server-side, DEC-017)
    MFA wajib: ROLE-ALCO (DEC-026)
    Step-up MFA: TIDAK diperlukan (fund_composition.approve tidak listed di DEC-027 step-up list).
    Signature hash: SHA-256(userId || action || compositionGroupId || signedAt || comment)

    ## Versioning
    Amendment pakai pola effective_from/effective_to (immutable, audit-grade).
    Versi lama di-SUPERSEDED (bukan dihapus). Tidak ada UPDATE/DELETE rows di mst.fund_composition.

    ## Audit policy
    - fund_composition.submit / review / approve / reject    — AUDITED in-transaction
    - fund_composition.amend_submit / amend_review / amend_approve — AUDITED in-transaction
    - lookthrough.preview     — LOOKTHROUGH.PREVIEW per call
    - lookthrough.export      — LOOKTHROUGH.EXPORT per call (filter + row_count di after_jsonb)
    - compute / bulk_compute  — tidak langsung; P4-M7/M8 write saat calc run sealed

    ## Performance SLA
    - Single compute  : ≤ 200ms P95
    - Bulk compute    : ≤ 2 detik P95 untuk 500 Reksadana aktif
    - Preview         : ≤ 500ms P95

    ## Schema dependency
    - mst.fund_composition (TABEL BARU — migration 000024, data-modeler)
    - ecl.lookthrough_underlying (ALTER precision fix + ADD COLUMN — migration 000024)
    - mst.instrumen, mst.pd_pefindo, mst.lgd_basel, mst.bobot_skenario, mst.impact_mev_pd (existing)

    ## Open question flags (pending ifrs9-compliance-reviewer — BLOCKING)
    - OQ-M4-3: FVTPL Reksadana skip confirmed? → Asumsi: ya, ECL=0
    - OQ-M4-4: PD/LGD per asset class mapping konfirmasi dari FSD-APP-C

servers:
  - url: /api/v1
    description: BLIPS REST API v1

tags:
  - name: fund-composition
    description: |
      Manajemen Fund Composition per Reksadana — 6-eyes workflow.
      POST submit / review / approve / reject + GET list + GET detail + GET active.
  - name: lookthrough-compute
    description: |
      Look-through ECL compute — single dan bulk (Asynq job 202).
      HTTP facade untuk testing/verifikasi; production flow dipanggil Go-to-Go oleh P4-M7.
  - name: lookthrough-preview
    description: |
      Preview breakdown ECL per Reksadana — on-the-fly tanpa menulis ke ecl.*.
      DataTable pattern (sort + page + filter + export). Read-only.

paths:

  # ---------------------------------------------------------------------------
  # POST /ecl/lookthrough/fund-composition/submit
  # Submit komposisi baru atau amend (Story APP-C-LKT-001, LKT-005)
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/fund-composition/submit:
    post:
      operationId: submitFundComposition
      summary: Submit fund composition baru atau amend versi lama untuk satu instrumen Reksadana
      description: |
        Membuat satu composition group (kumpulan lines per asset class) untuk satu instrumen Reksadana,
        dan meng-enqueue ke workflow 6-eyes: PENDING_REVIEW.

        Digunakan untuk:
        1. Komposisi baru (is_amendment = false): instrumen belum punya composition APPROVED,
           atau composition sebelumnya sudah SUPERSEDED/REJECTED.
        2. Amend (is_amendment = true): menggantikan versi APPROVED yang masih aktif.
           Wajib sertakan supersedes_composition_id.

        Permission: fund_composition.create
        Role: ROLE-AKUN

        Validasi:
        - instrumenId harus exist di mst.instrumen dengan tipe_instrumen='REKSADANA',
          status='AKTIF', deleted_at IS NULL, workflow_status='APPROVED'
        - lines wajib berisi 1..N item dengan asset_class IN (GOVT_BOND, CORP_BOND, CASH, EQUITY, OTHER)
        - Σ weight_pct semua lines = 100% ± 0.01% (toleransi 0.0001 dalam satuan desimal)
        - effective_from: DATE format YYYY-MM-DD, tidak boleh lebih dari 30 hari ke depan dari today
        - Tidak boleh ada composition APPROVED aktif dengan effective_to IS NULL untuk instrumen yang sama
          (jika ada → 409 CONFLICT, kecuali is_amendment=true dengan supersedes_composition_id yang valid)
        - is_amendment = true: supersedes_composition_id wajib diisi dan target harus APPROVED
        - is_amendment = true: effective_from baru harus SETELAH effective_from yang di-supersede
        - supersedes_composition_id jika diisi: target harus workflow_status=APPROVED (bukan PENDING_*)
        - source_doc_id jika diisi: harus exist di doc.upload
        - Setiap asset_class dalam satu group harus UNIK (tidak boleh duplikat dalam satu submit)

        SoD: maker_id = JWT sub. Reviewer dan approver harus user berbeda (enforced saat step berikutnya).

        Atomic: semua lines dibuat dalam satu transaksi DB.
        Idempotency-Key wajib.

        Audit: FUND_COMPOSITION.SUBMIT atau FUND_COMPOSITION.AMEND_SUBMIT di aud.audit_log in-transaction.
        Notifikasi: ke semua ROLE-RISK aktif — "Fund composition [instrumen] menunggu review".
      tags: [fund-composition]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundCompositionSubmitRequest"
            examples:
              newComposition:
                summary: Submit komposisi baru
                value:
                  instrumenId: "550e8400-e29b-41d4-a716-000000000001"
                  effectiveFrom: "2026-04-01"
                  sourceDocId: "550e8400-e29b-41d4-a716-000000000090"
                  catatan: "Fund fact sheet Q1 2026 per tanggal 31 Maret 2026"
                  isAmendment: false
                  lines:
                    - assetClass: "GOVT_BOND"
                      weightPct: 60.0000
                    - assetClass: "CORP_BOND"
                      weightPct: 30.0000
                    - assetClass: "CASH"
                      weightPct: 10.0000
              amendComposition:
                summary: Amend komposisi existing
                value:
                  instrumenId: "550e8400-e29b-41d4-a716-000000000001"
                  effectiveFrom: "2026-07-01"
                  sourceDocId: "550e8400-e29b-41d4-a716-000000000091"
                  catatan: "Update fund fact sheet Q2 2026"
                  isAmendment: true
                  supersedesCompositionId: "550e8400-e29b-41d4-a716-000000000100"
                  lines:
                    - assetClass: "GOVT_BOND"
                      weightPct: 55.0000
                    - assetClass: "CORP_BOND"
                      weightPct: 35.0000
                    - assetClass: "CASH"
                      weightPct: 10.0000
      responses:
        "201":
          description: Composition group berhasil dibuat, status PENDING_REVIEW
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/FundCompositionGroup"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
              example:
                data:
                  compositionId: "550e8400-e29b-41d4-a716-000000000100"
                  instrumenId: "550e8400-e29b-41d4-a716-000000000001"
                  instrumenNama: "Reksa Dana Pendapatan Tetap XYZ"
                  effectiveFrom: "2026-04-01"
                  effectiveTo: null
                  workflowStatus: "PENDING_REVIEW"
                  totalWeightPct: 100.0000
                  isAmendment: false
                  supersedesCompositionId: null
                  makerId: "550e8400-e29b-41d4-a716-000000000301"
                  makerNama: "Siti Rahayu"
                  reviewerId: null
                  approverId: null
                  signedAtReview: null
                  signedAtApprove: null
                  lines:
                    - assetClass: "GOVT_BOND"
                      weightPct: 60.0000
                    - assetClass: "CORP_BOND"
                      weightPct: 30.0000
                    - assetClass: "CASH"
                      weightPct: 10.0000
                  sourceDocId: "550e8400-e29b-41d4-a716-000000000090"
                  catatan: "Fund fact sheet Q1 2026"
                  createdAt: "2026-06-11T09:00:00+07:00"
                  updatedAt: "2026-06-11T09:00:00+07:00"
                  rowVersion: 1
                meta:
                  traceId: "01HXY..."
        "400":
          description: Validasi field gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                weightSumInvalid:
                  summary: Sum weight bukan 100%
                  value:
                    error:
                      code: LOOKTHROUGH_WEIGHT_INVALID
                      message: "Total weight_pct harus 100% ± 0.01%. Saat ini: 85.0000%"
                      details:
                        - field: "body.lines"
                          rule: "weight_sum_100pct"
                          message: "Total weight_pct = 85.0000%, expected 100% ± 0.01%"
                      traceId: "01HXY..."
                assetClassUnknown:
                  summary: Asset class tidak valid
                  value:
                    error:
                      code: LOOKTHROUGH_ASSET_CLASS_UNKNOWN
                      message: "Asset class CRYPTO tidak valid. Nilai yang diterima: GOVT_BOND, CORP_BOND, CASH, EQUITY, OTHER"
                      details:
                        - field: "body.lines[0].assetClass"
                          rule: "enum"
                          message: "Nilai CRYPTO tidak ada dalam enum asset class yang valid"
                      traceId: "01HXY..."
                instrumenNotReksadana:
                  summary: Instrumen bukan REKSADANA
                  value:
                    error:
                      code: LOOKTHROUGH_INSTRUMEN_NOT_REKSADANA
                      message: "Fund composition hanya berlaku untuk instrumen tipe REKSADANA. Instrumen DEPOSITO-001 bertipe DEPOSITO."
                      details:
                        - field: "body.instrumenId"
                          rule: "tipe_instrumen_reksadana"
                          message: "tipe_instrumen harus REKSADANA"
                      traceId: "01HXY..."
                amendmentMissingSupersedes:
                  summary: is_amendment=true tanpa supersedes_composition_id
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: "Saat isAmendment = true, supersedesCompositionId wajib diisi."
                      details:
                        - field: "body.supersedesCompositionId"
                          rule: "required_when_amendment"
                          message: "supersedesCompositionId wajib saat isAmendment = true"
                      traceId: "01HXY..."
                effectiveFromBeforeSuperseded:
                  summary: effectiveFrom amend sebelum superseded
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: "Tanggal effective_from versi baru (2026-03-01) harus setelah tanggal effective_from versi yang digantikan FC-001 (2026-04-01)."
                      details:
                        - field: "body.effectiveFrom"
                          rule: "must_be_after_superseded_effective_from"
                          message: "effectiveFrom baru harus > effectiveFrom yang di-supersede"
                      traceId: "01HXY..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: instrumenId atau sourceDocId tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: NOT_FOUND
                  message: "Instrumen tidak ditemukan atau sudah dihapus"
                  details:
                    - field: "body.instrumenId"
                      rule: "exists"
                      message: "instrumenId tidak ada di mst.instrumen"
                  traceId: "01HXY..."
        "409":
          description: |
            Composition aktif sudah ada untuk instrumen + periode overlapping,
            atau supersedes target masih PENDING_* (belum final)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                activeCompositionExists:
                  summary: Composition APPROVED aktif sudah ada
                  value:
                    error:
                      code: CONFLICT
                      message: "Instrumen RKD-001 sudah memiliki fund composition APPROVED yang aktif (ID: FC-001, effective_from 2026-04-01). Gunakan fitur Amend Composition untuk membuat versi baru."
                      details:
                        - field: "body.instrumenId"
                          rule: "no_active_composition_overlap"
                          message: "Composition aktif FC-001 masih berlaku"
                      traceId: "01HXY..."
                supersedesPending:
                  summary: Target supersede masih dalam proses persetujuan
                  value:
                    error:
                      code: CONFLICT
                      message: "Tidak dapat membuat amend untuk FC-001 yang masih dalam proses persetujuan (PENDING_REVIEW). Tunggu hingga FC-001 APPROVED atau REJECTED terlebih dahulu."
                      details:
                        - field: "body.supersedesCompositionId"
                          rule: "target_must_be_approved_or_rejected"
                          message: "Target composition FC-001 belum final"
                      traceId: "01HXY..."
        "422":
          $ref: "#/components/responses/WorkflowInvalidTransition"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # POST /ecl/lookthrough/fund-composition/{id}/review
  # ROLE-RISK sign review (Story LKT-001 Scenario 1)
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/fund-composition/{id}/review:
    post:
      operationId: reviewFundComposition
      summary: ROLE-RISK sign review fund composition (6-eyes step 2)
      description: |
        Reviewer (ROLE-RISK) memvalidasi komposisi yang disubmit Maker.
        Transisi: PENDING_REVIEW → PENDING_APPROVAL.

        Permission: fund_composition.review
        Role: ROLE-RISK

        SoD: reviewer_id ≠ maker_id — SOD_VIOLATION 403 jika sama.
        Signature: SHA-256(userId || REVIEW || compositionId || signedAt || comment) disimpan di
                   mst.fund_composition.signature_hash_review.

        Idempotency-Key wajib.
        Audit: FUND_COMPOSITION.REVIEW (atau FUND_COMPOSITION.AMEND_REVIEW) in-transaction.
        Notifikasi: ke ROLE-ALCO aktif — "Fund composition [instrumen] menunggu persetujuan".
      tags: [fund-composition]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/compositionIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionRequest"
            example:
              comment: "Sesuai fund fact sheet Maret 2026. Komposisi valid."
              signatureMethod: "JWT_STANDARD"
      responses:
        "200":
          description: Review berhasil — status PENDING_APPROVAL
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/FundCompositionGroup"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
              example:
                data:
                  compositionId: "550e8400-e29b-41d4-a716-000000000100"
                  workflowStatus: "PENDING_APPROVAL"
                  reviewerId: "550e8400-e29b-41d4-a716-000000000302"
                  signedAtReview: "2026-06-11T10:30:00+07:00"
                  rowVersion: 2
                meta:
                  traceId: "01HXY..."
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permission tidak terpenuhi, SoD violation, atau MFA belum verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                sodViolation:
                  summary: Reviewer = Maker
                  value:
                    error:
                      code: LOOKTHROUGH_COMPOSITION_SOD_VIOLATION
                      message: "Maker tidak dapat menjadi reviewer. maker_id = reviewer_id untuk composition FC-001."
                      details:
                        - field: "reviewer"
                          rule: "reviewer_not_maker"
                          message: "SoD: reviewer_id ≠ maker_id"
                      traceId: "01HXY..."
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Transisi tidak valid (mis. bukan PENDING_REVIEW)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: LOOKTHROUGH_COMPOSITION_REVIEW_INVALID_TRANSITION
                  message: "Tidak bisa review dari state PENDING_APPROVAL. Composition harus dalam status PENDING_REVIEW."
                  details:
                    - field: "workflowStatus"
                      rule: "invalid_transition"
                      message: "Transition PENDING_APPROVAL → PENDING_REVIEW tidak valid"
                  traceId: "01HXY..."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # POST /ecl/lookthrough/fund-composition/{id}/approve
  # ROLE-ALCO sign approve (Story LKT-001 Scenario 1)
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/fund-composition/{id}/approve:
    post:
      operationId: approveFundComposition
      summary: ROLE-ALCO approve fund composition (6-eyes step 3)
      description: |
        Approver (ROLE-ALCO) menyetujui komposisi yang sudah di-review ROLE-RISK.
        Transisi: PENDING_APPROVAL → APPROVED_ACTIVE.

        Untuk amendment: pada saat approve, dalam SATU transaksi atomik:
        1. Versi yang di-supersede (supersedesCompositionId): workflow_status → SUPERSEDED,
           effective_to di-set ke (new_effective_from - 1 hari).
        2. Versi baru: workflow_status → APPROVED, effective_from aktif.

        Permission: fund_composition.approve
        Role: ROLE-ALCO
        MFA: ROLE-ALCO wajib MFA (mfa_verified = true di JWT, DEC-026).
             Step-up MFA TIDAK diperlukan untuk approve fund_composition.

        SoD: approver_id ≠ maker_id ≠ reviewer_id — SOD_VIOLATION 403 jika overlap.
        Signature: SHA-256(userId || APPROVE || compositionId || signedAt || comment) disimpan di
                   mst.fund_composition.signature_hash_approve.

        Idempotency-Key wajib.
        Audit: FUND_COMPOSITION.APPROVE (atau FUND_COMPOSITION.AMEND_APPROVE) in-transaction.
               For amendment: after_jsonb = { supersedes: old_id, effective_from: date }.
        Notifikasi: ke maker — "Fund composition [instrumen] disetujui ALCO dan aktif".
      tags: [fund-composition]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/compositionIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionRequest"
            example:
              comment: "Disetujui. Komposisi sesuai prospektus fund."
              signatureMethod: "JWT_STANDARD"
      responses:
        "200":
          description: |
            Composition disetujui — status APPROVED.
            Jika amendment: versi lama otomatis SUPERSEDED dalam transaksi yang sama.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/FundCompositionGroup"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
              example:
                data:
                  compositionId: "550e8400-e29b-41d4-a716-000000000100"
                  workflowStatus: "APPROVED"
                  approverId: "550e8400-e29b-41d4-a716-000000000303"
                  signedAtApprove: "2026-06-11T14:00:00+07:00"
                  effectiveFrom: "2026-04-01"
                  effectiveTo: null
                  rowVersion: 3
                meta:
                  traceId: "01HXY..."
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permission tidak terpenuhi, SoD, atau MFA belum terverifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                sodViolation:
                  summary: SoD violation
                  value:
                    error:
                      code: LOOKTHROUGH_COMPOSITION_SOD_VIOLATION
                      message: "Approver tidak bisa sama dengan Maker atau Reviewer."
                      details:
                        - field: "approver"
                          rule: "approver_not_maker_or_reviewer"
                          message: "SoD: approver_id ≠ maker_id AND approver_id ≠ reviewer_id"
                      traceId: "01HXY..."
                mfaRequired:
                  summary: MFA belum verified
                  value:
                    error:
                      code: MFA_REQUIRED
                      message: "ROLE-ALCO wajib MFA. Pastikan mfa_verified=true di token."
                      details: []
                      traceId: "01HXY..."
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Transisi tidak valid (mis. belum di-review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: LOOKTHROUGH_COMPOSITION_REVIEW_INVALID_TRANSITION
                  message: "Tidak bisa approve dari state PENDING_REVIEW. Harus melalui review terlebih dahulu."
                  details:
                    - field: "workflowStatus"
                      rule: "invalid_transition"
                      message: "Transition PENDING_REVIEW → APPROVED tidak valid"
                  traceId: "01HXY..."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # POST /ecl/lookthrough/fund-composition/{id}/reject
  # ROLE-RISK atau ROLE-ALCO reject (Story LKT-001)
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/fund-composition/{id}/reject:
    post:
      operationId: rejectFundComposition
      summary: Reject fund composition (ROLE-RISK atau ROLE-ALCO)
      description: |
        Reviewer (ROLE-RISK dari PENDING_REVIEW) atau Approver (ROLE-ALCO dari PENDING_APPROVAL)
        menolak composition.
        Transisi: PENDING_REVIEW → REJECTED | PENDING_APPROVAL → REJECTED.

        Setelah REJECTED: komposisi dapat di-submit ulang oleh Maker sebagai entri BARU
        (bukan re-use ID lama). ID lama tetap ada di history dengan status REJECTED.

        Permission: fund_composition.review (dari PENDING_REVIEW) atau fund_composition.approve (dari PENDING_APPROVAL)
        Roles: ROLE-RISK, ROLE-ALCO

        Idempotency-Key wajib.
        Audit: FUND_COMPOSITION.REJECT in-transaction.
