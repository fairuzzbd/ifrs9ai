                      eclSkenariosNormalIdr: 2250000.0000
                      eclSkenariosBadIdr: 3375000.0000
                      eclFlGoodIdr: 1440000.0000
                      eclFlNormalIdr: 2250000.0000
                      eclFlBadIdr: 5062500.0000
