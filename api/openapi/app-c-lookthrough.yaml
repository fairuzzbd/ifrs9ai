  # ---------------------------------------------------------------------------
  # POST /ecl/lookthrough/compute/bulk — bulk Reksadana (Asynq job 202)
  # Story APP-C-LKT-004
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/compute/bulk:
    post:
      operationId: computeLookthroughBulk
      summary: Bulk look-through ECL untuk semua Reksadana aktif dalam periodeId (Asynq job)
      description: |
        Trigger Asynq job yang menjalankan LookThroughService.BulkCompute() untuk semua
        instrumen REKSADANA aktif dalam periodeId.

        Dipanggil oleh P4-M7 ECL engine sebelum loop per-instrumen.
        Juga dapat dipanggil manual oleh ROLE-RISK untuk verifikasi.

        Performance SLA: ≤ 2 detik P95 untuk 500 instrumen Reksadana.
        Implementasi menggunakan batch JOIN (BUKAN N+1 per instrumen):
        mst.instrumen JOIN mst.fund_composition JOIN mst.pd_pefindo JOIN mst.lgd_basel
        JOIN mst.bobot_skenario JOIN mst.impact_mev_pd WHERE semua aktif per periodeId.

        Jika ada instrumen REKSADANA tanpa composition APPROVED → fail-fast:
        LOOKTHROUGH_FUND_COMPOSITION_MISSING 422 dengan daftar instrumen terdampak.

        Jika jumlah instrumen = 0 → return empty result (bukan error).

        Permission: lookthrough.compute (internal) atau lookthrough.preview (ROLE-RISK manual call)
        Roles: internal engine, ROLE-RISK

        Idempotency-Key wajib.
        Audit: tidak ada direct (stateless compute). P4-M8 write saat calc run diseal.
        Metrik Prometheus: ecl_lookthrough_bulk_duration_seconds, ecl_lookthrough_bulk_instrument_count,
                           ecl_lookthrough_bulk_errors_total.
        Max instrumen: 10.000 Reksadana aktif per run. Lebih → 413 LOOKTHROUGH_BULK_TOO_LARGE.
      tags: [lookthrough-compute]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookthroughBulkComputeRequest"
            example:
              periodeId: "550e8400-e29b-41d4-a716-000000001000"
              evaluationDate: "2026-06-30"
      responses:
        "202":
          description: |
            Job diterima. Client subscribe SSE di streamUrl untuk progress.
            Hasil tersedia via GET /api/v1/jobs/{jobId} saat status = completed.
            Job type: LOOKTHROUGH_BULK_COMPUTE.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/JobAcceptedResponse"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
              example:
                data:
                  jobId: "01JXYZ-LKT-BULK-001"
                  type: "LOOKTHROUGH_BULK_COMPUTE"
                  statusUrl: "/api/v1/jobs/01JXYZ-LKT-BULK-001"
                  streamUrl: "/api/v1/jobs/01JXYZ-LKT-BULK-001/stream"
                  estimatedDurationSeconds: 2
                meta:
                  traceId: "01HXY..."
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: periodeId tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: NOT_FOUND
                  message: "Periode buku tidak ditemukan"
                  details:
                    - field: "body.periodeId"
                      rule: "exists"
                      message: "periodeId tidak ada di mst.periode_buku"
                  traceId: "01HXY..."
        "413":
          description: Jumlah instrumen Reksadana melebihi batas sistem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: LOOKTHROUGH_BULK_TOO_LARGE
                  message: "Jumlah instrumen REKSADANA aktif dalam scope (12.500) melebihi batas 10.000. Hubungi IT Admin untuk mempartisi."
                  details: []
                  traceId: "01HXY..."
        "422":
          description: Fund composition missing untuk satu atau lebih instrumen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: LOOKTHROUGH_FUND_COMPOSITION_MISSING
                  message: "2 instrumen tidak memiliki fund composition APPROVED per 2026-06-30."
                  details:
                    - field: "instrumen.missing_composition"
                      rule: "all_reksadana_must_have_composition"
                      message: "RKD-MISSING-1, RKD-MISSING-2"
                  traceId: "01HXY..."
        "423":
          $ref: "#/components/responses/PeriodeClosed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # GET /ecl/lookthrough/preview — DataTable preview breakdown per instrumen
  # Story APP-C-LKT-003
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/preview:
    get:
      operationId: listLookthroughPreview
      summary: Preview look-through breakdown ECL per Reksadana — DataTable (sort+page+filter+export)
      description: |
        Menghitung dan menampilkan estimasi ECL per instrumen Reksadana secara on-the-fly,
        tanpa menulis ke ecl.*. DataTable pattern (sort + page + filter + export).

        Setiap baris menampilkan summary per instrumen. Drill-down ke breakdown per asset class
        tersedia via GET /ecl/lookthrough/preview/{instrumenId}?evaluation_date=...

        Permission: lookthrough.preview
        Roles: ROLE-RISK, ROLE-AKUN-CTL, ROLE-CFO, ROLE-AUDIT

        Allowed sort columns: instrumen_nama, nab_idr, total_ecl_estimate_idr, fund_composition_effective_from
        Default sort: instrumen_nama ASC

        Allowed filter:
        - filter[instrumen_id]: UUID
        - filter[klasifikasi]: AC | FVOCI (FVTPL di-exclude by default)
        - filter[has_composition]: true|false (false = belum ada composition APPROVED)
        - filter[nab_idr]: gte/lte/between
        - q: text search di instrumen_nama

        Export: CSV, XLSX (inline < 10k rows, async >= 10k).
        Audit: LOOKTHROUGH.PREVIEW per call.

        evaluationDate wajib. Jika fund composition missing untuk suatu instrumen:
        baris tetap ditampilkan dengan total_ecl_estimate_idr = null dan
        has_composition = false (tidak di-error, cukup di-flag).
      tags: [lookthrough-preview]
      security:
        - bearerAuth: []
      parameters:
        - name: evaluation_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: "Tanggal evaluasi. Format: YYYY-MM-DD. Wajib."
          example: "2026-06-30"
        - name: periode_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: UUID periode buku. Diperlukan untuk load parameter PD/LGD/bobot yang approved. Jika kosong, gunakan parameter APPROVED terbaru.
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/searchParam"
        - name: "filter[instrumen_id]"
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: "filter[klasifikasi]"
          in: query
          required: false
          schema:
            type: string
            enum: [AC, FVOCI]
          description: "Filter klasifikasi PSAK 71. FVTPL di-exclude by default."
        - name: "filter[has_composition]"
          in: query
          required: false
          schema:
            type: boolean
          description: "true = hanya instrumen yang sudah punya composition APPROVED; false = yang belum"
        - name: "filter[nab_idr]"
          in: query
          required: false
          schema:
            type: string
          description: "Format: gte:1000000000 atau between:0,5000000000"
        - name: export
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xlsx]
          description: Jika diset, response adalah file download
      responses:
        "200":
          description: List preview per instrumen Reksadana
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookthroughPreviewListResponse"
              example:
                data:
                  - instrumenId: "550e8400-e29b-41d4-a716-000000000001"
                    instrumenNama: "Reksa Dana Pendapatan Tetap XYZ"
                    klasifikasiPsak71: "FVOCI"
                    nabIdr: 5000000000.0000
                    fundCompositionId: "550e8400-e29b-41d4-a716-000000000100"
                    fundCompositionEffectiveFrom: "2026-04-01"
                    hasComposition: true
                    totalEclEstimateIdr: 17962500.0000
                    isPreview: true
                    warnings: []
                  - instrumenId: "550e8400-e29b-41d4-a716-000000000002"
                    instrumenNama: "Reksa Dana Saham ABC"
                    klasifikasiPsak71: "AC"
                    nabIdr: 3000000000.0000
                    fundCompositionId: null
                    fundCompositionEffectiveFrom: null
                    hasComposition: false
                    totalEclEstimateIdr: null
                    isPreview: true
                    warnings:
                      - code: "LOOKTHROUGH_FUND_COMPOSITION_MISSING"
                        message: "Belum ada fund composition APPROVED untuk instrumen ini"
                pagination:
                  nextCursor: null
                  hasMore: false
                  totalEstimate: 2
                  limit: 50
                appliedSort:
                  - col: "instrumen_nama"
                    dir: "asc"
                appliedFilter: {}
                meta:
                  traceId: "01HXY..."
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "202":
          description: Async export job diterima (dataset >= 10k rows)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/JobAcceptedResponse"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: evaluationDate wajib, atau parameter ECL tidak tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: ECL_PARAM_NOT_READY
                  message: "Parameter ECL belum semua APPROVED untuk periode yang dipilih. Preview tidak dapat dilakukan."
                  details:
                    - field: "periode_id"
                      rule: "ecl_parameters_all_approved"
                      message: "mst.bobot_skenario atau mst.impact_mev_pd belum APPROVED"
                  traceId: "01HXY..."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # GET /ecl/lookthrough/preview/{instrumenId} — drill-down per instrumen
  # Story APP-C-LKT-003 Scenario 1 + 2
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/preview/{instrumenId}:
    get:
      operationId: getLookthroughPreviewDetail
      summary: Detail preview look-through ECL satu Reksadana — breakdown per asset class + skenario
      description: |
        Menghitung dan menampilkan estimasi ECL Reksadana untuk satu instrumen, dengan
        breakdown lengkap: per asset class × per skenario (GOOD/NORMAL/BAD).

        Digunakan untuk drill-down dari DataTable listLookthroughPreview, atau akses langsung
        dari halaman detail instrumen.

        Permission: lookthrough.preview
        Roles: ROLE-RISK, ROLE-AKUN-CTL, ROLE-CFO, ROLE-AUDIT

        evaluation_date wajib.
        periode_id opsional (default: ambil parameter ECL APPROVED terbaru).

        Breakdown per asset class: setiap baris dapat di-expand ke detail per skenario.
        DataTable breakdown mendukung sort per kolom, filter per asset_class (sesuai UX §1).
        Export: GET /ecl/lookthrough/preview/{instrumenId}/export?format=csv&evaluation_date=...

        Audit: LOOKTHROUGH.PREVIEW ditulis per call.
      tags: [lookthrough-preview]
      security:
        - bearerAuth: []
      parameters:
        - name: instrumenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID instrumen Reksadana
        - name: evaluation_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: "Tanggal evaluasi. Format: YYYY-MM-DD. Wajib."
          example: "2026-06-30"
        - name: periode_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: UUID periode buku. Opsional.
      responses:
        "200":
          description: Preview breakdown per asset class + skenario untuk satu instrumen
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/LookthroughPreviewDetail"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Fund composition missing, NAB missing, instrumen bukan REKSADANA, dll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                compositionMissing:
                  value:
                    error:
                      code: LOOKTHROUGH_FUND_COMPOSITION_MISSING
                      message: "Tidak ditemukan fund composition APPROVED untuk instrumen per tanggal ini."
                      details: []
                      traceId: "01HXY..."
                nabMissing:
                  value:
                    error:
                      code: LOOKTHROUGH_NAB_MISSING
                      message: "NAB instrumen tidak tersedia. Pastikan feed NAB harian KSEI/MI telah diupload."
                      details: []
                      traceId: "01HXY..."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # GET /ecl/lookthrough/preview/{instrumenId}/export — export breakdown CSV/XLSX
  # Story APP-C-LKT-003 Scenario 4
  # ---------------------------------------------------------------------------
  /ecl/lookthrough/preview/{instrumenId}/export:
    get:
      operationId: exportLookthroughPreview
      summary: Export breakdown look-through ECL satu instrumen ke CSV atau XLSX
      description: |
        Export hasil preview breakdown per asset class untuk satu instrumen.
        Selalu inline (dataset per instrumen < 10k rows).

        Permission: lookthrough.preview
        Roles: ROLE-RISK, ROLE-AKUN-CTL, ROLE-CFO, ROLE-AUDIT

        CSV: UTF-8 with BOM, delimiter koma, line ending CRLF.
        XLSX: header bold + freeze, money #,##0.0000, rate #.00000000, date YYYY-MM-DD.
        Header row Bahasa Indonesia: "Asset Class", "Bobot (%)", "Porsi NAB (IDR)",
          "PD Normal", "LGD", "ECL Skenario GOOD (IDR)", "ECL Skenario NORMAL (IDR)",
          "ECL Skenario BAD (IDR)", "ECL FL GOOD (IDR)", "ECL FL NORMAL (IDR)",
          "ECL FL BAD (IDR)", "ECL Weighted (IDR)".
        Footer row: timestamp export + filter aktif.
        Content-Disposition: attachment; filename="lookthrough-{instrumenKode}-{YYYYMMDD}.{ext}"

        Audit: LOOKTHROUGH.EXPORT ditulis ke aud.audit_log,
               after_jsonb = {format, evaluation_date, instrumen_id, row_count}.
      tags: [lookthrough-preview]
      security:
        - bearerAuth: []
      parameters:
        - name: instrumenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
          description: Format file output
        - name: evaluation_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: "Tanggal evaluasi. Format: YYYY-MM-DD. Wajib."
          example: "2026-06-30"
        - name: periode_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: UUID periode buku. Opsional.
      responses:
        "200":
          description: File CSV atau XLSX (inline)
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="lookthrough-RKD-PENDAPATAN-TETAP-XYZ-20260630.xlsx"'
            X-Total-Rows:
              schema:
                type: integer
              description: Jumlah baris data (tidak termasuk header)
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Fund composition atau NAB missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RSA-2048 signed oleh Keycloak. Access token TTL 15 menit (DEC-025).
        Claims wajib: sub, preferred_username, roles[], permissions[], tenant_id,
        mfa_verified, exp, iat, nbf.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID v4 unik per request. TTL replay 24 jam (DEC-021).

    compositionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID composition group dari mst.fund_composition

    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque base64 cursor dari pagination.nextCursor (DEC-022)

    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Jumlah item per halaman. Default 50, max 200.

    sortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        pattern: "^[a-z_]+(:(asc|desc))?(,[a-z_]+(:(asc|desc))?)*$"
      description: "Multi-column sort. Format: col1:asc,col2:desc. Max 3 kolom."

    searchParam:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Text search global

  schemas:

    # ---- ResponseMeta -------------------------------------------------------
    ResponseMeta:
      type: object
      properties:
        traceId:
          type: string
          example: "01HXY..."

    # ---- Error Envelope -----------------------------------------------------
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, traceId]
          properties:
            code:
              $ref: "#/components/schemas/LookthroughErrorCode"
            message:
              type: string
              description: Human-readable message Bahasa Indonesia. JANGAN expose stack trace.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Dot-notation field path
                  rule:
                    type: string
                    description: Nama rule yang gagal
                  message:
                    type: string
            traceId:
              type: string

    # ---- Look-through Error Codes -------------------------------------------
    LookthroughErrorCode:
      type: string
      description: |
        Stable error codes — P4-M4 Look-through Reksadana specific + inherited dari _common.yaml.
        Tambahkan kode baru ke _common.yaml section "Look-through (APP-C, P4-M4)".
      enum:
        # Inherited dari _common.yaml
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SOD_VIOLATION
        - MFA_REQUIRED
        - NOT_FOUND
        - CONFLICT
        - IDEMPOTENCY_REPLAY
        - IDEMPOTENCY_MISMATCH
        - WORKFLOW_INVALID_TRANSITION
        - PERIODE_CLOSED
        - ECL_PARAM_FROZEN
        - ECL_PARAM_NOT_READY
        - RATE_LIMITED
        - INTERNAL
        - INSTRUMENT_ECL_NOT_APPLICABLE
        # Look-through specific (P4-M4) — tambah ke _common.yaml
        - LOOKTHROUGH_FUND_COMPOSITION_MISSING   # 422 — tidak ada composition APPROVED per evaluationDate
        - LOOKTHROUGH_NAB_MISSING                # 422 — NAB instrumen Reksadana tidak tersedia
        - LOOKTHROUGH_WEIGHT_INVALID             # 422 — sum weight ≠ 100% ± 0.01% (submit or defensive runtime)
        - LOOKTHROUGH_INSTRUMEN_NOT_REKSADANA    # 422 — instrumen bukan tipe REKSADANA
        - LOOKTHROUGH_ASSET_CLASS_UNKNOWN        # 422 — asset_class bukan enum yang valid
        - LOOKTHROUGH_PD_LGD_CLASS_MISSING       # 422 — PD/LGD parameter untuk asset class tidak tersedia
        - LOOKTHROUGH_COMPOSITION_REVIEW_INVALID_TRANSITION  # 422 — transisi workflow tidak valid
        - LOOKTHROUGH_COMPOSITION_SOD_VIOLATION  # 403 — SoD violation pada composition workflow
        - LOOKTHROUGH_BULK_TOO_LARGE             # 413 — jumlah Reksadana melebihi batas sistem
        - LOOKTHROUGH_POCI_DEFERRED              # 422 — POCI Reksadana di-skip, defer ke M7

    # ---- Job Accepted Response (202) ----------------------------------------
    JobAcceptedResponse:
      type: object
      required: [jobId, type, statusUrl, streamUrl]
      properties:
        jobId:
          type: string
          description: Job identifier (ULID). Persistent di sys.job.
          example: "01JXYZ-LKT-BULK-001"
        type:
          type: string
          description: Job type identifier
          example: "LOOKTHROUGH_BULK_COMPUTE"
        statusUrl:
          type: string
          example: "/api/v1/jobs/01JXYZ-LKT-BULK-001"
        streamUrl:
          type: string
          description: SSE stream. Gunakan Authorization Bearer header (bukan ?token=).
          example: "/api/v1/jobs/01JXYZ-LKT-BULK-001/stream"
        estimatedDurationSeconds:
          type: integer
          nullable: true
          description: Estimasi durasi berdasarkan history run sebelumnya

    # ---- Fund Composition Line ----------------------------------------------
    FundCompositionLine:
      type: object
      required: [assetClass, weightPct]
      properties:
        assetClass:
          type: string
          enum: [GOVT_BOND, CORP_BOND, CASH, EQUITY, OTHER]
          description: |
            Kategori aset underlying.
            GOVT_BOND: Obligasi Pemerintah (sovereign, PD=0 IDR-denominated)
            CORP_BOND: Obligasi Korporasi (PD dari mst.pd_pefindo)
            CASH: Kas/deposito/pasar uang (PD dari bank counterparty)
            EQUITY: Saham (PD dari sektor average)
            OTHER: Aset lain — flag manual review (PD/LGD conservative default)
          example: "GOVT_BOND"
        weightPct:
          type: number
          format: decimal
          description: "Bobot persentase asset class ini dalam portfolio fund (NUMERIC(7,4)). Contoh: 60.0000 = 60%"
          minimum: 0.0001
          example: 60.0000

    # ---- Fund Composition Group (header + lines) ----------------------------
    FundCompositionGroup:
      type: object
      description: |
        Satu composition group = satu set lines per asset class untuk satu instrumen + effective period.
        Satu group bisa berisi 1..N lines (satu per asset class unik).
        Σ weightPct semua lines = 100% ± 0.01%.
      required:
        - compositionId
        - instrumenId
        - effectiveFrom
        - workflowStatus
        - totalWeightPct
        - isAmendment
        - lines
      properties:
        compositionId:
          type: string
          format: uuid
          description: "UUID composition group. Digunakan sebagai FK dari ecl.lookthrough_underlying.fund_composition_id."
          example: "550e8400-e29b-41d4-a716-000000000100"
        instrumenId:
          type: string
          format: uuid
          example: "550e8400-e29b-41d4-a716-000000000001"
        instrumenNama:
          type: string
          nullable: true
          example: "Reksa Dana Pendapatan Tetap XYZ"
        effectiveFrom:
          type: string
          format: date
          description: "Tanggal mulai berlaku composition ini. Format: YYYY-MM-DD."
          example: "2026-04-01"
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: |
            Tanggal akhir berlaku. NULL = masih aktif.
            Di-set saat versi baru di-approve (SUPERSEDED): effectiveTo = new_effective_from - 1 hari.
          example: null
        workflowStatus:
          type: string
          enum: [DRAFT, PENDING_REVIEW, PENDING_APPROVAL, APPROVED, REJECTED, SUPERSEDED]
          example: "PENDING_REVIEW"
        totalWeightPct:
          type: number
          format: decimal
          description: "Sum semua weightPct lines (NUMERIC(7,4)). Harus = 100% ± 0.01% untuk submit."
          example: 100.0000
        isAmendment:
          type: boolean
          description: "true = composition ini menggantikan versi sebelumnya (amend flow)."
          example: false
        supersedesCompositionId:
          type: string
          format: uuid
          nullable: true
          description: UUID composition yang di-supersede. Null jika bukan amendment.
          example: null
        lines:
          type: array
          minItems: 1
          description: Lines per asset class. Setiap asset_class harus unik dalam satu group.
          items:
            $ref: "#/components/schemas/FundCompositionLine"
        sourceDocId:
          type: string
          format: uuid
          nullable: true
          description: UUID referensi dokumen fund fact sheet (doc.upload)
          example: "550e8400-e29b-41d4-a716-000000000090"
        catatan:
          type: string
          nullable: true
          maxLength: 2000
          example: "Fund fact sheet Q1 2026 per tanggal 31 Maret 2026"
        makerId:
          type: string
          format: uuid
          nullable: true
          description: UUID user ROLE-AKUN yang submit
        makerNama:
          type: string
          nullable: true
          example: "Siti Rahayu"
        reviewerId:
          type: string
          format: uuid
          nullable: true
          description: UUID user ROLE-RISK yang review. Null sebelum review.
        reviewerNama:
          type: string
          nullable: true
        signedAtReview:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp saat reviewer sign. ISO 8601 dengan TZ."
        approverId:
          type: string
          format: uuid
          nullable: true
          description: UUID user ROLE-ALCO yang approve. Null sebelum approve.
        approverNama:
          type: string
          nullable: true
        signedAtApprove:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp saat approver sign. ISO 8601 dengan TZ."
        rejectionReason:
          type: string
          nullable: true
          description: Comment dari reviewer/approver saat reject.
        createdAt:
          type: string
          format: date-time
          example: "2026-06-11T09:00:00+07:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-11T14:00:00+07:00"
        rowVersion:
          type: integer
          description: Optimistic lock counter. Increment setiap UPDATE.
          example: 1

    # ---- Fund Composition Submit Request -----------------------------------
    FundCompositionSubmitRequest:
      type: object
      required: [instrumenId, effectiveFrom, lines]
      properties:
        instrumenId:
          type: string
          format: uuid
          description: "UUID instrumen Reksadana dari mst.instrumen. tipe_instrumen harus REKSADANA."
        effectiveFrom:
          type: string
          format: date
          description: "Tanggal mulai berlaku composition baru. Format: YYYY-MM-DD."
          example: "2026-04-01"
        sourceDocId:
          type: string
          format: uuid
          nullable: true
          description: UUID dokumen fund fact sheet (doc.upload). Opsional.
        catatan:
          type: string
          nullable: true
          maxLength: 2000
          description: Catatan bebas (max 2000 karakter)
        isAmendment:
          type: boolean
          default: false
          description: |
            false (default): komposisi baru untuk instrumen yang belum punya APPROVED composition.
            true: amend/update dari versi sebelumnya. Wajib sertakan supersedesCompositionId.
        supersedesCompositionId:
          type: string
          format: uuid
          nullable: true
          description: |
            UUID composition group yang akan digantikan.
            Wajib jika isAmendment=true. Target harus workflow_status=APPROVED.
        lines:
          type: array
          minItems: 1
          maxItems: 5
          description: |
            Lines per asset class. Minimal 1, maksimal 5 (satu per enum value).
            Setiap asset_class harus unik dalam satu submit.
            Σ weightPct = 100% ± 0.01%.
          items:
            $ref: "#/components/schemas/FundCompositionLine"

    # ---- Workflow Action Request (review/approve/reject) -------------------
    WorkflowActionRequest:
      type: object
      required: [signatureMethod]
      properties:
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: Komentar review/approve/reject. Opsional untuk approve, disarankan untuk reject.
          example: "Sesuai fund fact sheet Maret 2026. Komposisi valid."
        signatureMethod:
          type: string
          enum: [JWT_STEP_UP, JWT_STANDARD]
          description: |
            JWT_STANDARD: untuk review dan approve fund_composition (MFA standard, bukan step-up).
            JWT_STEP_UP: tidak diperlukan untuk fund_composition.approve (bukan dalam DEC-027 step-up list).
          example: "JWT_STANDARD"

    # ---- Fund Composition List Response ------------------------------------
    FundCompositionListResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FundCompositionGroup"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"
        appliedSort:
          type: array
          items:
            type: object
            properties:
              col:
                type: string
              dir:
                type: string
                enum: [asc, desc]
        appliedFilter:
          type: object
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    # ---- Pagination Response -----------------------------------------------
    PaginationResponse:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          example: "eyJjcmVhdGVkQXQiOiIyMDI2LTA2LTExIn0="
        hasMore:
          type: boolean
        totalEstimate:
          type: integer
          nullable: true
          description: Estimasi total row (dari EXPLAIN, bukan COUNT pasti)
        limit:
          type: integer

    # ---- Look-through Compute Request --------------------------------------
    LookthroughComputeRequest:
      type: object
      required: [instrumenId, evaluationDate]
      properties:
        instrumenId:
          type: string
          format: uuid
          description: UUID instrumen Reksadana dari mst.instrumen
        evaluationDate:
          type: string
          format: date
          description: "Tanggal evaluasi ECL. Format: YYYY-MM-DD."
          example: "2026-06-30"
        periodeId:
          type: string
          format: uuid
          nullable: true
          description: UUID periode buku. Opsional — jika kosong, gunakan parameter APPROVED terbaru.

    # ---- Look-through Bulk Compute Request ---------------------------------
    LookthroughBulkComputeRequest:
      type: object
      required: [periodeId, evaluationDate]
      properties:
        periodeId:
          type: string
          format: uuid
          description: UUID periode buku dari mst.periode_buku
        evaluationDate:
          type: string
          format: date
          description: "Tanggal evaluasi (biasanya tanggal akhir periode). Format: YYYY-MM-DD."
          example: "2026-06-30"

    # ---- Look-through Compute Result (single instrumen) -------------------
    LookthroughComputeResult:
      type: object
      required:
        - instrumenId
        - evaluationDate
        - nabIdr
        - fundCompositionId
        - totalEclIdr
        - breakdown
      description: |
        Hasil compute look-through ECL satu instrumen Reksadana.
        Semua angka presisi: IDR = NUMERIC(20,4), PD/LGD = NUMERIC(10,8).
        Kalkulasi menggunakan shopspring/decimal (no float64).
      properties:
        instrumenId:
          type: string
          format: uuid
        instrumenNama:
          type: string
          nullable: true
        evaluationDate:
          type: string
          format: date
        nabIdr:
          type: number
          format: decimal
          description: "NAB total instrumen Reksadana (IDR, NUMERIC(20,4)). Sumber: mst.instrumen.nominal_nab_idr."
          example: 5000000000.0000
        fundCompositionId:
          type: string
          format: uuid
          description: UUID composition group yang dipakai untuk compute ini
        fundCompositionVersion:
          type: string
          format: date
          description: "effectiveFrom dari composition yang dipakai (untuk referensi). Format: YYYY-MM-DD."
          example: "2026-04-01"
        klasifikasiPsak71:
          type: string
          enum: [AC, FVOCI, FVTPL]
          description: "Klasifikasi PSAK 71 instrumen. Jika FVTPL: totalEclIdr = 0."
          example: "FVOCI"
        totalEclIdr:
          type: number
          format: decimal
          description: "Σ ECL_weighted dari semua asset class (IDR, NUMERIC(20,4)). 0 jika FVTPL."
          example: 17962500.0000
        breakdown:
          type: array
          description: Breakdown ECL per asset class. Satu item per asset class dalam composition.
          items:
            $ref: "#/components/schemas/LookthroughBreakdownLine"
        warnings:
          type: array
          description: Warning non-blocking (mis. asset class OTHER ditandai untuk review, FVTPL skip note)
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              assetClass:
                type: string
                nullable: true

    # ---- Look-through Breakdown Line (per asset class) --------------------
    LookthroughBreakdownLine:
      type: object
      required:
        - assetClass
        - weightPct
        - nabPortionIdr
        - lgd
        - eclWeightedIdr
      description: |
        ECL breakdown untuk satu asset class dalam fund composition.
        Formula per skenario S:
          ECL_S = nabPortionIdr × PD_S × lgd
          ECL_FL_S = ECL_S × flMultiplier_S
          ECL_weighted = Σ(ECL_FL_S × bobot_S) untuk S in {GOOD, NORMAL, BAD}
        Presisi: IDR NUMERIC(20,4), PD/LGD NUMERIC(10,8).
      properties:
        assetClass:
          type: string
          enum: [GOVT_BOND, CORP_BOND, CASH, EQUITY, OTHER]
          example: "CORP_BOND"
        weightPct:
          type: number
          format: decimal
          description: "Bobot dari fund composition (NUMERIC(7,4)). Mis. 30.0000 = 30%."
          example: 30.0000
        nabPortionIdr:
          type: number
          format: decimal
          description: "nabIdr × weightPct/100 (IDR, NUMERIC(20,4))."
          example: 1500000000.0000
        pdGood:
          type: number
          format: decimal
          description: "PD skenario GOOD untuk asset class ini (NUMERIC(10,8))."
          example: 0.02000000
          nullable: true
        pdNormal:
          type: number
          format: decimal
          description: "PD skenario NORMAL (NUMERIC(10,8)). 0.00000000 untuk GOVT_BOND sovereign."
          example: 0.02500000
        pdBad:
          type: number
          format: decimal
          description: "PD skenario BAD (NUMERIC(10,8))."
          example: 0.03750000
          nullable: true
        lgd:
          type: number
          format: decimal
          description: "LGD pool untuk asset class ini (NUMERIC(10,8))."
          example: 0.45000000
        flMultiplierGood:
          type: number
          format: decimal
          description: "Forward-looking multiplier skenario GOOD (NUMERIC(10,8))."
          example: 0.80000000
          nullable: true
        flMultiplierNormal:
          type: number
          format: decimal
          description: "Forward-looking multiplier skenario NORMAL (NUMERIC(10,8))."
          example: 1.00000000
          nullable: true
        flMultiplierBad:
          type: number
          format: decimal
          description: "Forward-looking multiplier skenario BAD (NUMERIC(10,8))."
          example: 1.50000000
          nullable: true
        eclSkenariosGoodIdr:
          type: number
          format: decimal
          description: "ECL skenario GOOD sebelum FL: nabPortionIdr × PD_Good × LGD (IDR, NUMERIC(20,4))."
          example: 13500000.0000
          nullable: true
        eclSkenariosNormalIdr:
          type: number
          format: decimal
          description: "ECL skenario NORMAL sebelum FL (IDR, NUMERIC(20,4))."
          example: 16875000.0000
        eclSkenariosBadIdr:
          type: number
          format: decimal
          description: "ECL skenario BAD sebelum FL (IDR, NUMERIC(20,4))."
          example: 25312500.0000
          nullable: true
        eclFlGoodIdr:
          type: number
          format: decimal
          description: "ECL skenario GOOD setelah FL multiplier (IDR, NUMERIC(20,4))."
          example: 10800000.0000
          nullable: true
        eclFlNormalIdr:
          type: number
          format: decimal
          description: "ECL skenario NORMAL setelah FL multiplier (IDR, NUMERIC(20,4))."
          example: 16875000.0000
        eclFlBadIdr:
          type: number
          format: decimal
          description: "ECL skenario BAD setelah FL multiplier (IDR, NUMERIC(20,4))."
          example: 37968750.0000
          nullable: true
        bobotGood:
          type: number
          format: decimal
          description: "Bobot skenario GOOD (NUMERIC(10,8)). Default: 0.25000000."
          example: 0.25000000
          nullable: true
        bobotNormal:
          type: number
          format: decimal
          description: "Bobot skenario NORMAL (NUMERIC(10,8)). Default: 0.50000000."
          example: 0.50000000
          nullable: true
        bobotBad:
          type: number
          format: decimal
          description: "Bobot skenario BAD (NUMERIC(10,8)). Default: 0.25000000."
          example: 0.25000000
          nullable: true
        eclWeightedIdr:
          type: number
          format: decimal
          description: "Σ(ECL_FL_S × bobot_S) — ECL weighted aggregate untuk asset class ini (IDR, NUMERIC(20,4))."
          example: 20629687.5000

    # ---- Look-through Preview Detail (single instrumen + all scenarios) ----
    LookthroughPreviewDetail:
      type: object
      required: [instrumenId, evaluationDate, nabIdr, fundCompositionId, totalEclEstimateIdr, breakdown, isPreview]
      description: |
        Preview detail look-through ECL satu instrumen. Identik dengan LookthroughComputeResult
        tapi dengan isPreview=true dan tidak menulis ke ecl.*.
      properties:
        instrumenId:
          type: string
          format: uuid
        instrumenNama:
          type: string
          nullable: true
        evaluationDate:
          type: string
          format: date
        nabIdr:
          type: number
          format: decimal
          example: 5000000000.0000
        fundCompositionId:
          type: string
          format: uuid
        fundCompositionEffectiveFrom:
          type: string
          format: date
          example: "2026-04-01"
        klasifikasiPsak71:
          type: string
          enum: [AC, FVOCI, FVTPL]
          example: "FVOCI"
        totalEclEstimateIdr:
          type: number
          format: decimal
          description: "Total ECL estimasi (IDR, NUMERIC(20,4)). Gunakan parameter ECL aktif."
          example: 17962500.0000
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/LookthroughBreakdownLine"
        isPreview:
          type: boolean
          description: Selalu true. Bukan hasil calc run resmi.
          example: true
        note:
          type: string
          example: "Estimasi menggunakan parameter ECL aktif. Bukan hasil calc run resmi."
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              assetClass:
                type: string
                nullable: true

    # ---- Look-through Preview List Row (per instrumen summary) -------------
    LookthroughPreviewRow:
      type: object
      required: [instrumenId, instrumenNama, evaluationDate, hasComposition, isPreview]
      properties:
        instrumenId:
          type: string
          format: uuid
        instrumenNama:
          type: string
          example: "Reksa Dana Pendapatan Tetap XYZ"
        klasifikasiPsak71:
          type: string
          nullable: true
          enum: [AC, FVOCI, FVTPL]
          example: "FVOCI"
        nabIdr:
          type: number
          format: decimal
          nullable: true
          description: "NAB instrumen (IDR, NUMERIC(20,4)). Null jika belum tersedia."
          example: 5000000000.0000
        fundCompositionId:
          type: string
          format: uuid
          nullable: true
          description: UUID composition APPROVED yang berlaku. Null jika belum ada composition.
        fundCompositionEffectiveFrom:
          type: string
          format: date
          nullable: true
          example: "2026-04-01"
        hasComposition:
          type: boolean
          description: "true = ada composition APPROVED berlaku pada evaluationDate."
          example: true
        totalEclEstimateIdr:
          type: number
          format: decimal
          nullable: true
          description: "Total ECL estimasi (IDR, NUMERIC(20,4)). Null jika composition atau NAB belum tersedia."
          example: 17962500.0000
        isPreview:
          type: boolean
          description: Selalu true.
          example: true
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string

    # ---- Look-through Preview List Response --------------------------------
    LookthroughPreviewListResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LookthroughPreviewRow"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"
        appliedSort:
          type: array
          items:
            type: object
            properties:
              col:
                type: string
              dir:
                type: string
                enum: [asc, desc]
        appliedFilter:
          type: object
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/ResponseMeta"

  # -------------------------------------------------------------------------
  # Reusable Responses
  # -------------------------------------------------------------------------
  responses:
    ValidationFailed:
      description: Validasi field atau cross-field gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: VALIDATION_FAILED
              message: "Validasi gagal — 1 field bermasalah"
              details:
                - field: "body.lines"
                  rule: "weight_sum_100pct"
                  message: "Total weight_pct = 85%, expected 100% ± 0.01%"
              traceId: "01HXY..."

    Unauthorized:
      description: JWT tidak valid, missing, atau expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: UNAUTHORIZED
              message: "Token JWT tidak valid atau sudah expired"
              details: []
              traceId: "01HXY..."

    Forbidden:
      description: Permission tidak terpenuhi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: FORBIDDEN
              message: "Anda tidak memiliki permission 'fund_composition.review'"
              details: []
              traceId: "01HXY..."

    NotFound:
      description: Entity tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: "Entity tidak ditemukan"
              details: []
              traceId: "01HXY..."

    WorkflowInvalidTransition:
      description: State machine menolak transisi ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: LOOKTHROUGH_COMPOSITION_REVIEW_INVALID_TRANSITION
              message: "Transisi workflow tidak valid untuk state saat ini."
              details:
                - field: "workflowStatus"
                  rule: "invalid_transition"
                  message: "Transition tidak diizinkan"
              traceId: "01HXY..."

    PeriodeClosed:
      description: Periode buku sudah hard-closed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: PERIODE_CLOSED
              message: "Periode buku sudah hard-closed. Tidak bisa mutasi."
              details: []
              traceId: "01HXY..."

    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Detik sampai rate limit reset
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: RATE_LIMITED
              message: "Terlalu banyak request. Coba lagi dalam 60 detik."
              details: []
              traceId: "01HXY..."

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INTERNAL
              message: "Terjadi kesalahan internal. Hubungi admin dengan traceId."
              details: []
              traceId: "01HXY..."
