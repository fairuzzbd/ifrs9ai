  # ===========================================================================
  # S3 — APPROVE MANUAL UPLOAD BATCH (ROLE-AKUN-CTL, 4-eyes SoD)
  # ===========================================================================

  /master/kurs/upload/{batch_id}/approve:
    post:
      operationId: kursUploadBatchApprove
      summary: Approve batch upload kurs manual — ROLE-AKUN-CTL 4-eyes SoD; PENDING_APPROVAL → APPROVED
      description: |
        AC: S3-AC1, S3-AC3 (SoD), S3-AC4 (reject bukan endpoint ini)

        ROLE-AKUN-CTL (Approver, user berbeda dari ROLE-AKUN Maker) menyetujui seluruh batch.
        Bulk approve: semua kurs dalam batch yang masih PENDING_APPROVAL di-set APPROVED atomik.

        Pre-conditions:
          - Batch exists dan ada ≥ 1 kurs PENDING_APPROVAL
          - approver_id ≠ batch.maker_id (SoD, DEC-017) — S3-AC3
          - Masing-masing kurs belum di-lock (locked_flag=FALSE)

        Sukses (in-transaction):
          - UPDATE mst.kurs SET workflow_status='APPROVED', approver_id=actor_id, approved_at=now()
            WHERE upload_batch_id={batch_id} AND workflow_status='PENDING_APPROVAL'
          - INSERT aud.audit_log action=KURS.APPROVED per row
          - Notifikasi ke maker: "Kurs manual batch {batch_id} telah disetujui. N kurs APPROVED dan aktif."

        SoD violation → 403 SOD_VIOLATION + advisory audit KURS.APPROVE_REJECTED_SOD.

        Permission: kurs.approve
        Roles: ROLE-AKUN-CTL
        MFA: wajib (DEC-026 ROLE-AKUN-CTL)
        Idempotency-Key: WAJIB
        Rate limit: 20 req/min per user
      tags: [kurs-upload]
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID dari sys.upload_batch row (diperoleh dari response POST /master/kurs/upload)."
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID v4 unik per request. DEC-021."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KursApproveBody"
            example:
              comment: "Kurs manual 2026-06-18 telah diverifikasi dengan sumber Bloomberg. Disetujui."
              signatureMethod: "JWT_STEP_UP"
      responses:
        "200":
          description: Batch approved — semua kurs PENDING_APPROVAL dalam batch sekarang APPROVED
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/KursBatchApproveResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  uploadBatchId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                  rowsApproved: 3
                  kursApproved:
                    - kursId: "f6a7b8c9-d0e1-2345-f012-456789012345"
                      kodeMataUang: "USD"
                      tanggalBerlaku: "2026-06-18"
                      kursTengah: 16250.00000000
                      workflowStatus: "APPROVED"
                    - kursId: "07b8c9d0-e1f2-3456-0123-567890123456"
                      kodeMataUang: "EUR"
                      tanggalBerlaku: "2026-06-18"
                      kursTengah: 17530.00000000
                      workflowStatus: "APPROVED"
                    - kursId: "18c9d0e1-f2a3-4567-1234-678901234567"
                      kodeMataUang: "JPY"
                      tanggalBerlaku: "2026-06-18"
                      kursTengah: 104.25000000
                      workflowStatus: "APPROVED"
                  approvedBy: "a9b0c1d2-e3f4-5678-9012-345678901234"
                  approvedAt: "2026-06-18T11:30:00+07:00"
                  message: "3 kurs untuk 2026-06-18 berhasil disetujui dan aktif untuk digunakan sistem."
                meta:
