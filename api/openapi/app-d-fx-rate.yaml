  # ===========================================================================
  # S1 — BI JISDOR MANUAL SYNC (ROLE-IT-ADMIN, async Asynq job)
  # ===========================================================================

  /master/kurs/jisdor-sync:
    post:
      operationId: kursJisdorSync
      summary: Manual trigger BI JISDOR sync — ROLE-IT-ADMIN; returns Asynq jobId (long-running §3)
      description: |
        AC: S1-AC1 (trigger manual), S1-AC3 (holiday skip), S1-AC4 (DLQ pada failure)

        ROLE-IT-ADMIN men-trigger fetch JISDOR secara manual (mis. jika cron terlewat atau perlu
        re-fetch). Endpoint enqueue Asynq job "integration:jisdor_fetch" dan return jobId untuk
        JobProgressPanel (§3 UX pattern).

        Logic worker yang di-trigger (sama dengan cron otomatis):
          1. Cek sys.holiday_calendar untuk tanggal yang di-request. Jika libur → skip + advisory log.
          2. Fetch kurs tengah dari BI JISDOR per mata uang (sumber_kurs_default = 'BI_JISDOR').
          3. Idempotent: UNIQUE(kode_mata_uang, tanggal_berlaku) — skip jika APPROVED sudah ada.
          4. Compute rate_deviation_pct vs hari kerja sebelumnya.
          5. deviation_flag=TRUE jika > threshold → WARNING alert ke ROLE-AKUN + ROLE-AKUN-CTL.
          6. Retry 3× (interval 15 menit) on HTTP error.
          7. Setelah 3 retry exhausted: INSERT sys.dead_letter_queue + alert ROLE-AKUN + ROLE-IT-ADMIN.
          8. Audit KURS.JISDOR_FETCH per row (in-transaction).

        Parameter opsional:
          - tanggalTarget: fetch untuk tanggal spesifik (default: hari ini). Berguna untuk backfill.
          - Hanya dalam periode OPEN — tanggalTarget dalam CLOSED → ditolak FX_RATE_LOCKED.

        Permission: kurs.sync
        Roles: ROLE-IT-ADMIN
        MFA: wajib (DEC-026 ROLE-IT-ADMIN)
        Idempotency-Key: WAJIB
        Rate limit: 10 req/jam per user (lebih ketat — potential abuse)
      tags: [kurs-jisdor]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID v4 unik per request. DEC-021."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggalTarget:
                  type: string
                  format: date
                  description: |
                    Tanggal untuk fetch JISDOR. Default: hari ini (server TZ = Asia/Jakarta).
                    Jika tanggal dalam periode CLOSED → 423 FX_RATE_LOCKED.
                    Tidak boleh future date.
                  example: "2026-06-18"
                forceRefetch:
                  type: boolean
                  default: false
                  description: |
                    Jika true: fetch ulang meski sudah ada row APPROVED untuk tanggal ini.
                    Existing row di-update HANYA jika tidak locked.
                    Default false (idempotent skip jika sudah ada).
            example:
              tanggalTarget: "2026-06-18"
              forceRefetch: false
      responses:
        "202":
          description: JISDOR sync job enqueued — follow via JobProgressPanel (§3)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/JisdorSyncJobResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  jobId: "job_JISDOR_SYNC_01HXYZ"
                  type: "JISDOR_SYNC"
                  tanggalTarget: "2026-06-18"
                  statusUrl: "/api/v1/jobs/job_JISDOR_SYNC_01HXYZ"
                  streamUrl: "/api/v1/jobs/job_JISDOR_SYNC_01HXYZ/stream"
                  estimatedCurrencies: 5
                  message: "JISDOR sync dijadwalkan untuk 2026-06-18. Monitor progres via JobProgressPanel."
                meta:
                  traceId: "01HXY..."
        "400":
          description: tanggalTarget format salah atau future date
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: "1 field tidak valid"
                  details:
                    - field: "body.tanggalTarget"
                      rule: "not_future_date"
                      message: "tanggalTarget tidak boleh tanggal yang akan datang."
                  traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "423":
          description: Tanggal target dalam periode CLOSED — FX rate sudah locked
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: FX_RATE_LOCKED
                  message: "Tanggal 2026-05-15 berada dalam periode PRD-2026-05 yang sudah hard-closed. JISDOR sync tidak dapat dilakukan untuk tanggal tersebut."
                  details: []
                  traceId: "01HXY..."
        "429":
          description: Rate limited — 10 req/jam per user untuk endpoint sensitif ini
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: RATE_LIMITED
                  message: "Terlalu banyak request JISDOR sync. Maksimal 10 kali per jam per user. Coba lagi dalam 3600 detik."
                  details: []
                  traceId: "01HXY..."
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # S5 — FX TREATMENT ROUTING (compliance-critical — ifrs9-compliance-reviewer BLOCKING)
  # ===========================================================================

  /master/kurs/treatment/{instrumen_id}:
    get:
      operationId: kursTreatmentGetByInstrumen
      summary: FX gain/loss treatment routing per klasifikasi PSAK 71 — compliance-critical (S5)
      description: |
        AC: S5-AC1, S5-AC2, S5-AC3, S5-AC4

        Mengembalikan routing decision FX gain/loss untuk instrumen berdasarkan:
          1. klasifikasi_psak71 di mst.instrumen (harus locked)
          2. mata_uang di mst.instrumen

        Routing matrix (PSAK 71 / IFRS 9):
          AC       + FCY → P&L_FOREIGN_EXCHANGE        (FX_REALIZED/FX_UNREALIZED event)
          FVTPL    + FCY → P&L_FOREIGN_EXCHANGE        (FX_UNREALIZED event)
          FVOCI_DEBT   + FCY → OCI_FOREIGN_EXCHANGE_RESERVE     (recycled ke P&L saat derecognition, PSAK 71 §5.7.10)
          FVOCI_ELECTION + FCY → OCI_FOREIGN_EXCHANGE_RESERVE_NO_RECYCLING (irrevocable, PSAK 71 §5.7.5)
          Any      + IDR → NO_FX_TREATMENT             (tidak ada FX exposure)

        Pre-conditions:
          - instrumen_id exists dalam mst.instrumen
          - mst.instrumen.klasifikasi_locked = TRUE (jika FALSE → 422 KLASIFIKASI_NOT_LOCKED)

        Audit: KURS.FX_TREATMENT_QUERIED — sampling advisory (batch per 100 calls atau per
        unique instrumen per hari, bukan setiap call untuk performa).

        Digunakan secara internal oleh:
          - P5-M6 MTM worker: sebelum posting FX gain/loss harian
          - P5-M8 Penjualan service: FX recycling decision saat disposal
          - P5-M9 Akrual harian: konversi EAD_FCY → EAD_IDR

        PERINGATAN: endpoint ini menyentuh klasifikasi PSAK 71 dan routing jurnal.
        Setiap perubahan logic routing WAJIB melewati ifrs9-compliance-reviewer (BLOCKING gate).
        Referensi: PSAK 71 §5.7.10 (FVOCI debt FX OCI), §5.7.5 (FVOCI Election no recycling),
        FSD-APP-D §2.4, SoW_v1.4 §10.3.

        Permission: kurs.read + instrumen.read
        Roles: ROLE-AKUN, ROLE-AKUN-CTL, ROLE-RISK, ROLE-AUDIT (dan internal service calls)
        Rate limit: 120 req/min per user (higher limit — dipanggil oleh workers)
      tags: [kurs-treatment]
      parameters:
        - name: instrumen_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID dari mst.instrumen."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: FX treatment routing decision berhasil ditentukan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/KursTreatmentResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              examples:
                fvoci_debt_usd:
                  summary: S5-AC1 — Obligasi USD FVOCI_DEBT → OCI routing dengan recycling
                  value:
                    data:
                      instrumenId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      kodeInstrumen: "OBL-2026-00042"
                      klasifikasiPsak71: "FVOCI_DEBT"
                      matauang: "USD"
                      klasifikasiLocked: true
                      klasifikasiLockedAt: "2026-01-20T10:00:00+07:00"
                      fxTreatment:
                        routing: "OCI_FOREIGN_EXCHANGE_RESERVE"
                        accountType: "OCI"
                        ociRecycling: true
                        jurnalEventCode: "FX_OCI_RESERVE"
                        psak71Reference: "PSAK 71 §5.7.10 — FVOCI debt instrument: exchange differences in OCI"
                        notes: "FX gain/loss di-post ke OCI. Saat derecognition (penjualan/jatuh tempo), OCI balance di-recycle ke P&L (REKLAS_OCI_PL event)."
                    meta:
                      traceId: "01HXY..."
                fvoci_election_usd:
                  summary: S5-AC2 — Saham USD FVOCI_ELECTION → OCI no-recycling (irrevocable)
                  value:
                    data:
                      instrumenId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                      kodeInstrumen: "SHM-2026-00015"
                      klasifikasiPsak71: "FVOCI_ELECTION"
                      matauang: "USD"
                      klasifikasiLocked: true
                      klasifikasiLockedAt: "2026-02-10T09:30:00+07:00"
                      fxTreatment:
                        routing: "OCI_FOREIGN_EXCHANGE_RESERVE_NO_RECYCLING"
                        accountType: "OCI"
                        ociRecycling: false
                        jurnalEventCode: "FX_OCI_RESERVE_NO_RECYCLE"
                        psak71Reference: "PSAK 71 §5.7.5 — FVOCI Election equity instrument: no P&L recycling on disposal (irrevocable election)"
                        notes: "FX gain/loss di-post ke OCI. Saat disposal, OCI balance TIDAK di-recycle ke P&L. Keputusan FVOCI Election bersifat irrevocable."
                    meta:
                      traceId: "01HXY..."
                deposito_idr_ac:
                  summary: S5-AC3 — Deposito IDR AC → NO_FX_TREATMENT
                  value:
                    data:
                      instrumenId: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                      kodeInstrumen: "DEP-2026-00001"
                      klasifikasiPsak71: "AC"
                      matauang: "IDR"
                      klasifikasiLocked: true
                      klasifikasiLockedAt: "2026-01-05T08:00:00+07:00"
                      fxTreatment:
                        routing: "NO_FX_TREATMENT"
                        accountType: null
                        ociRecycling: null
                        jurnalEventCode: null
                        psak71Reference: null
                        notes: "Instrumen berdenominasi IDR — tidak ada FX gain/loss."
                    meta:
                      traceId: "01HXY..."
                fvtpl_sgd:
                  summary: FVTPL SGD obligasi → P&L routing
                  value:
                    data:
                      instrumenId: "d4e5f6a7-b8c9-0123-def0-234567890123"
                      kodeInstrumen: "OBL-2026-00088"
                      klasifikasiPsak71: "FVTPL"
                      matauang: "SGD"
                      klasifikasiLocked: true
                      klasifikasiLockedAt: "2026-01-15T11:00:00+07:00"
                      fxTreatment:
                        routing: "P&L_FOREIGN_EXCHANGE"
                        accountType: "P&L"
                        ociRecycling: null
                        jurnalEventCode: "FX_UNREALIZED"
                        psak71Reference: "PSAK 71 §5.7.1 — FVTPL: all fair value changes (including FX) in P&L"
                        notes: "FX gain/loss di-post ke P&L (Laporan Laba Rugi) bersama MTM. Event code FX_UNREALIZED dipisah dari MTM_FVTPL untuk granularitas jurnal."
                    meta:
                      traceId: "01HXY..."
                ac_eur:
                  summary: AC EUR deposito → P&L FX routing
                  value:
                    data:
                      instrumenId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                      kodeInstrumen: "DEP-2026-00020"
                      klasifikasiPsak71: "AC"
                      matauang: "EUR"
                      klasifikasiLocked: true
                      klasifikasiLockedAt: "2026-01-08T14:00:00+07:00"
                      fxTreatment:
                        routing: "P&L_FOREIGN_EXCHANGE"
                        accountType: "P&L"
                        ociRecycling: null
                        jurnalEventCode: "FX_REALIZED"
                        psak71Reference: "PSAK 71 §5.4.1 — AC instrument: FX differences on monetary items in P&L"
                        notes: "FX gain/loss instrumen AC di-post ke P&L. Untuk AC, event code FX_REALIZED dipakai saat settlement; FX_UNREALIZED saat period-end revaluation."
                    meta:
                      traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "404":
          description: Instrumen tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: NOT_FOUND
                  message: "Instrumen tidak ditemukan atau sudah soft-deleted."
                  details: []
                  traceId: "01HXY..."
        "422":
          description: Klasifikasi instrumen belum di-lock — FX treatment tidak dapat ditentukan
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: KLASIFIKASI_NOT_LOCKED
                  message: "Instrumen OBL-2026-00099 belum memiliki klasifikasi PSAK 71 yang locked. FX treatment tidak dapat ditentukan. Selesaikan SPPI Test + BM Assessment + Klasifikasi Approval terlebih dahulu."
                  details:
                    - field: "klasifikasi_locked"
                      rule: "must_be_locked"
                      message: "klasifikasi_psak71 harus locked sebelum FX treatment dapat diquery."
                  traceId: "01HXY..."
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

# ===========================================================================
# Components
# ===========================================================================

components:
  securitySchemes:
    bearerAuth:
      $ref: "./_common.yaml#/components/securitySchemes/bearerAuth"

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: "UUID v4 unik per request. Wajib di semua mutating endpoints (DEC-021). TTL 24 jam."

    XTraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: "Trace ID untuk distributed tracing. Gateway inject otomatis."

  schemas:

    # ---- Kurs List Item (untuk DataTable) -----------------------------------
    KursListItem:
      type: object
      required:
        - id
        - fxRateIdKode
        - kodeMataUang
        - tanggalBerlaku
        - kursTengah
        - sumberKurs
        - workflowStatus
        - lockedFlag
        - deviationFlag
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: "UUID primary key mst.kurs"
        fxRateIdKode:
          type: string
          maxLength: 20
          description: "Kode unik FX rate. Format: FX-{KODE}-{YYYYMMDD}. Mis. FX-USD-20260618."
          example: "FX-USD-20260618"
        kodeMataUang:
          type: string
          maxLength: 3
          description: "ISO 4217 currency code (3 huruf kapital)."
          example: "USD"
        tanggalBerlaku:
          type: string
          format: date
          description: "Tanggal berlaku kurs. UNIQUE bersama kodeMataUang."
          example: "2026-06-18"
        kursTengah:
          type: number
          format: double
          description: |
            Kurs tengah (IDR per 1 unit FCY). NUMERIC(20,8) di DB (DEC-016).
            Presisi 8 desimal. Jangan gunakan float di Go (shopspring/decimal).
          example: 16250.00000000
        kursBeli:
          type: number
          format: double
          nullable: true
          description: "Kurs beli. NUMERIC(20,8). Null jika tidak di-input (JISDOR hanya tengah)."
          example: null
        kursJual:
          type: number
          format: double
          nullable: true
          description: "Kurs jual. NUMERIC(20,8). Null jika tidak di-input."
          example: null
        sumberKurs:
          type: string
          enum: [BI_JISDOR, BI_KURS_TENGAH, INTERNAL, MANUAL]
          description: "Sumber kurs. BI_JISDOR untuk auto-fetch; MANUAL untuk manual upload."
          example: "BI_JISDOR"
        workflowStatus:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, REJECTED]
          description: |
            Status workflow kurs.
            PENDING_APPROVAL: manual upload menunggu approve ROLE-AKUN-CTL.
            APPROVED: aktif, dapat dikonsumsi sistem (MTM, ECL, dll).
            REJECTED: ditolak approver, perlu re-upload.
          example: "APPROVED"
        lockedFlag:
          type: boolean
          description: |
            TRUE jika kurs sudah dikunci oleh periode hard-close (P5-M4).
            locked=TRUE → 423 FX_RATE_LOCKED untuk setiap mutasi.
          example: false
        deviationFlag:
          type: boolean
          description: |
            TRUE jika rate_deviation_pct melebihi threshold (default 20%).
            Ditampilkan sebagai badge WARNING di UI.
          example: false
        rateDeviationPct:
          type: number
          format: double
          nullable: true
          description: |
            Persentase deviasi dari hari kerja sebelumnya. NUMERIC(8,4).
            NULL jika tidak ada data hari sebelumnya (hari pertama periode).
            Positif = naik, negatif = turun.
          example: 0.9317
        periodeKode:
          type: string
          nullable: true
          description: "Kode periode buku yang mencakup tanggal_berlaku. Mis. PRD-2026-06."
          example: "PRD-2026-06"
        makerId:
          type: string
          format: uuid
          nullable: true
          description: "User UUID yang mengupload kurs (untuk manual upload). NULL untuk JISDOR auto."
        approverId:
          type: string
          format: uuid
          nullable: true
          description: "User UUID yang menyetujui. NULL jika belum approved."
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp approve. NULL jika belum approved."
        rejectReason:
          type: string
          nullable: true
          description: "Alasan reject (min 20 karakter). NULL jika tidak REJECTED."
        uploadBatchId:
          type: string
          format: uuid
          nullable: true
          description: "UUID batch upload jika kurs berasal dari manual upload file. NULL untuk JISDOR."
        createdAt:
          type: string
          format: date-time
          example: "2026-06-18T10:30:05+07:00"
        createdBy:
          type: string
          format: uuid

    # ---- Kurs Detail (extends KursListItem dengan metadata tambahan) ----------
    KursDetail:
      allOf:
        - $ref: "#/components/schemas/KursListItem"
        - type: object
          properties:
            periodeBulananId:
              type: string
              format: uuid
              nullable: true
              description: "FK ke mst.periode_buku(id)."
            jisdorFetchMetadata:
              type: object
              nullable: true
              description: |
                Raw metadata BI JISDOR fetch. NULL untuk manual upload.
                Hanya ditampilkan untuk ROLE-IT-ADMIN dan ROLE-AUDIT.
              properties:
                url:
                  type: string
                  description: "URL pattern yang di-hit (tidak full URL dengan params sensitif)."
                fetchedAt:
                  type: string
                  format: date-time
                httpStatus:
                  type: integer
                  example: 200
                responseHash:
                  type: string
                  description: "SHA-256 hash dari response body untuk audit integrity."
                retryCount:
                  type: integer
                  minimum: 0
                  maximum: 3
                  example: 0
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              type: string
              format: uuid
            rowVersion:
              type: integer
              minimum: 1
              description: "Optimistic lock counter."

    # ---- Upload Response -------------------------------------------------------
    KursUploadResponse:
      type: object
      required:
        - uploadBatchId
        - rowsParsed
        - rowsValid
        - rowsInvalid
        - status
        - kursIds
        - kursCreated
        - deviationWarnings
        - nextStep
      properties:
        uploadBatchId:
          type: string
          format: uuid
          description: "UUID dari sys.upload_batch row. Digunakan untuk approve/reject endpoint."
        rowsParsed:
          type: integer
          minimum: 1
          description: "Total baris yang berhasil di-parse dari file."
        rowsValid:
          type: integer
          minimum: 0
          description: "Baris yang lolos validasi dan di-insert."
        rowsInvalid:
          type: integer
          minimum: 0
          description: "Baris yang gagal validasi. Jika > 0, tidak ada INSERT."
        status:
          type: string
          enum: [PENDING_APPROVAL]
          description: "Status kurs setelah upload. Selalu PENDING_APPROVAL."
        kursIds:
          type: array
          items:
            type: string
            format: uuid
          description: "UUID list dari kurs yang berhasil di-insert."
        kursCreated:
          type: array
          description: "Summary kurs yang dibuat per row."
          items:
            type: object
            required: [kodeMataUang, tanggalBerlaku, kursTengah, deviationFlag]
            properties:
              kodeMataUang:
                type: string
                example: "USD"
              tanggalBerlaku:
                type: string
                format: date
                example: "2026-06-18"
              kursTengah:
                type: number
                format: double
                example: 16250.00000000
              deviationFlag:
                type: boolean
              rateDeviationPct:
                type: number
                format: double
                nullable: true
        deviationWarnings:
          type: array
          description: "Daftar mata uang dengan deviation_flag=TRUE (alert tapi tidak memblok)."
          items:
            type: object
            properties:
              kodeMataUang:
                type: string
              rateDeviationPct:
                type: number
                format: double
              previousKursTengah:
                type: number
                format: double
                nullable: true
              message:
                type: string
        nextStep:
          type: string
          description: "Panduan langkah selanjutnya untuk user."
        dokumenBuktiId:
          type: string
          format: uuid
          nullable: true
          description: "UUID MinIO dokumen asli yang di-upload (doc.upload FK)."

    # ---- Approve Body --------------------------------------------------------
    KursApproveBody:
      type: object
      required: [signatureMethod]
      properties:
        comment:
          type: string
          maxLength: 1000
          description: "Komentar opsional dari approver untuk audit trail."
          example: "Kurs manual 2026-06-18 telah diverifikasi dengan sumber Bloomberg. Disetujui."
        signatureMethod:
          type: string
          enum: [JWT_STEP_UP, JWT_STANDARD]
          description: "Metode signing. JWT_STEP_UP untuk compliance-audit trail."

    # ---- Reject Body ---------------------------------------------------------
    KursRejectBody:
      type: object
      required: [rejectReason, signatureMethod]
      properties:
        rejectReason:
          type: string
          minLength: 20
          maxLength: 2000
          description: |
            Alasan penolakan WAJIB diisi minimal 20 karakter.
            Constraint: mst.kurs.chk_kurs_reject_reason (DB level).
          example: "Kurs tengah USD 16250 tidak sesuai data BI JISDOR hari ini. Seharusnya 16100."
        signatureMethod:
          type: string
          enum: [JWT_STEP_UP, JWT_STANDARD]

    # ---- Batch Approve Response -----------------------------------------------
    KursBatchApproveResponse:
      type: object
      required:
        - uploadBatchId
        - rowsApproved
        - workflowStatus
        - approvedBy
        - approvedAt
        - message
      properties:
        uploadBatchId:
          type: string
          format: uuid
        rowsApproved:
          type: integer
          minimum: 1
        kursApproved:
          type: array
          items:
            type: object
            required: [kursId, kodeMataUang, tanggalBerlaku, kursTengah, workflowStatus]
            properties:
              kursId:
                type: string
                format: uuid
              kodeMataUang:
                type: string
                example: "USD"
              tanggalBerlaku:
                type: string
                format: date
                example: "2026-06-18"
              kursTengah:
                type: number
                format: double
                example: 16250.00000000
              workflowStatus:
                type: string
                enum: [APPROVED]
        approvedBy:
          type: string
          format: uuid
        approvedAt:
          type: string
          format: date-time
        message:
          type: string

    # ---- Batch Reject Response -----------------------------------------------
    KursBatchRejectResponse:
      type: object
      required:
        - uploadBatchId
        - rowsRejected
        - workflowStatus
        - rejectedBy
        - rejectReason
        - message
      properties:
        uploadBatchId:
          type: string
          format: uuid
        rowsRejected:
          type: integer
          minimum: 1
        workflowStatus:
          type: string
          enum: [REJECTED]
        rejectedBy:
          type: string
          format: uuid
        rejectReason:
          type: string
        message:
          type: string

    # ---- JISDOR Sync Job Response (async §3) --------------------------------
    JisdorSyncJobResponse:
      type: object
      required: [jobId, type, tanggalTarget, statusUrl, streamUrl, message]
      properties:
        jobId:
          type: string
          description: "Asynq job ID untuk tracking via GET /api/v1/jobs/{jobId}."
          example: "job_JISDOR_SYNC_01HXYZ"
        type:
          type: string
          enum: [JISDOR_SYNC]
        tanggalTarget:
          type: string
          format: date
          description: "Tanggal yang di-fetch."
          example: "2026-06-18"
        statusUrl:
          type: string
          description: "URL status job. GET /api/v1/jobs/{jobId}."
          example: "/api/v1/jobs/job_JISDOR_SYNC_01HXYZ"
        streamUrl:
          type: string
          description: "URL SSE stream. GET /api/v1/jobs/{jobId}/stream."
          example: "/api/v1/jobs/job_JISDOR_SYNC_01HXYZ/stream"
        estimatedCurrencies:
          type: integer
          description: "Estimasi jumlah mata uang yang akan di-fetch."
          example: 5
        message:
          type: string

    # ---- Async Export Job Response ------------------------------------------
    AsyncExportJobResponse:
      type: object
      required: [jobId, type, statusUrl, streamUrl, message]
      properties:
        jobId:
          type: string
          example: "job_KURS_EXPORT_01HXYZ"
        type:
          type: string
          enum: [KURS_EXPORT]
        statusUrl:
          type: string
          example: "/api/v1/jobs/job_KURS_EXPORT_01HXYZ"
        streamUrl:
          type: string
          example: "/api/v1/jobs/job_KURS_EXPORT_01HXYZ/stream"
        message:
          type: string

    # ---- FX Treatment Response (S5 — compliance-critical) -------------------
    KursTreatmentResponse:
      type: object
      required:
        - instrumenId
        - kodeInstrumen
        - klasifikasiPsak71
        - matauang
        - klasifikasiLocked
        - fxTreatment
      properties:
        instrumenId:
          type: string
          format: uuid
        kodeInstrumen:
          type: string
          description: "Kode instrumen dari mst.instrumen."
          example: "OBL-2026-00042"
        klasifikasiPsak71:
          type: string
          enum: [AC, FVOCI_DEBT, FVOCI_ELECTION, FVTPL]
          nullable: true
          description: "Klasifikasi PSAK 71 yang telah di-lock."
        matauang:
          type: string
          maxLength: 3
          description: "ISO 4217 currency code instrumen."
          example: "USD"
        klasifikasiLocked:
          type: boolean
          description: |
            TRUE jika klasifikasi_psak71 sudah di-lock (SPPI+BM+Klasifikasi Approve selesai).
            FALSE → KLASIFIKASI_NOT_LOCKED 422.
        klasifikasiLockedAt:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp ketika klasifikasi di-lock."
        fxTreatment:
          type: object
          required: [routing]
          properties:
            routing:
              type: string
              enum:
                - P&L_FOREIGN_EXCHANGE
                - OCI_FOREIGN_EXCHANGE_RESERVE
                - OCI_FOREIGN_EXCHANGE_RESERVE_NO_RECYCLING
                - NO_FX_TREATMENT
              description: |
                Routing decision FX gain/loss:
                - P&L_FOREIGN_EXCHANGE: ke Laporan Laba Rugi (AC + FVTPL + FCY)
                - OCI_FOREIGN_EXCHANGE_RESERVE: ke OCI, recycled ke P&L saat derecognition (FVOCI_DEBT + FCY)
                - OCI_FOREIGN_EXCHANGE_RESERVE_NO_RECYCLING: ke OCI, irrevocable — no recycling (FVOCI_ELECTION + FCY)
                - NO_FX_TREATMENT: tidak ada FX exposure (instrumen IDR)
            accountType:
              type: string
              enum: [P&L, OCI]
              nullable: true
              description: "Target akun jenis: P&L (Laba Rugi) atau OCI (Penghasilan Komprehensif Lain)."
            ociRecycling:
              type: boolean
              nullable: true
              description: |
                TRUE: OCI balance di-recycle ke P&L saat derecognition (FVOCI_DEBT).
                FALSE: OCI balance tidak pernah di-recycle — irrevocable (FVOCI_ELECTION).
                NULL: tidak berlaku (P&L routing atau IDR).
            jurnalEventCode:
              type: string
              nullable: true
              description: |
                Event code untuk jurnal routing (lihat mapping jurnal master P5-M2).
                FX_REALIZED, FX_UNREALIZED, FX_OCI_RESERVE, FX_OCI_RESERVE_NO_RECYCLE, null.
              example: "FX_OCI_RESERVE"
            psak71Reference:
              type: string
              nullable: true
              description: "Referensi pasal PSAK 71 yang menjadi dasar routing."
              example: "PSAK 71 §5.7.10 — FVOCI debt instrument: exchange differences in OCI"
            notes:
              type: string
              nullable: true
              description: "Penjelasan tambahan routing decision."
