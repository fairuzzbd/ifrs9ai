openapi: "3.0.3"
info:
  title: BLIPS IFRS9 — APP-D FX Rate Management (P5-M5)
  version: "1.0.0"
  description: |
    Modul APP-D — FX Rate Management (Phase 5, Module 5).

    Cakupan:
      - List kurs dengan sort + filter + export (S1, S2, S3, S4, S5)
      - Detail single kurs (S1)
      - Manual upload kurs XLSX/CSV — ROLE-AKUN Maker (S2)
      - Approve manual upload — ROLE-AKUN-CTL 4-eyes SoD (S3)
      - Reject manual upload — ROLE-AKUN-CTL 4-eyes SoD (S3)
      - Manual trigger BI JISDOR sync — ROLE-IT-ADMIN, Asynq job (S1)
      - FX treatment routing per klasifikasi PSAK 71 (S5 — ifrs9-compliance-reviewer BLOCKING)

    Dependensi:
      - Phase 3 migration 000020 — mst.kurs existing schema (workflow_status, locked_flag, UNIQUE constraint)
      - P5-M4 (merged) — hard-close approve men-set mst.kurs.locked_flag=TRUE (in-transaction)
      - P5-M5 migration 000039 — NUMERIC precision upgrade + sys.holiday_calendar + kolom tambahan
      - P5-M6 (upcoming) — MTM worker mengkonsumsi GET /master/kurs/treatment/{instrumen_id}
      - DEC-016 (LOCKED) — NUMERIC(20,8) untuk kurs_tengah/beli/jual; shopspring/decimal di Go
      - DEC-017 (LOCKED) — 4-eyes SoD: ROLE-AKUN (maker) ≠ ROLE-AKUN-CTL (approver)
      - DEC-018 (LOCKED) — audit trail append-only, retensi 10+10 tahun
      - DEC-021 (LOCKED) — Idempotency-Key wajib di mutating endpoint
      - DEC-022 (LOCKED) — cursor-based pagination

    State machine mst.kurs.workflow_status:
      PENDING_APPROVAL → (approve, 4-eyes SoD) → APPROVED
      PENDING_APPROVAL → (reject, 4-eyes SoD + reject_reason wajib) → REJECTED
      APPROVED → (periode hard-close, P5-M4 CFO step-up MFA) → APPROVED[locked_flag=TRUE]
      APPROVED[locked_flag=TRUE] → (periode reopen, P5-M4 CFO step-up MFA) → APPROVED[locked_flag=FALSE]
      [JISDOR auto] → APPROVED langsung (bypass 4-eyes — BI JISDOR sudah otoritatif)

    FX Treatment Routing (S5 — compliance-critical):
      AC       + FCY → P&L_FOREIGN_EXCHANGE
      FVTPL    + FCY → P&L_FOREIGN_EXCHANGE
      FVOCI_DEBT     + FCY → OCI_FOREIGN_EXCHANGE_RESERVE (recycling ke P&L saat derecognition)
      FVOCI_ELECTION + FCY → OCI_FOREIGN_EXCHANGE_RESERVE_NO_RECYCLING (irrevocable, PSAK 71 §5.7.5)
      Any      + IDR → NO_FX_TREATMENT

    BI JISDOR Worker (S1):
      Asynq cron "30 3 * * 1-5" (10:30 WIB = 03:30 UTC, Senin–Jumat)
      Skip jika sys.holiday_calendar match tanggal hari ini
      Idempotent: UNIQUE(kode_mata_uang, tanggal_berlaku) — skip jika APPROVED sudah ada
      Rate deviation > 20% → deviation_flag=TRUE + alert ROLE-AKUN + ROLE-AKUN-CTL; tetap insert
      3 retry (interval 15 menit) → DLQ + alert
      Manual trigger via POST /master/kurs/jisdor-sync (ROLE-IT-ADMIN) → Asynq jobId (async, §3)

    Lock enforcement (S4):
      FxRateLockMiddleware: cek locked_flag dari DB sebelum handler mutating
      locked_flag=TRUE → 423 FX_RATE_LOCKED
      DB trigger tg_kurs_locked_check (existing) → RAISE EXCEPTION jika bypass API

    Audit events (all in-transaction kecuali advisory):
      KURS.JISDOR_FETCH, KURS.JISDOR_SKIPPED, KURS.JISDOR_SKIPPED_PENDING_EXISTS (advisory)
      KURS.DEVIATION_WARNING (advisory)
      KURS.JISDOR_FETCH_FAILED (advisory + DLQ)
      KURS.JISDOR_HOLIDAY_SKIP (advisory)
      KURS.MANUAL_UPLOAD_SUBMITTED
      KURS.APPROVED
      KURS.REJECTED
      KURS.LOCKED_BY_PERIODE_CLOSE (dari P5-M4 transaction)
      KURS.UNLOCKED_BY_PERIODE_REOPEN (dari P5-M4 transaction)
      KURS.FX_TREATMENT_QUERIED (sampling advisory)
      KURS.EXPORT
      KURS.INSERT_REJECTED_PERIODE_CLOSED (advisory)
      KURS.APPROVE_REJECTED_SOD (advisory)

    Error codes baru (ditambahkan ke _common.yaml):
      FX_RATE_LOCKED           423 — mst.kurs.locked_flag = TRUE
      KURS_DUPLICATE_DATE      409 — (kode_mata_uang, tanggal_berlaku) sudah APPROVED atau PENDING_APPROVAL
      KURS_UPLOAD_VALIDATION_FAILED 422 — file upload gagal validasi (detail per row)
      KLASIFIKASI_NOT_LOCKED   422 — FX treatment query untuk instrumen tanpa klasifikasi final
      KURS_PERIODE_MISMATCH    422 — tanggal_berlaku tidak dalam periode OPEN manapun

    Performance SLA:
      GET /master/kurs (list):               ≤ 500 ms (cursor paginated, indexed)
      GET /master/kurs/{id}:                 ≤ 100 ms (single row)
      POST /master/kurs/upload:              ≤ 2 s (file parse + batch INSERT + audit)
      POST /master/kurs/upload/{id}/approve: ≤ 300 ms (state update + audit)
      POST /master/kurs/upload/{id}/reject:  ≤ 300 ms (state update + audit)
      POST /master/kurs/jisdor-sync:         ≤ 200 ms (enqueue only; worker async)
      GET /master/kurs/treatment/{id}:       ≤ 100 ms (lookup mst.instrumen)
      GET /master/kurs/export (inline):      ≤ 3 s (≤ 10k row, stream)
      GET /master/kurs/export (async):       ≤ 200 ms (enqueue only)

    Schema changes: handoff → data-modeler, migration 000039.
    BLOCKING compliance gate: S5 (FX treatment routing) → ifrs9-compliance-reviewer.
    Security advisory: SoD enforcement S3, FxRateLockMiddleware S4, audit S2/S3.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: kurs-list
    description: "List, filter, sort, export kurs — DataTable pattern §1"
  - name: kurs-upload
    description: "Manual upload kurs XLSX/CSV (ROLE-AKUN Maker) dan approve/reject 4-eyes (ROLE-AKUN-CTL)"
  - name: kurs-jisdor
    description: "BI JISDOR manual trigger — ROLE-IT-ADMIN; Asynq long-running job (§3)"
  - name: kurs-treatment
    description: "FX gain/loss treatment routing per klasifikasi PSAK 71 — compliance-critical (S5)"

paths:

  # ===========================================================================
  # GET /master/kurs — List dengan sort + filter + export (S1, S2, S3, S4, UX §1)
  # ===========================================================================

  /master/kurs:
    get:
      operationId: kursGetList
      summary: List kurs dengan sort, filter, cursor pagination, dan export
      description: |
        AC: S1-AC1 (JISDOR hasil ter-list), S2-AC1 (upload ter-list PENDING_APPROVAL),
            S3-AC1 (APPROVED ter-list), S4-AC1 (locked_flag=TRUE ter-list)

        Cursor-paginated list mst.kurs. Default sort: tanggal_berlaku DESC, kode_mata_uang ASC.

        Allowed sort columns: tanggal_berlaku, kode_mata_uang, kurs_tengah, workflow_status,
          sumber_kurs, rate_deviation_pct, created_at.

        Filter:
          filter[kode_mata_uang]   — CHAR(3), mis. USD, EUR, JPY, SGD
          filter[tanggal_berlaku]  — date range: ?filter[tanggal_berlaku]=between:2026-06-01,2026-06-30
          filter[workflow_status]  — enum: PENDING_APPROVAL, APPROVED, REJECTED
          filter[sumber_kurs]      — enum: BI_JISDOR, BI_KURS_TENGAH, INTERNAL, MANUAL
          filter[locked_flag]      — boolean: true, false
          filter[deviation_flag]   — boolean: true (hanya tampilkan yang ada deviation warning)
          filter[upload_batch_id]  — UUID, filter per batch upload

        Export:
          ?export=csv atau ?export=xlsx
          Dataset ≤ 10k row → inline (stream Content-Disposition)
          Dataset > 10k row → 202 + jobId (Asynq async ke MinIO, §3 pattern)
          Audit: KURS.EXPORT in-transaction per export

        ROLE-AUDIT dapat akses include_deleted=true.
        ROLE-MAKER-TR tidak memiliki permission kurs.read → 403 FORBIDDEN.

        Permission: kurs.read
        Roles: ROLE-AKUN, ROLE-AKUN-CTL, ROLE-RISK, ROLE-AUDIT, ROLE-IT-ADMIN
        Rate limit: 60 req/min per user (read); 10 req/min per user (export)
      tags: [kurs-list]
      parameters:
        - $ref: "./_common.yaml#/components/parameters/cursor"
        - $ref: "./_common.yaml#/components/parameters/limit"
        - $ref: "./_common.yaml#/components/parameters/sortParam"
        - $ref: "./_common.yaml#/components/parameters/searchParam"
        - name: "filter[kode_mata_uang]"
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            example: "USD"
          description: "Filter berdasarkan kode mata uang (ISO 4217, 3 huruf kapital)."
        - name: "filter[tanggal_berlaku]"
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter tanggal berlaku. Mendukung operator:
            - eq:2026-06-18
            - between:2026-06-01,2026-06-30
            - gte:2026-06-01
            - lte:2026-06-30
          example: "between:2026-06-01,2026-06-30"
        - name: "filter[workflow_status]"
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING_APPROVAL, APPROVED, REJECTED]
          description: "Filter berdasarkan workflow_status kurs."
        - name: "filter[sumber_kurs]"
          in: query
          required: false
          schema:
            type: string
            enum: [BI_JISDOR, BI_KURS_TENGAH, INTERNAL, MANUAL]
          description: "Filter berdasarkan sumber kurs."
        - name: "filter[locked_flag]"
          in: query
          required: false
          schema:
            type: boolean
          description: "Filter berdasarkan locked_flag (true = dalam periode hard-closed)."
        - name: "filter[deviation_flag]"
          in: query
          required: false
          schema:
            type: boolean
          description: "Filter true untuk menampilkan hanya kurs dengan deviasi > 20% dari hari sebelumnya."
        - name: "filter[upload_batch_id]"
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: "Filter berdasarkan batch upload ID."
        - name: export
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xlsx]
          description: |
            Format export. Jika dataset ≤ 10k row → inline file (stream).
            Jika > 10k row → 202 Accepted dengan jobId (async ke MinIO).
        - $ref: "./_common.yaml#/components/parameters/includeDeleted"
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
          description: Trace ID untuk distributed tracing. Gateway inject otomatis.
      responses:
        "200":
          description: List kurs dengan pagination
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KursListItem"
                  pagination:
                    $ref: "./_common.yaml#/components/schemas/PaginationResponse"
                  appliedSort:
                    type: array
                    items:
                      type: object
                      properties:
                        col:
                          type: string
                        dir:
                          type: string
                          enum: [asc, desc]
                  appliedFilter:
                    type: object
                    additionalProperties: true
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    fxRateIdKode: "FX-USD-20260618"
                    kodeMataUang: "USD"
                    tanggalBerlaku: "2026-06-18"
                    kursTengah: 16250.00000000
                    kursBeli: null
                    kursJual: null
                    sumberKurs: "BI_JISDOR"
                    workflowStatus: "APPROVED"
                    lockedFlag: false
                    deviationFlag: false
                    rateDeviationPct: 0.9317
                    periodeKode: "PRD-2026-06"
                    makerId: null
                    approverId: null
                    approvedAt: null
                    rejectReason: null
                    uploadBatchId: null
                    createdAt: "2026-06-18T10:30:05+07:00"
                    createdBy: "00000000-0000-0000-0000-000000000001"
                  - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    fxRateIdKode: "FX-USD-20260617"
                    kodeMataUang: "USD"
                    tanggalBerlaku: "2026-06-17"
                    kursTengah: 19500.00000000
                    kursBeli: null
                    kursJual: null
                    sumberKurs: "BI_JISDOR"
                    workflowStatus: "APPROVED"
                    lockedFlag: false
                    deviationFlag: true
                    rateDeviationPct: 21.1180
                    periodeKode: "PRD-2026-06"
                    makerId: null
                    approverId: null
                    approvedAt: null
                    rejectReason: null
                    uploadBatchId: null
                    createdAt: "2026-06-17T10:30:05+07:00"
                    createdBy: "00000000-0000-0000-0000-000000000001"
                pagination:
                  nextCursor: "eyJpZCI6ImIyYzNkNC4uLiJ9"
                  hasMore: true
                  totalEstimate: 156
                  limit: 50
                appliedSort:
                  - col: "tanggal_berlaku"
                    dir: "desc"
                appliedFilter:
                  kodeMataUang: "USD"
                meta:
                  traceId: "01HXY..."
        "202":
          description: Export async — dataset > 10k row; Asynq job enqueued ke MinIO
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/AsyncExportJobResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  jobId: "job_KURS_EXPORT_01HXYZ"
                  type: "KURS_EXPORT"
                  statusUrl: "/api/v1/jobs/job_KURS_EXPORT_01HXYZ"
                  streamUrl: "/api/v1/jobs/job_KURS_EXPORT_01HXYZ/stream"
                  message: "Export dataset besar dijadwalkan. File akan tersedia via link download setelah selesai."
                meta:
                  traceId: "01HXY..."
        "400":
          $ref: "./_common.yaml#/components/responses/ValidationFailed"
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # GET /master/kurs/{id} — Detail single kurs
  # ===========================================================================

  /master/kurs/{id}:
    get:
      operationId: kursGetDetail
      summary: Detail single kurs rate
      description: |
        AC: S3-AC1 (setelah approve, GET mengembalikan workflow_status='APPROVED')

        Mengembalikan detail lengkap satu baris mst.kurs termasuk:
          - jisdorFetchMetadata (untuk ROLE-IT-ADMIN)
          - rejectReason (jika REJECTED)
          - uploadBatchId + batch summary (jika manual upload)
          - Audit trail summary (createdAt, createdBy, updatedAt)

        ROLE-AUDIT dapat akses include_deleted=true (melalui query param jika soft-deleted).

        Permission: kurs.read
        Rate limit: 60 req/min per user
      tags: [kurs-list]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID dari mst.kurs row."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Detail kurs
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/KursDetail"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              examples:
                approved_jisdor:
                  summary: Kurs JISDOR APPROVED (USD 2026-06-18)
                  value:
                    data:
                      id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      fxRateIdKode: "FX-USD-20260618"
                      kodeMataUang: "USD"
                      tanggalBerlaku: "2026-06-18"
                      kursTengah: 16250.00000000
                      kursBeli: null
                      kursJual: null
                      sumberKurs: "BI_JISDOR"
                      workflowStatus: "APPROVED"
                      lockedFlag: false
                      deviationFlag: false
                      rateDeviationPct: 0.9317
                      rejectReason: null
                      uploadBatchId: null
                      periodeKode: "PRD-2026-06"
                      periodeBulananId: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                      makerId: null
                      approverId: null
                      approvedAt: null
                      jisdorFetchMetadata:
                        url: "https://www.bi.go.id/id/statistik/informasi-kurs/jisdor"
                        fetchedAt: "2026-06-18T03:30:02Z"
                        httpStatus: 200
                        responseHash: "sha256:abc123..."
                        retryCount: 0
                      createdAt: "2026-06-18T10:30:05+07:00"
                      createdBy: "00000000-0000-0000-0000-000000000001"
                      updatedAt: "2026-06-18T10:30:05+07:00"
                      updatedBy: "00000000-0000-0000-0000-000000000001"
                      rowVersion: 1
                    meta:
                      traceId: "01HXY..."
                pending_manual:
                  summary: Kurs manual PENDING_APPROVAL (EUR 2026-06-18)
                  value:
                    data:
                      id: "d4e5f6a7-b8c9-0123-def0-234567890123"
                      fxRateIdKode: "FX-EUR-20260618"
                      kodeMataUang: "EUR"
                      tanggalBerlaku: "2026-06-18"
                      kursTengah: 17530.00000000
                      kursBeli: null
                      kursJual: null
                      sumberKurs: "MANUAL"
                      workflowStatus: "PENDING_APPROVAL"
                      lockedFlag: false
                      deviationFlag: false
                      rateDeviationPct: 0.5800
                      rejectReason: null
                      uploadBatchId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                      periodeKode: "PRD-2026-06"
                      periodeBulananId: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                      makerId: "f6a7b8c9-d0e1-2345-f012-456789012345"
                      approverId: null
                      approvedAt: null
                      jisdorFetchMetadata: null
                      createdAt: "2026-06-18T09:15:00+07:00"
                      createdBy: "f6a7b8c9-d0e1-2345-f012-456789012345"
                      updatedAt: "2026-06-18T09:15:00+07:00"
                      updatedBy: "f6a7b8c9-d0e1-2345-f012-456789012345"
                      rowVersion: 1
                    meta:
                      traceId: "01HXY..."
        "401":
          $ref: "./_common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./_common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./_common.yaml#/components/responses/NotFound"
        "429":
          $ref: "./_common.yaml#/components/responses/RateLimited"
        "500":
          $ref: "./_common.yaml#/components/responses/InternalError"

  # ===========================================================================
  # S2 — MANUAL UPLOAD (ROLE-AKUN, Maker)
  # ===========================================================================

  /master/kurs/upload:
    post:
      operationId: kursUpload
      summary: Upload kurs manual via XLSX/CSV — ROLE-AKUN Maker; returns batch_id + parsing result
      description: |
        AC: S2-AC1, S2-AC2, S2-AC3, S2-AC4

        ROLE-AKUN mengupload file XLSX atau CSV sesuai template baku.
        Sistem memparse, memvalidasi, lalu batch-INSERT ke mst.kurs dengan workflow_status='PENDING_APPROVAL'.

        Template kolom wajib: kode_mata_uang (CHAR3), tanggal_berlaku (DATE), kurs_tengah (NUMERIC).
        Kolom opsional: kurs_beli, kurs_jual, catatan (wajib jika deviasi > threshold).

        Validasi per row:
          1. kode_mata_uang harus ada di mst.mata_uang — KURS_UPLOAD_VALIDATION_FAILED
          2. kurs_tengah > 0 — KURS_UPLOAD_VALIDATION_FAILED
          3. kurs_beli > 0 jika diisi — KURS_UPLOAD_VALIDATION_FAILED
          4. kurs_jual > 0 jika diisi — KURS_UPLOAD_VALIDATION_FAILED
          5. tanggal_berlaku dalam periode OPEN (status_periode='OPEN') — PERIODE_CLOSED (423)
          6. Tidak ada (kode_mata_uang, tanggal_berlaku) dengan status APPROVED atau PENDING_APPROVAL
             sudah ada di mst.kurs — KURS_DUPLICATE_DATE (409)
          7. Deviasi > sys.config JISDOR_RATE_DEVIATION_THRESHOLD_PCT (default 20%):
             catatan WAJIB diisi min 20 karakter — KURS_UPLOAD_VALIDATION_FAILED
          8. tanggal_berlaku harus dalam range periode yang ada di mst.periode_buku OPEN
             — KURS_PERIODE_MISMATCH (422) jika tidak cocok periode manapun

        Jika SEMUA row valid: 202 Accepted + batch INSERT (satu transaksi) + audit per row.
        Jika ADA row tidak valid: 422 KURS_UPLOAD_VALIDATION_FAILED + detail per baris. Tidak ada INSERT.

        File asli disimpan ke MinIO (doc.upload → dokumen_bukti_id per kurs row).
        Notifikasi ke ROLE-AKUN-CTL: "Ada N kurs manual PENDING_APPROVAL dari {maker}."

        Permission: kurs.create
        Roles: ROLE-AKUN
        MFA: tidak wajib
        Idempotency-Key: WAJIB (UUID v4)
        Rate limit: 20 req/min per user
      tags: [kurs-upload]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID v4 unik per request. DEC-021."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    File XLSX atau CSV sesuai template baku.
                    Max size: 5 MB. Max rows: 500 per batch.
                    MIME: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                          atau text/csv.
                catatanUpload:
                  type: string
                  maxLength: 1000
                  description: |
                    Catatan upload untuk keseluruhan batch.
                    Mis. "Upload manual karena JISDOR gangguan 2026-06-18".
                  example: "Upload manual karena JISDOR gangguan 2026-06-18"
                tanggalBerlakuOverride:
                  type: string
                  format: date
                  description: |
                    Opsional. Override tanggal_berlaku untuk semua row di file
                    (berguna jika file tidak mengandung kolom tanggal).
                  example: "2026-06-18"
      responses:
        "202":
          description: Upload berhasil — semua row valid, batch INSERT sukses, status PENDING_APPROVAL
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/KursUploadResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              examples:
                upload_success_3_rows:
                  summary: S2-AC1 — Upload 3 mata uang berhasil, tidak ada deviasi
                  value:
                    data:
                      uploadBatchId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                      rowsParsed: 3
                      rowsValid: 3
                      rowsInvalid: 0
                      status: "PENDING_APPROVAL"
                      kursIds:
                        - "f6a7b8c9-d0e1-2345-f012-456789012345"
                        - "07b8c9d0-e1f2-3456-0123-567890123456"
