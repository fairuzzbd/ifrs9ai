  # ===========================================================================
  # S3 — REJECT MANUAL UPLOAD BATCH (ROLE-AKUN-CTL, 4-eyes SoD)
  # ===========================================================================

  /master/kurs/upload/{batch_id}/reject:
    post:
      operationId: kursUploadBatchReject
      summary: Reject batch upload kurs manual — ROLE-AKUN-CTL; PENDING_APPROVAL → REJECTED
      description: |
        AC: S3-AC2, S3-AC3 (SoD), S3-AC4 (reject_reason wajib)

        ROLE-AKUN-CTL menolak seluruh batch upload kurs. reject_reason WAJIB min 20 karakter.
        Semua kurs PENDING_APPROVAL dalam batch di-set REJECTED atomik.

        Pre-conditions:
          - Batch exists, ada ≥ 1 kurs PENDING_APPROVAL
          - approver_id ≠ batch.maker_id (SoD, DEC-017) — S3-AC3
          - body.rejectReason minLength 20 karakter — S3-AC4

        Sukses (in-transaction):
          - UPDATE mst.kurs SET workflow_status='REJECTED', reject_reason=body.rejectReason,
            approver_id=actor_id, approved_at=now()
            WHERE upload_batch_id={batch_id} AND workflow_status='PENDING_APPROVAL'
          - INSERT aud.audit_log action=KURS.REJECTED per row
          - Notifikasi ke maker: "Kurs manual batch {batch_id} DITOLAK. Alasan: '{reject_reason}'. Harap re-upload."

        Permission: kurs.reject
        Roles: ROLE-AKUN-CTL
        MFA: wajib (DEC-026 ROLE-AKUN-CTL)
        Idempotency-Key: WAJIB
        Rate limit: 20 req/min per user
      tags: [kurs-upload]
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID dari sys.upload_batch (diperoleh dari response POST /master/kurs/upload)."
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID v4 unik per request. DEC-021."
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KursRejectBody"
            example:
              rejectReason: "Kurs tengah USD 16250 tidak sesuai data BI JISDOR hari ini. Seharusnya 16100. Mohon re-upload dengan sumber yang tepat."
              signatureMethod: "JWT_STEP_UP"
      responses:
        "200":
          description: Batch rejected — semua kurs PENDING_APPROVAL dalam batch sekarang REJECTED
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/KursBatchRejectResponse"
                  meta:
                    $ref: "./_common.yaml#/components/schemas/ResponseMeta"
              example:
                data:
                  uploadBatchId: "e5f6a7b8-c9d0-1234-ef01-345678901234"
                  rowsRejected: 3
                  workflowStatus: "REJECTED"
                  rejectedBy: "a9b0c1d2-e3f4-5678-9012-345678901234"
                  rejectReason: "Kurs tengah USD 16250 tidak sesuai data BI JISDOR hari ini. Seharusnya 16100. Mohon re-upload dengan sumber yang tepat."
                  message: "3 kurs dalam batch ditolak. ROLE-AKUN telah dinotifikasi untuk re-upload."
                meta:
                  traceId: "01HXY..."
        "400":
