    PenempatanDepositorListItem:
      type: object
      description: Ringkasan item untuk list/DataTable view
      properties:
        id:
          type: string
          format: uuid
        kodeTransaksi:
          type: string
        instrumenNama:
          type: string
        tipeInstrumen:
          type: string
        klasifikasiPsak71:
          $ref: "#/components/schemas/KlasifikasiPSAK71"
        counterpartyBankNama:
          type: string
        tanggalPenempatan:
          type: string
          format: date
        tanggalJatuhTempo:
          type: string
          format: date
        nominalIdr:
          type: number
          format: double
        kuponPersen:
          type: number
          format: double
        workflowStatus:
          $ref: "#/components/schemas/PenempatanWorkflowStatus"
        makerNama:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    EirPreviewResult:
      type: object
      description: |
        Hasil preview EIR (tidak dipersist). Newton-Raphson per DEC-013.
        Jika instrumen FVTPL/FVOCI_ELECTION: eirAwal = null, info diisi, amortizationSchedule = [].
      properties:
        eirAwal:
          type: number
          format: double
          nullable: true
          description: "EIR result. NUMERIC(10,8). Null jika FVTPL/FVOCI_ELECTION."
        carryingAmountAwal:
          type: number
          format: double
          nullable: true
          description: "Carrying amount awal. NUMERIC(20,4)."
        periodePreview:
          type: integer
          default: 10
          description: Jumlah periode yang ditampilkan (default 10)
        info:
          type: string
          nullable: true
          description: Pesan informatif (misal untuk FVTPL). Null jika normal.
        amortizationSchedule:
          type: array
          items:
            type: object
            properties:
              periode:
                type: integer
              tanggalAngsuran:
                type: string
                format: date
              angsuranBunga:
                type: number
                format: double
              angsuranPokok:
                type: number
                format: double
              carryingAmount:
                type: number
                format: double

    AuditTimelineEvent:
      type: object
      description: |
        Satu event dari aud.audit_log.
        before_jsonb + after_jsonb + ip: hanya tersedia untuk ROLE-AUDIT.
        ROLE-RISK + ROLE-AKUN-CTL: event_time, action, actor_name, actor_role saja.
      properties:
        eventId:
          type: string
          format: uuid
        eventTime:
          type: string
          format: date-time
        action:
          type: string
          description: |
            Event codes yang mungkin:
            PENEMPATAN.CREATED, PENEMPATAN.DOCUMENT_ATTACHED, PENEMPATAN.UPDATED,
            PENEMPATAN.SUBMITTED, PENEMPATAN.REVIEWED, PENEMPATAN.APPROVED,
            PENEMPATAN.REJECTED, PENEMPATAN.WITHDRAWN,
            PENEMPATAN.STAGING_INITIAL, PENEMPATAN.STAGING_SKIPPED_FVTPL,
            PENEMPATAN.EIR_COMPUTED, PENEMPATAN.EIR_PREVIEW,
            PENEMPATAN.MATURED, PENEMPATAN.DERECOGNITION_QUEUED,
            PENEMPATAN.TERMINATE_PROPOSED, PENEMPATAN.TERMINATE_REVIEWED,
            PENEMPATAN.TERMINATE_APPROVED, PENEMPATAN.TERMINATE_REJECTED,
            PENEMPATAN.EXPORT
          example: "PENEMPATAN.APPROVE"
        actorUserId:
          type: string
          format: uuid
        actorNama:
          type: string
          description: JOIN dari sec.user.nama (display name)
        actorRole:
          type: string
          example: "ROLE-APPR-TR"
        beforeJsonb:
          type: object
          nullable: true
          description: State sebelum mutasi. Null untuk CREATE. Hanya ROLE-AUDIT.
        afterJsonb:
          type: object
          nullable: true
          description: State sesudah mutasi. Null untuk DELETE. Hanya ROLE-AUDIT.
        ip:
          type: string
          nullable: true
          description: IP address actor. Hanya ROLE-AUDIT.
        traceId:
          type: string
          nullable: true
        currentHash:
          type: string
          nullable: true
          description: SHA-256 hash chain value dari audit_log row

  # ---------------------------------------------------------------------------
  # Responses (reusable)
  # ---------------------------------------------------------------------------
  responses:
    ValidationFailed:
      description: Validasi field atau cross-field gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: "VALIDATION_FAILED"
              message: "3 field tidak valid"
              details:
                - field: "body.tenorBulan"
                  rule: "min:1"
                  message: "Tenor harus > 0 bulan"
              traceId: "01HXY001"

    Unauthorized:
      description: JWT tidak valid, missing, atau expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Token JWT tidak valid atau sudah expired."
              details: []
              traceId: "01HXY001"

    Forbidden:
      description: Permission tidak terpenuhi atau akses ditolak
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: "FORBIDDEN"
              message: "Anda tidak memiliki permission transaksi.create"
              details: []
              traceId: "01HXY001"

    NotFound:
      description: Entity tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: "NOT_FOUND"
              message: "Penempatan tidak ditemukan"
              details: []
              traceId: "01HXY001"

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: "RATE_LIMITED"
              message: "Terlalu banyak request. Coba lagi dalam 60 detik."
              details: []
              traceId: "01HXY001"

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: "INTERNAL"
              message: "Terjadi kesalahan internal. Hubungi admin dengan traceId."
              details: []
              traceId: "01HXY001"

    WorkflowTransitionSuccess:
      description: Workflow transition berhasil
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  kodeTransaksi:
                    type: string
                  workflowStatus:
                    $ref: "#/components/schemas/PenempatanWorkflowStatus"
                  updatedAt:
                    type: string
                    format: date-time
                  rowVersion:
                    type: integer
              meta:
                $ref: "#/components/schemas/ResponseMeta"
