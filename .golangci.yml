# ---------------------------------------------------------------------------
# BLIPS IFRS9 — golangci-lint configuration
#
# Phase 0 baseline config. Pragmatic set — noise-heavy style linters
# intentionally excluded (see bottom of file). Expand as codebase matures.
#
# golangci-lint v2.6.0
# CI job: backend-lint in .github/workflows/ci.yml
# Convention reference: .claude/memory/git-conventions.md
# ---------------------------------------------------------------------------

version: "2"

run:
  timeout: 5m
  go: "1.24"

# ---------------------------------------------------------------------------
# Linters
# ---------------------------------------------------------------------------

linters:
  default: none
  enable:
    # --- Correctness / bugs ---
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # --- Security (mandatory for regulated software / PII / auth) ---
    - gosec

    # --- Code quality ---
    - gocritic
    - revive
    - misspell
    - bodyclose
    - prealloc
    - unconvert
    - unparam

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - commentedOutCode
        - hugeParam
        - rangeValCopy

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: redefines-builtin-id

    gosec:
      severity: low
      confidence: low
      excludes:
        - G104

    misspell:
      locale: US

    staticcheck:
      checks: ["all"]

    unparam:
      check-exported: false

  exclusions:
    # Test files: relax strict linters — test helpers intentionally ignore
    # errors, use contextless mocks, and don't need pre-allocation hints.
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - prealloc

      # cmd/ entrypoints: unused params are normal for cobra/main commands.
      - path: "cmd/"
        linters:
          - unparam

    # Exclude generated and mock files from all linting.
    paths:
      - ".*\\.gen\\.go$"
      - ".*_mock\\.go$"
      - testdata
      - vendor

# ---------------------------------------------------------------------------
# Formatters
# ---------------------------------------------------------------------------

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - blips-ifrs9.tugu-re.com

# ---------------------------------------------------------------------------
# Issues (v2: only numeric limits and new-from-* diffs here)
# ---------------------------------------------------------------------------

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

# ---------------------------------------------------------------------------
# Linters intentionally NOT enabled (Phase 0 rationale)
# ---------------------------------------------------------------------------
#
# wsl / nlreturn  — Whitespace/blank-line style; too noisy.
# varnamelen      — Short variable names (i, tx, r) are idiomatic Go.
# wrapcheck       — Requires wrapping all external errors; high noise.
# exhaustruct     — Requires all struct fields set; impractical during scaffolding.
# funlen          — Length cap disrupts complex ECL/EIR logic.
# cyclop/gocognit — Complexity caps deferred until logic stabilises.
# godot           — Period at end of comment; pure style.
# lll             — Line length; enforced at code review, not CI.
# godox           — TODO/FIXME; Phase 0 has intentional scaffolding TODOs.
# tagliatelle     — Struct tag style; deferred until API is stable.
# ireturn         — Return interfaces; valid DI pattern.
# ---------------------------------------------------------------------------
