# ---------------------------------------------------------------------------
# BLIPS IFRS9 — GitHub Actions CI
#
# Port from .gitlab-ci.yml (kept in repo as compatibility doc + future
# GitLab-mirror reference). Phase 0 SKELETON.
#
# Akan diperluas mengikuti git-conventions.md branch protection requirements:
#   - security-scan (gitleaks, govulncheck, npm audit, container scan)
#   - integration (testcontainers-go + PostgreSQL/Redis/MinIO)
#   - e2e (Playwright)
#   - compliance gate untuk path internal/ecl, internal/eir, internal/sppi, internal/bm
#
# Status check names (digunakan untuk Branch Protection "Require status checks"):
#   - backend-lint
#   - backend-test
#   - frontend-lint
#   - frontend-build
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
  # Enables manual trigger via GitHub Actions UI → "Run workflow" button.
  # deploy-uat job checks github.ref == refs/heads/develop, so dispatching
  # from a different branch will skip the deploy step gracefully.
  workflow_dispatch:

# Cancel in-progress runs untuk PR yang sama ketika commit baru di-push.
# Hemat runner minutes, hindari race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimum permission untuk GITHUB_TOKEN (security best practice).
# Override per-job kalau butuh more (mis. write content untuk auto-tag).
permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # =========================================================================
  # Backend — Go 1.22 / Gin / sqlx
  # =========================================================================

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    # BLOCKING — Phase 0 finalize sudah hapus allow_failure (lihat
    # commit chore(ci): "enforce backend-lint blocking").
    # Pipeline merah → MR di-block dari merge ke develop/main.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Skip job kalau perubahan tidak menyentuh backend/** atau workflow file.
      # Equivalent ke GitLab rules.changes.
      - id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-go@v5
        if: steps.changed.outputs.backend == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      # Explicitly populate GOMODCACHE from go.sum before golangci-lint runs.
      # Without this, golangci-lint's embedded type-checker may run against
      # an incomplete module cache if setup-go had a partial hit.
      - name: Download Go modules
        if: steps.changed.outputs.backend == 'true'
        run: go mod download

      - uses: golangci/golangci-lint-action@v6
        if: steps.changed.outputs.backend == 'true'
        with:
          version: v1.64.5
          working-directory: backend
          args: ./...
          # skip-cache: prevents golangci-lint-action from restoring its own
          # build-artifact cache. The action keys that cache on lint config +
          # linter version, NOT on go.sum, so a cache entry created in Phase 0
          # (before redis/asynq/minio/migrate were added) gets restored and
          # causes `undefined: redis` / `undefined: jwt` type-check failures
          # even though go.mod + go.sum are correct and `go build` is green.
          # setup-go's GOMODCACHE cache (keyed on go.sum) is still active and
          # provides the module speed-up; only the stale build cache is skipped.
          skip-cache: true

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    # Non-blocking selama Phase 0 (mirror allow_failure: true dari .gitlab-ci.yml).
    # Hapus continue-on-error setelah unit test coverage di module pertama hijau.
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-go@v5
        if: steps.changed.outputs.backend == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      # Same rationale as backend-lint: ensure GOMODCACHE is fully populated
      # before go test runs, regardless of setup-go cache hit/miss status.
      - name: Download Go modules
        if: steps.changed.outputs.backend == 'true'
        run: go mod download

      - name: Run tests with race detector + coverage
        if: steps.changed.outputs.backend == 'true'
        run: |
          go test ./... -race -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee coverage.txt
          # Extract total coverage percentage (logged + parsed by GitHub
          # nya untuk muncul di Actions UI summary).
          TOTAL=$(awk '/^total:/ {print $3}' coverage.txt)
          echo "## Backend test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: \`${TOTAL}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.backend == 'true' && always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.txt
          retention-days: 7

  # =========================================================================
  # Frontend — Next.js 14 / TypeScript / pnpm
  # =========================================================================

  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    # Non-blocking selama Phase 0. Hapus continue-on-error setelah ESLint
    # rule disepakati & legacy warning di-clear.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.frontend == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changed.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.changed.outputs.frontend == 'true'
        run: pnpm lint

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.frontend == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changed.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.changed.outputs.frontend == 'true'
        env:
          # Default API URL untuk CI build. Production build di-override via
          # build-arg saat docker build di pipeline deploy.
          NEXT_PUBLIC_API_URL: "http://localhost:8081"
        run: pnpm build

      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.frontend == 'true' && always()
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1

  # =========================================================================
  # Deploy — UAT
  #
  # Triggers:
  #   - workflow_dispatch (manual button in GitHub Actions UI)
  #   - push to develop (auto-deploy after all checks pass)
  #
  # Prerequisites (wajib dikonfigurasi sebelum job ini fully operational):
  #   - GitHub Environment "uat" dibuat di repo Settings → Environments.
  #   - Secrets pada environment "uat":
  #       UAT_HOST       — hostname/IP UAT server untuk SSH deploy
  #       REGISTRY_URL   — URL internal container registry (mis. registry.tugu-re.local:5000)
  #   - SSH deploy key sudah terpasang di UAT host (~deploy/.ssh/authorized_keys)
  #     dan private key di-store sebagai secret SSH_DEPLOY_KEY.
  #   - .env.uat sudah ada di UAT host: /opt/blips/secrets/.env.uat
  #
  # Setiap step yang masih stub ditandai dengan [NEEDS-DEVOPS].
  # Cari "NEEDS-DEVOPS" di file ini untuk menemukan semua item yang perlu dikerjakan.
  # =========================================================================

  deploy-uat:
    name: deploy-uat
    runs-on: ubuntu-latest
    # Hanya jalan di branch develop (baik dari push otomatis maupun workflow_dispatch).
    if: github.ref == 'refs/heads/develop'
    # Semua gate CI harus hijau sebelum deploy.
    needs:
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-build
    # Hanya satu deploy-uat boleh berjalan bersamaan.
    # Jika ada deploy sedang berjalan saat push baru masuk, yang baru akan
    # menunggu (pending) — bukan membatalkan yang sedang berjalan.
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    # GitHub Environment "uat" — memberikan akses ke environment secrets
    # (UAT_HOST, REGISTRY_URL, dst) dan memungkinkan protection rules
    # (required reviewers, wait timer) di-set per-environment di repo Settings.
    environment: uat
    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Hitung short SHA untuk image tagging yang immutable (DEC-008 anti-pattern
      # melarang mutable tag seperti :latest sebagai satu-satunya tag).
      # -----------------------------------------------------------------------
      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=uat-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=uat-latest" >> "$GITHUB_OUTPUT"
          echo "Image tags: uat-${SHORT_SHA}, uat-latest"

      # -----------------------------------------------------------------------
      # [NEEDS-DEVOPS] Build backend Docker image
      # Setelah registry dikonfigurasi, ganti echo dengan:
      #   docker build \
      #     -t ${{ secrets.REGISTRY_URL }}/blips/backend:uat-${{ steps.tags.outputs.short_sha }} \
      #     -t ${{ secrets.REGISTRY_URL }}/blips/backend:uat-latest \
      #     backend/
      # -----------------------------------------------------------------------
      - name: Build backend image
        run: |
          echo "[NEEDS-DEVOPS] docker build backend/ -t <REGISTRY_URL>/blips/backend:${{ steps.tags.outputs.tag_sha }} -t <REGISTRY_URL>/blips/backend:${{ steps.tags.outputs.tag_latest }}"

      # -----------------------------------------------------------------------
      # [NEEDS-DEVOPS] Build frontend Docker image
      # -----------------------------------------------------------------------
      - name: Build frontend image
        run: |
          echo "[NEEDS-DEVOPS] docker build frontend/ --build-arg NEXT_PUBLIC_API_URL=<UAT_API_URL> -t <REGISTRY_URL>/blips/frontend:${{ steps.tags.outputs.tag_sha }} -t <REGISTRY_URL>/blips/frontend:${{ steps.tags.outputs.tag_latest }}"

      # -----------------------------------------------------------------------
      # [NEEDS-DEVOPS] Push images ke internal registry
      # Setelah registry dikonfigurasi dan docker login tersedia:
      #   docker push ${{ secrets.REGISTRY_URL }}/blips/backend:uat-${{ steps.tags.outputs.short_sha }}
      #   docker push ${{ secrets.REGISTRY_URL }}/blips/backend:uat-latest
      #   docker push ${{ secrets.REGISTRY_URL }}/blips/frontend:uat-${{ steps.tags.outputs.short_sha }}
      #   docker push ${{ secrets.REGISTRY_URL }}/blips/frontend:uat-latest
      # -----------------------------------------------------------------------
      - name: Push images to registry
        run: |
          echo "[NEEDS-DEVOPS] push to registry ${{ vars.REGISTRY_URL || '<REGISTRY_URL not configured>' }}"
          echo "[NEEDS-DEVOPS] docker push <REGISTRY_URL>/blips/backend:${{ steps.tags.outputs.tag_sha }}"
          echo "[NEEDS-DEVOPS] docker push <REGISTRY_URL>/blips/frontend:${{ steps.tags.outputs.tag_sha }}"

      # -----------------------------------------------------------------------
      # [NEEDS-DEVOPS] SSH ke UAT host dan deploy via docker compose
      # Setelah UAT_HOST secret + SSH_DEPLOY_KEY secret dikonfigurasi, ganti dengan:
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.UAT_HOST }}
      #     username: deploy
      #     key: ${{ secrets.SSH_DEPLOY_KEY }}
      #     script: |
      #       cd /opt/blips/ifrs9ai
      #       git pull origin develop
      #       docker compose -f deploy/docker/docker-compose.uat.yml \
      #         --env-file /opt/blips/secrets/.env.uat \
      #         pull
      #       docker compose -f deploy/docker/docker-compose.uat.yml \
      #         --env-file /opt/blips/secrets/.env.uat \
      #         up -d --remove-orphans
      #       docker compose -f deploy/docker/docker-compose.uat.yml \
      #         run --rm migrator up
      # -----------------------------------------------------------------------
      - name: Deploy to UAT host
        run: |
          echo "[NEEDS-DEVOPS] ssh deploy@${{ vars.UAT_HOST || '<UAT_HOST not configured>' }} 'cd /opt/blips/ifrs9ai && git pull origin develop && docker compose -f deploy/docker/docker-compose.uat.yml --env-file /opt/blips/secrets/.env.uat up -d --remove-orphans'"
          echo "[NEEDS-DEVOPS] run migrator: docker compose -f deploy/docker/docker-compose.uat.yml run --rm migrator up"

      # -----------------------------------------------------------------------
      # [NEEDS-DEVOPS] Smoke test — verifikasi layanan UP setelah deploy
      # Setelah deploy aktif, ganti dengan:
      #   curl -fs https://<UAT_HOST>/healthz || (echo "Backend healthz FAILED" && exit 1)
      #   curl -fs https://<UAT_HOST>/readyz  || (echo "Backend readyz FAILED" && exit 1)
      # -----------------------------------------------------------------------
      - name: Smoke test — health endpoints
        run: |
          echo "[NEEDS-DEVOPS] curl health endpoint after deploy"
          echo "[NEEDS-DEVOPS] curl -fs http://${{ vars.UAT_HOST || '<UAT_HOST>' }}:8081/healthz"
          echo "[NEEDS-DEVOPS] curl -fs http://${{ vars.UAT_HOST || '<UAT_HOST>' }}:8081/readyz"

      # -----------------------------------------------------------------------
      # Summary — ditampilkan di GitHub Actions job summary
      # -----------------------------------------------------------------------
      - name: Deployment summary
        if: always()
        run: |
          echo "## UAT Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ steps.tags.outputs.tag_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} via ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Status**: STUB — semua deploy step masih [NEEDS-DEVOPS]. Lihat job log untuk detail." >> "$GITHUB_STEP_SUMMARY"
